<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUN Maintenance & Housekeeping</title>
<style>
:root{
  --bg:#f4f5f2;--panel:#ffffff;--panel2:#f8f9f6;--ink:#1d2421;--ink2:#4f5a55;--muted:#7a847f;--line:#dde2dc;--line2:#eceee9;
  --acc:#1f6f5c;--acc2:#e3f1ec;--accink:#ffffff;
  --ok:#1e7a46;--okbg:#e2f3e8;--warn:#9a6200;--warnbg:#fdf0d6;--bad:#b3261e;--badbg:#fbe4e1;
  --urg:#b3261e;--high:#c76a00;--norm:#4d6a8a;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121614;--panel:#1a1f1d;--panel2:#202624;--ink:#e6ebe8;--ink2:#b5bfba;--muted:#8a948f;--line:#2e3633;--line2:#262d2a;
  --acc:#4fb596;--acc2:#1f3a32;--accink:#0d1311;
  --ok:#6fd39a;--okbg:#18342a;--warn:#f0b54a;--warnbg:#3a2e14;--bad:#ff8a80;--badbg:#3d1d1b;
  --urg:#ff8a80;--high:#f0a35a;--norm:#8fb0d4;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121614;--panel:#1a1f1d;--panel2:#202624;--ink:#e6ebe8;--ink2:#b5bfba;--muted:#8a948f;--line:#2e3633;--line2:#262d2a;--acc:#4fb596;--acc2:#1f3a32;--accink:#0d1311;--ok:#6fd39a;--okbg:#18342a;--warn:#f0b54a;--warnbg:#3a2e14;--bad:#ff8a80;--badbg:#3d1d1b;--urg:#ff8a80;--high:#f0a35a;--norm:#8fb0d4;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:var(--acc)}
h1{font-size:20px;margin:0;font-weight:650}h2{font-size:17px;margin:0}h3{font-size:15px;margin:0 0 10px;font-weight:650}h4{font-size:13px;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.muted{color:var(--muted)}.small,small{font-size:12px}.sm{font-size:12px}
/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--panel)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.15}.brand b{color:var(--acc);font-size:15px}.brand span{font-size:12px;color:var(--ink2)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}.sync.bad{color:var(--bad);font-weight:600}.sync.busy{color:var(--warn)}
.psr{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.exb{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--warnbg);color:var(--warn);white-space:nowrap}
.sp{flex:1}.who{display:flex;flex-direction:column;text-align:right;line-height:1.15}.who small{color:var(--muted)}
.menu{display:none;background:none;border:0;font-size:22px;color:var(--ink);cursor:pointer}
.body{display:flex;min-height:calc(100vh - 53px)}
nav{width:230px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:8px 8px 40px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto}
nav .ng{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 8px 4px}
nav a{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;color:var(--ink);text-decoration:none}
nav a small{color:var(--muted);font-size:11px;white-space:nowrap}nav a:hover{background:var(--panel2)}nav a.on{background:var(--acc2);color:var(--acc);font-weight:600}
main{flex:1;min-width:0;padding:16px 20px 60px}
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.fmt{font-size:12px;color:var(--acc);font-weight:600}.vtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* buttons and inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:550;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}.btn.full{width:100%;margin-top:14px;padding:10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
input:disabled,select:disabled,textarea:disabled{background:var(--panel2);color:var(--ink2);opacity:1}
input.n{text-align:right}
.mp{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2)}.mp select{width:auto}
/* cards, tiles */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.bad{border-color:var(--bad);color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two>.card{margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.tile[data-act]{cursor:pointer}.tile[data-act]:hover{border-color:var(--acc)}
.tile span{font-size:12px;color:var(--ink2)}.tile b{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;margin:2px 0}.tile small{color:var(--muted)}
.tile.bad b{color:var(--bad)}.tile.ok b{color:var(--ok)}.tile.warn b{color:var(--warn)}
.note{padding:8px 12px;border-radius:8px;background:var(--acc2);color:var(--ink);margin:8px 0}.note.warn{background:var(--warnbg)}
.sum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--panel2);border-radius:8px;margin:8px 0;font-size:13px}
/* flags */
.flag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:550;white-space:nowrap;background:var(--warnbg);color:var(--warn)}
.flag.ok{background:var(--okbg);color:var(--ok)}.flag.bad{background:var(--badbg);color:var(--bad)}
/* tables */
.ttools{display:flex;gap:8px;align-items:center;margin:4px 0 8px}.ttools input{max-width:260px}.ttools .cnt{color:var(--muted);font-size:12px;flex:1}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:70vh}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
thead th{position:sticky;top:0;background:var(--panel2);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap;z-index:1}
td.n,th.n{text-align:right;white-space:nowrap}
.tw>table>tbody>tr>td{white-space:nowrap}.tw>table>tbody>tr>td.wrap{white-space:normal}
tfoot td{background:var(--panel2);font-weight:600}
tr.click{cursor:pointer}tr.click:hover td{background:var(--acc2)}
td.empty{text-align:center;color:var(--muted);padding:20px}
table.ex td{border-bottom:1px solid var(--line2)}table.ex small{display:block;color:var(--muted)}
table.kv{border:1px solid var(--line2);border-radius:8px}table.kv th{background:var(--panel2);font-weight:550;color:var(--ink2);width:22%;font-size:12px}
table.mini{font-size:12px;border:1px solid var(--line2)}
.bar{position:relative;height:18px;background:var(--line2);border-radius:4px;min-width:100px}.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);border-radius:4px;opacity:.6}.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}.bar span{position:relative;font-size:11px;padding-left:6px}
/* forms */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}.grid.g6{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}.grid.q3{grid-template-columns:2fr 1fr 2fr 1fr 2fr 1fr}
.fld{display:flex;flex-direction:column;gap:3px;position:relative}.fld.full{grid-column:1/-1}.fld label{font-size:12px;color:var(--ink2);font-weight:550}.fld label i{color:var(--bad);font-style:normal}
.fld small{color:var(--muted)}.fld .ro{padding:6px 0}.fld .unit{position:absolute;right:10px;bottom:7px;color:var(--muted);font-size:12px}.haspct input{padding-right:24px}.g6 .fld input{padding-right:24px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}.chk input{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.lines table td{padding:4px}.lines input,.lines select{padding:4px 6px}.lines{max-height:none;margin-bottom:6px}
.x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;line-height:1}.x:hover{color:var(--bad)}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,15,13,.45);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
#modal.open{display:flex}
.mbox{background:var(--panel);border-radius:12px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:92vh}
.mbox.wide{max-width:1100px}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}.mhead h2{flex:none}.msub{color:var(--muted);flex:1}.mhead .x{margin-left:auto}
.mbody{padding:12px 16px;overflow:auto}.mfoot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:8px;z-index:60;transition:transform .2s;max-width:90vw;box-shadow:var(--shadow)}
#toast.show{transform:translateX(-50%) translateY(0)}#toast.bad{background:var(--bad);color:#fff}#toast.ok{background:var(--ok);color:#fff}#toast.warn{background:var(--warn);color:#fff}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:420px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.lbrand{color:var(--acc);font-weight:650;font-size:13px}.lcard h1{font-size:22px;margin-bottom:4px}.lcard label{font-size:12px;color:var(--ink2);margin-top:8px}
.err{color:var(--bad);min-height:18px;font-size:13px}.notes{font-size:12px;color:var(--muted);padding-left:18px;margin:12px 0 0}
/* service desk */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:120px}
.kcol h4{margin:0 0 8px;display:flex;justify-content:space-between}.kcol h4 span{background:var(--panel);border-radius:20px;padding:0 8px;color:var(--ink)}
.jc{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--norm);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.jc.p-Urgent{border-left-color:var(--urg)}.jc.p-High{border-left-color:var(--high)}.jc.late{background:var(--badbg)}
.jt{display:flex;gap:6px;align-items:center;font-size:12px}.jt a{margin-left:auto;font-weight:600}
.pr{font-size:11px;font-weight:650;padding:0 6px;border-radius:4px;color:#fff;background:var(--norm)}.pr.Urgent{background:var(--urg)}.pr.High{background:var(--high)}
:root[data-theme="dark"] .pr,.pr{color:#fff}
.ty{font-size:11px;color:var(--ink2)}.jl{font-weight:600;margin-top:3px}.jp{font-size:13px}.jm{font-size:12px;color:var(--muted)}
.js{font-size:12px;font-weight:600;color:var(--ok);margin-top:2px}.js.bad{color:var(--bad)}.js.warn{color:var(--warn)}
.ja{display:flex;gap:6px;margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;margin-bottom:10px;align-items:center}.legend .rs{padding:1px 8px;border-radius:5px}
.floor{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}.floor>b{width:60px;flex:none;font-size:12px;padding-top:6px;color:var(--ink2)}
.rooms{display:flex;flex-wrap:wrap;gap:4px}
.room{position:relative;width:46px;height:32px;border-radius:6px;border:1px solid var(--line);font:600 12px/1 inherit;cursor:pointer;color:var(--ink)}
.rs.Ready{background:var(--okbg);color:var(--ok)}.rs.Occupied{background:var(--acc2);color:var(--acc)}.rs.Being{background:var(--warnbg);color:var(--warn)}.rs.Out{background:var(--bad);color:#fff}
.dot{position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--urg);display:inline-block}.legend .dot{position:relative;top:0;right:0}
.cfg{position:absolute;bottom:1px;right:3px;font-size:9px;font-style:normal;font-weight:700}.legend .cfg{position:relative;font-size:10px;border:1px solid var(--line);padding:0 3px;border-radius:3px}
.acc td{text-align:center}.acc td:first-child,.acc td:nth-child(2){text-align:left}.acc select{width:52px;padding:3px}
.ar.rE{background:var(--okbg)}.ar.rV{background:var(--acc2)}.ar.rH{background:var(--panel2);color:var(--muted)}
ol.flow li,.card ul li{margin-bottom:6px}
/* print preview */
.preview{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:20px;overflow:auto}
#print{display:none}
@media (max-width:900px){
  .menu{display:block}nav{position:fixed;left:0;top:53px;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}nav.open{transform:none}
  main{padding:12px 16px 60px}.two,.kanban{grid-template-columns:1fr}.grid.q3{grid-template-columns:1fr 1fr}.who small{display:none}.exb{display:none}
}
@media (max-width:520px){.who{display:none}.brand span{display:none}.tile b{font-size:20px}}
</style>
<style id="printcss">
@media print{
  body *{visibility:hidden}#print,#print *{visibility:visible}#print{display:block;position:absolute;left:0;top:0;width:100%}
  @page{size:A4;margin:12mm}
}
.doc{font:11.5px/1.4 "Segoe UI",Arial,sans-serif;color:#111;background:#fff}
.doc .dh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1f6f5c;padding-bottom:6px;margin-bottom:10px}
.doc .dt{font-size:15px;font-weight:700;color:#1f6f5c;text-align:right;max-width:60%}
.doc table{width:100%;border-collapse:collapse;margin:6px 0}.doc th,.doc td{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}
.doc table.kv th{background:#f0f2ef;width:20%;font-weight:600}.doc table.lt th{background:#f0f2ef}.doc .n{text-align:right}
.doc tr.tot td{font-weight:700;background:#f7f7f5}.doc h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;color:#333}
.doc table.sig td{border:0;padding:30px 10px 4px;text-align:center;font-size:11px}.doc .sig .line{border-top:1px solid #333;margin-bottom:4px}
.doc .small{font-size:10.5px;color:#444}.doc .dfoot{margin-top:14px;font-size:10px;color:#666;border-top:1px solid #ccc;padding-top:4px}
</style>

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="print"></div>
<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script> <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script> <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ---- firebase.js ---- */
/* Firebase host: when the app runs on GitHub Pages, records live in the organisation's own Firebase project
   (Firestore) and people log in with the email + password accounts created in Firebase Authentication.
   This file gives the app the same small interface it uses on claude.ai (claude.use('db' | 'user' | 'downloads')),
   so the rest of the app is unchanged. FIREBASE_CONFIG comes from config.js. */
(function () {
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase) { window.KUN_HOST = 'unconfigured'; window.KUN_FB_ERROR = 'The Firebase library could not be loaded. Check the internet connection and reload.'; return; }
  if (!cfg || !cfg.apiKey || /PASTE/i.test(cfg.apiKey) || !cfg.projectId) { window.KUN_HOST = 'unconfigured'; return; }
  window.KUN_HOST = 'firebase';
  firebase.initializeApp(cfg);
  const auth = firebase.auth(), fs = firebase.firestore();

  const codeOf = e => ({ 'permission-denied': 'invalid_argument', 'not-found': 'invalid_argument', 'invalid-argument': 'invalid_argument', 'resource-exhausted': 'resource_exhausted', 'unauthenticated': 'revoked' })[e && e.code] || 'unavailable';
  const fail = e => { throw { code: codeOf(e), message: (e && e.message) || String(e) }; };
  const snap = d => ({ id: d.id, exists: d.exists, data: () => d.data(), metadata: { fromCache: d.metadata.fromCache, hasPendingWrites: d.metadata.hasPendingWrites } });
  const docRef = path => {
    const r = fs.doc(path);
    return {
      id: r.id, path,
      get: () => r.get().then(snap, fail),
      set: d => r.set(d).catch(fail),
      update: d => r.set(d, { merge: true }).catch(fail),   // nested merge, arrays replaced
      delete: () => r.delete().catch(fail),
      onSnapshot: (next, err) => r.onSnapshot(s => next(snap(s)), e => err && err({ code: codeOf(e), message: e.message })),
      acquire: o => fs.runTransaction(async t => {
        const s = await t.get(r), l = s.exists ? (s.data() || {}).__lease : null, now = Date.now();
        if (l && l.until > now && l.holder !== o.holder) return { acquired: false };
        t.set(r, { __lease: { holder: o.holder, until: now + Math.min(Math.max(o.ttlMs || 30000, 1000), 600000) } }, { merge: true });
        return { acquired: true, holder: o.holder };
      }).catch(fail),
      collection: p => colRef(path + '/' + p),
    };
  };
  const colRef = path => ({
    path, doc: id => docRef(path + '/' + id),
    onSnapshot: (next, err) => fs.collection(path).onSnapshot(q => next({ docs: q.docs.map(snap), size: q.size, empty: q.empty, docChanges: () => [], metadata: { fromCache: q.metadata.fromCache, hasPendingWrites: q.metadata.hasPendingWrites } }), e => err && err({ code: codeOf(e), message: e.message })),
    get: () => fs.collection(path).get().then(q => ({ docs: q.docs.map(snap), size: q.size, empty: q.empty }), fail),
  });

  // People directory: each account records its email when it logs in, so the Admin can find and link it.
  let people = null;
  const loadPeople = async () => { if (!people) { const q = await fs.collection('people').get(); people = {}; q.docs.forEach(d => { people[d.id] = d.data(); }); } return people; };
  const prof = (id, p) => ({ id, name: (p && (p.name || p.email)) || '', email: (p && p.email) || null, avatarUrl: '', color: '#6b7a74', isMe: !!auth.currentUser && id === auth.currentUser.uid, guest: false });

  let resolveUser; const signedIn = new Promise(r => { resolveUser = r; });
  auth.onAuthStateChanged(u => {
    if (u) {
      fs.doc('people/' + u.uid).set({ email: u.email || '', name: u.displayName || u.email || '', lastLogin: new Date().toISOString() }, { merge: true }).catch(() => { });
      resolveUser(u);
    } else showLogin();
  });

  const userApi = {
    me: async () => { const u = auth.currentUser; return { id: u ? u.uid : null, name: u ? (u.displayName || u.email || '') : '', email: u ? u.email : null, avatarUrl: '', color: '#6b7a74', isOwner: false, canEdit: true }; },
    id: async () => auth.currentUser ? auth.currentUser.uid : null,
    isOwner: async () => false, canEdit: async () => true, can: async () => true,
    profiles: async ids => { const p = await loadPeople().catch(() => ({})); return Object.fromEntries([].concat(ids).map(i => [i, prof(i, p[i])])); },
    search: async q => { people = null; const p = await loadPeople().catch(() => ({})); q = (q || '').toLowerCase(); return Object.entries(p).filter(([, v]) => !q || (v.email || '').toLowerCase().includes(q) || (v.name || '').toLowerCase().includes(q)).slice(0, 8).map(([id, v]) => prof(id, v)); },
  };
  const downloadsApi = {
    save: async ({ filename, data }) => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); a.download = filename;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      return { status: 'saved' };
    },
  };
  window.claude = { use: async name => { await signedIn; return name === 'db' ? { doc: docRef, collection: colRef } : name === 'user' ? userApi : name === 'downloads' ? downloadsApi : null; } };

  function showLogin() {
    const app = document.getElementById('app'); if (!app) return setTimeout(showLogin, 50);
    app.innerHTML = `<div class="login"><form class="lcard" id="fbForm">

  const no = `${S.settings.prefix}/${type}/${y}/${pad4(seq)}`;
  S.numlog.push({ type, seq, no, t: nowDT(), by: U ? U.id : '-' });
  return no;
}
// Issues the next number; the shared version (shared.js) replaces this with one that takes a lock first.
let allocNumber = async type => newNumber(type);

/* ---------- master lookups ---------- */
const item = code => S.items.find(i => i.code === code);
const itemName = code => { const i = item(code); return i ? i.name : code; };
const cat = name => S.categories.find(c => c.name === name);
const itemLine = code => { const i = item(code); const c = i && cat(i.cat); return c ? c.line : ''; };
const itemType = code => { const i = item(code); const c = i && cat(i.cat); return c ? c.type : ''; };
const isStock = code => itemType(code) === 'Stock item';
const vendor = name => S.vendors.find(v => v.name === name);
const bline = code => S.budgetLines.find(b => b.code === code);
const findPO = no => S.pos.find(p => p.no === no);
const userName = () => U ? U.name : '';

function mplRate(code, vend) {
  const rows = S.mpl.rows.filter(r => r.item === code && num(r.rate) > 0);
  if (!rows.length) return null;
  const v = rows.find(r => r.vendor === vend);
  if (v) return { rate: num(v.rate), src: 'vendor', row: v };
  const low = rows.reduce((a, b) => num(a.rate) <= num(b.rate) ? a : b);
  return { rate: num(low.rate), src: 'lowest', row: low };
}
const lowRate = code => { const r = mplRate(code, null); return r ? r.rate : 0; };

/* ---------- budget and occupancy ---------- */
function zdPlanned(m) { const o = S.settings.occupancy[m - 1]; return Math.round(S.settings.capacity * num(o.plan) * daysInMonth(S.settings.year, m)); }
function zdUsed(m) { const o = S.settings.occupancy[m - 1]; return (o.actual !== null && o.actual !== '' && o.actual !== undefined) ? num(o.actual) : zdPlanned(m); }
function monthBudget(code, m) {
  const b = bline(code); if (!b) return 0;
  if (b.basis === 'VAR') { let t = 0; for (let i = 1; i <= 12; i++) t += zdUsed(i); return t ? num(b.annual) * zdUsed(m) / t : 0; }
  return num(b.annual) * daysInMonth(S.settings.year, m) / (isLeap(S.settings.year) ? 366 : 365);
}
function ytdBudget(code, m) { let t = 0; for (let i = 1; i <= m; i++) t += monthBudget(code, i); return t; }

/* ---------- calculation engine ---------- */
const sev = t => {
  if (!t) return '';
  if (/^(OK|Closed|Paid|Clear|Adjusted|Approved|Ready|Done)/i.test(t)) return 'ok';
  if (/(OVER|No PO|not allowed|EXPIRED|Excess|Duplicate|Negative|OVERDUE|cancelled|more than|not found|Not on PO|use GRN|use SRN|above limit|Exceeds|before PO|PO closed|Out of order|Short of par)/i.test(t)) return 'bad';
  return 'warn';
};

function recalc() {
  const st = S.settings, tol = num(st.priceTol);
  C = { po: {}, grn: [], srn: [], adv: {}, bill: {}, iss: [], stock: {}, jobs: {}, ppm: {}, laundry: {}, missing: [] };

  // PO lines and values
  S.pos.forEach(p => {
    const lines = p.lines.map((l, i) => {
      const amount = num(l.qty) * num(l.rate);
      const m = mplRate(l.item, p.vendor);
      const diff = m ? num(l.rate) / m.rate - 1 : null;
      let price = !item(l.item) ? 'Item not in master' : !m ? 'Not on MPL' : diff > tol + 1e-9 ? `Above MPL +${(diff * 100).toFixed(0)}%` : 'OK';
      const il = itemLine(l.item);
      const check = !l.item ? 'Item missing' : num(l.qty) <= 0 ? 'Qty missing' : num(l.rate) <= 0 ? 'Rate missing' : (il && il !== p.line) ? `Item budget line ${il} differs from PO line` : 'OK';
      return { i, item: l.item, qty: num(l.qty), rate: num(l.rate), amount, mpl: m ? m.rate : null, diff, price, check, type: itemType(l.item), unit: (item(l.item) || {}).unit || '' };
    });
    const value = lines.reduce((a, l) => a + l.amount, 0);
    C.po[p.no] = { lines, value, recQty: {}, received: 0, billed: 0, paidNet: 0, advPaid: 0, advAdj: 0 };
  });

  // GRN rows
  const cumAcc = {};
  S.grns.slice().sort((a, b) => (a.date + a.no).localeCompare(b.date + b.no)).forEach(g => {
    const p = findPO(g.po), pc = p && C.po[p.no];
    g.lines.forEach((l, i) => {
      const pl = pc && pc.lines.find(x => x.item === l.item);
      const recd = num(l.recd), acc = num(l.acc), rej = recd - acc;
      const key = g.po + '|' + l.item; cumAcc[key] = (cumAcc[key] || 0) + acc;
      const flags = [];
      if (!g.po) flags.push('No PO - not allowed');
      else if (!p) flags.push('PO not found');
      else {
        if (p.cancel) flags.push('PO cancelled');
        if (p.closedOn && g.date > p.closedOn.slice(0, 10)) flags.push('PO closed');
        if (!p.approvedBy) flags.push('PO not yet approved');
        if (!pl) flags.push('Item not on PO');
        else if (pl.type !== 'Stock item') flags.push('Service item - use SRN');
        if (pl && cumAcc[key] > pl.qty + 1e-9) flags.push('Excess over PO qty');
      }
      if (acc > recd) flags.push('Accepted more than received');
      if (rej > 0) flags.push('Rejected ' + fmtQ(rej) + ' (return / debit note)');
      if (!g.by) flags.push('Received by missing');
      const rate = pl ? pl.rate : 0, val = acc * rate;
      if (pc && pl && !p.cancel) { pc.recQty[l.item] = (pc.recQty[l.item] || 0) + acc; pc.received += val; }
      C.grn.push({ g, l, i, vendor: p ? p.vendor : '', poQty: pl ? pl.qty : null, rate, val, rej, cum: cumAcc[key], bal: pl ? pl.qty - cumAcc[key] : null, line: p ? p.line : '', mk: mkey(g.date), check: flags.length ? flags.join('; ') : 'OK' });
    });
  });

  // SRN rows
  const cumS = {};
  S.srns.slice().sort((a, b) => (a.date + a.no).localeCompare(b.date + b.no)).forEach(s => {
    const p = findPO(s.po), pc = p && C.po[p.no];
    s.lines.forEach((l, i) => {
      const pl = pc && pc.lines.find(x => x.item === l.item);
      const q = num(l.qty); const key = s.po + '|' + l.item; cumS[key] = (cumS[key] || 0) + q;
      const flags = [];
      if (!s.po) flags.push('No PO - not allowed');
      else if (!p) flags.push('PO not found');
      else {
        if (p.cancel) flags.push('PO cancelled');
        if (p.closedOn && s.date > p.closedOn.slice(0, 10)) flags.push('PO closed');
        if (!pl) flags.push('Service not on PO');
        else if (pl.type === 'Stock item') flags.push('Stock item - use GRN');
        if (pl && cumS[key] > pl.qty + 1e-9) flags.push('Excess over PO qty');
      }
      if (!s.prepBy || !s.confBy) flags.push('Preparer / user confirmation missing');
      const rate = pl ? pl.rate : 0, val = q * rate;
      if (pc && pl && !p.cancel) { pc.recQty[l.item] = (pc.recQty[l.item] || 0) + q; pc.received += val; }
      C.srn.push({ s, l, i, vendor: p ? p.vendor : '', poQty: pl ? pl.qty : null, rate, val, cum: cumS[key], bal: pl ? pl.qty - cumS[key] : null, line: p ? p.line : '', mk: mkey(s.date), check: flags.length ? flags.join('; ') : 'OK' });
    });
  });

  // Advances
  const advSoFar = {};
  S.advances.slice().sort((a, b) => a.no.localeCompare(b.no)).forEach(a => {
    const p = findPO(a.po), pc = p && C.po[p.no];
    const value = pc ? pc.value : 0, ap = p ? num(p.adv) : 0;
    const earlier = advSoFar[a.po] || 0; advSoFar[a.po] = earlier + num(a.amount);
    const allowed = Math.max(0, value * ap - earlier);
    const flags = [];
    if (!a.po) flags.push('No PO - not allowed'); else if (!p) flags.push('PO not found');
    else {
      if (p.cancel) flags.push('PO cancelled - recover advance');
      if (p.closedOn && a.date > p.closedOn.slice(0, 10)) flags.push('PO closed');
      if (ap <= 0) flags.push('Advance not in PO terms');
      else if (num(a.amount) > allowed + 0.5) flags.push('Above allowed advance');
      if (ap > num(st.maxAdv) && !/sigat/i.test(a.apprBy || '')) flags.push('Advance above limit - Sigat approval');
    }
    if (!a.apprBy) flags.push('Approval not recorded');
    if (pc && a.paidDate) pc.advPaid += num(a.amount);
    C.adv[a.no] = { vendor: p ? p.vendor : '', value, ap, allowed, earlier, check: flags.length ? flags.join('; ') : 'OK' };
  });

  // Bills
  const advAdjSoFar = {}, billedSoFar = {};
  const invKey = {};
  S.bills.forEach(b => { const v = b.po ? (findPO(b.po) || {}).vendor : b.vendor; const k = (v || '') + '|' + String(b.invNo || '').trim().toLowerCase(); if (b.invNo) invKey[k] = (invKey[k] || 0) + 1; });
  S.bills.slice().sort((a, b) => a.no.localeCompare(b.no)).forEach(b => {
    const p = b.po ? findPO(b.po) : null, pc = p && C.po[p.no];
    const amt = num(b.amount), adj = num(b.advAdj), oth = num(b.otherDed);
    const r = { vendor: p ? p.vendor : b.vendor, line: p ? p.line : b.line, poValue: pc ? pc.value : null, received: pc ? pc.received : null, retPct: p ? num(p.ret) : 0 };
    r.billedToDate = p ? (billedSoFar[p.no] || 0) + amt : null;
    if (p) billedSoFar[p.no] = r.billedToDate;
    r.retention = amt * r.retPct;
    r.advBalBefore = p ? pc.advPaid - (advAdjSoFar[p.no] || 0) : 0;
    if (p) advAdjSoFar[p.no] = (advAdjSoFar[p.no] || 0) + adj;
    r.net = amt - adj - r.retention - oth;
    const f = [];
    if (!b.po) {
      if (amt >= num(st.poFrom)) f.push('No PO for bill above PO limit');
      if (!b.vendor || !b.line) f.push('Vendor / budget line missing');
    } else if (!p) f.push('PO not found');
    else {
      if (p.cancel) f.push('PO cancelled');
      if (p.closedOn && b.date > p.closedOn.slice(0, 10)) f.push('PO closed');
      if (r.billedToDate > r.received + 1) f.push('Billed more than received (GRN / SRN)');
      if (r.billedToDate > r.poValue + 1) f.push('Billed more than PO value');
      if (adj > r.advBalBefore + 1) f.push('Advance adjusted more than balance');
      if (num(p.adv) > 0 && r.advBalBefore > 1 && adj + 1 < Math.min(amt * num(p.adv), r.advBalBefore)) f.push('Advance not adjusted as per PO terms');
      if (b.invDate && b.invDate < p.date) f.push('Invoice dated before PO');
      if (!b.refs) f.push('GRN / SRN not attached');
    }
    const k = (r.vendor || '') + '|' + String(b.invNo || '').trim().toLowerCase();
    if (b.invNo && invKey[k] > 1) f.push('Duplicate invoice no.');
    if (!b.invNo) f.push('Invoice no. missing');
    r.match = f.length ? f.join('; ') : 'OK';
    r.pay = b.payDate ? 'Paid' : b.audit === 'Clear' ? 'Cleared - awaiting payment' : b.audit === 'Hold' ? 'On hold' : b.audit === 'Query' ? 'Query' : 'Awaiting audit';
    r.paid = b.payDate ? r.net : 0;
    if (pc) { pc.billed += amt; pc.advAdj += adj; if (b.payDate) pc.paidNet += r.net; }
    C.bill[b.no] = r;
  });

  // PO header checks and status
  const byLine = {};
  S.pos.slice().sort((a, b) => (a.date + a.no).localeCompare(b.date + b.no)).forEach(p => {
    const c = C.po[p.no];
    const v = c.value;
    c.docType = v > num(st.qcpoAbove) ? 'PO-cum-Quotation' : v >= num(st.poFrom) ? 'PO' : 'PO (below PO limit)';
    c.approval = v <= num(st.masoolLimit) ? 'Maintenance Masool' : v <= num(st.masoolHoaLimit) ? 'Masool + Head of Accounts' : 'Masool + Head of Accounts + Sigat';
    c.above = c.lines.filter(l => /^Above/.test(l.price)).length;
    c.notMpl = c.lines.filter(l => l.price === 'Not on MPL').length;
    c.priceAppr = c.above ? (v <= num(st.masoolLimit) ? 'Head of Accounts' : 'Sigat') : '';
    c.effective = p.cancel ? 0 : p.shortClosed ? c.received : v;
    const m = p.date ? +p.date.slice(5, 7) : 1;
    c.ytd = ytdBudget(p.line, m);
    if (p.date && p.date.startsWith(String(st.year))) byLine[p.line] = (byLine[p.line] || 0) + c.effective;
    c.committed = byLine[p.line] || 0;
    c.budget = p.cancel ? '-' : c.committed > c.ytd + 0.5 ? 'OVER BUDGET' : c.committed > c.ytd * num(st.budgetWarn) ? 'Near limit' : 'OK';
    const qs = (p.quotes || []).filter(q => q && q.v && num(q.a) > 0);
    c.quotes = qs.length;
    const l1 = qs.length ? qs.reduce((a, b) => num(a.a) <= num(b.a) ? a : b) : null;
    c.l1 = l1 ? num(l1.a) : null; c.l1v = l1 ? l1.v : '';
    c.qcheck = (c.docType === 'PO-cum-Quotation' && c.quotes < num(st.minQuotes)) ? `Only ${c.quotes} of ${st.minQuotes} quotations` : (l1 && l1.v !== p.vendor && !p.l1reason) ? 'Not L1 - reason needed' : 'OK';
    const tsum = num(p.adv) + num(p.del) + num(p.ret);
    c.terms = Math.abs(tsum - 1) > 0.0001 ? `Terms total ${pct(tsum)} (must be 100%)` : num(p.adv) > num(st.maxAdv) ? 'Advance above limit - Sigat' : 'OK';
    const sig = [c.approval];
    if (c.priceAppr && !c.approval.includes(c.priceAppr)) sig.push(c.priceAppr + ' (rate above MPL)');
    if (c.budget === 'OVER BUDGET') sig.push('Sigat (budget revision before issue)');
    if (num(p.adv) > num(st.maxAdv)) sig.push('Sigat (advance above limit)');
    c.signatures = sig;
    c.full = c.lines.length > 0 && c.lines.every(l => (c.recQty[l.item] || 0) >= l.qty - 1e-9);
    c.balance = v - c.received;
    c.status = p.cancel ? 'Cancelled' : p.closedOn ? (p.shortClosed ? 'Short-closed' : 'Closed') : !p.approvedBy ? 'Awaiting approval' :
      (c.full && c.received > 0 && c.billed >= c.received - 1) ? 'Ready to close' : c.full ? 'Received - awaiting bill' : c.received > 0 ? 'Part received' : 'Approved - open';
    const ex = [];
    if (!p.cancel && !p.closedOn) {
      if (c.budget === 'OVER BUDGET') ex.push('Over budget');
      if (c.above) ex.push(c.above + ' line(s) above MPL');
      if (c.notMpl) ex.push(c.notMpl + ' line(s) not on MPL');
      if (c.qcheck !== 'OK') ex.push(c.qcheck);
      if (c.terms !== 'OK') ex.push(c.terms);
      if (!p.budgetBy) ex.push('Budget check not recorded');
      if (!p.approvedBy) ex.push('Approval not recorded');
      if (c.lines.some(l => l.check !== 'OK')) ex.push('Line check');
      if (!c.lines.length) ex.push('No lines');
      if (!p.vendor || !p.line) ex.push('Vendor / budget line missing');
    }
    c.ex = ex;
  });

  // Advance balances per PO
  S.advances.forEach(a => {
    const pc = C.po[a.po], r = C.adv[a.no];
    r.balance = pc ? pc.advPaid - pc.advAdj : 0;
    r.days = a.paidDate ? daysBetween(a.paidDate, reportDate()) : null;
    r.status = !a.paidDate ? 'Not paid yet' : r.balance <= 0.5 ? 'Adjusted' : r.days > num(st.advDays) ? 'Not adjusted - follow up' : 'Being adjusted';
  });

  // Job cards
  const tgt = { Urgent: num(st.slaUrgentH), High: num(st.slaHighH), Normal: num(st.slaNormalH) };
  const now = nowMs();
  S.jobs.forEach(j => {
    const target = tgt[j.priority] || num(st.slaNormalH);
    const start = toDate(j.reported).getTime();
    const end = j.completed ? toDate(j.completed).getTime() : now;
    const hours = (end - start) / 3600000;
    const status = j.completed && j.verifiedBy ? 'Closed' : j.completed ? 'Completed - verify' : hours > target ? 'OVERDUE' : j.started ? 'In progress' : 'Open';
    const f = [];
    if (j.completed && hours > target) f.push('Closed late');
    if (j.completed && j.doneBy === 'Contractor' && !j.srn) f.push('SRN missing (contractor)');
    if (!j.assigned) f.push('Not assigned');
    C.jobs[j.no] = { target, hours, status, left: target - hours, inTarget: j.completed ? hours <= target : null, check: f.length ? f.join('; ') : 'OK', mk: mkey(j.reported) };
  });

  // Issues and stock
  const recByItem = {}; // date-ordered GRN accepted
  C.grn.forEach(r => { if (!/No PO|not found|cancelled/.test(r.check)) (recByItem[r.l.item] = recByItem[r.l.item] || []).push({ d: r.g.date, q: num(r.l.acc) }); });
  const issued = {};
  S.issues.slice().sort((a, b) => (a.date + a.no).localeCompare(b.date + b.no)).forEach(s => {
    s.lines.forEach((l, i) => {
      const it = item(l.item), q = num(l.qty);
      const rec = (recByItem[l.item] || []).filter(x => x.d <= s.date).reduce((a, x) => a + x.q, 0);
      const before = (it ? num(it.opening) : 0) + rec - (issued[l.item] || 0);
      issued[l.item] = (issued[l.item] || 0) + q;
      const f = [];
      if (!it) f.push('Item not found');
      else if (!isStock(l.item)) f.push('Not a stock item');
      if (q > before + 1e-9) f.push('Exceeds stock');
      if (s.issuedTo === 'Maintenance - job card' && !s.job) f.push('Job card no. missing');
      if (s.job && !S.jobs.find(j => j.no === s.job)) f.push('Job card not found');
      if (!s.recvBy) f.push('Received by missing');
      const rate = lowRate(l.item);
      C.iss.push({ s, l, i, code: l.item, unit: it ? it.unit : '', type: itemType(l.item), line: itemLine(l.item), rate, val: q * rate, mk: mkey(s.date), before, check: f.length ? f.join('; ') : 'OK' });
    });
  });

  const mk = curMK();
  S.items.filter(i => isStock(i.code)).forEach(i => {
    const recs = recByItem[i.code] || [];
    const iss = C.iss.filter(r => r.code === i.code);
    const recBefore = recs.filter(x => mkey(x.d) < mk).reduce((a, x) => a + x.q, 0);
    const recIn = recs.filter(x => mkey(x.d) === mk).reduce((a, x) => a + x.q, 0);
    const issBefore = iss.filter(r => r.mk < mk).reduce((a, r) => a + num(r.l.qty), 0);
    const issIn = iss.filter(r => r.mk === mk).reduce((a, r) => a + num(r.l.qty), 0);
    const open = num(i.opening) + recBefore - issBefore, close = open + recIn - issIn;
    const cnt = S.counts[mk] && S.counts[mk][i.code] !== undefined && S.counts[mk][i.code] !== '' ? num(S.counts[mk][i.code]) : null;
    const diff = cnt === null ? null : cnt - close;
    const rate = lowRate(i.code);
    const status = close < 0 ? 'Negative stock' : (diff !== null && Math.abs(diff) > 1e-9) ? 'Count difference - post adjustment' : (i.reorder !== null && close <= num(i.reorder)) ? 'Re-order - raise PO' : 'OK';
    C.stock[i.code] = { opening: num(i.opening), recBefore, issBefore, open, recIn, issIn, close, cnt, diff, rate, value: close * rate, status };
  });

  // Laundry log cumulative
  const cum = {};
  S.laundry.slice().sort((a, b) => (a.date + a.slip).localeCompare(b.date + b.slip)).forEach(r => {
    const c = cum[r.item] = cum[r.item] || { sent: 0, back: 0 };
    c.sent += num(r.sent); c.back += num(r.clean) + num(r.rewash) + num(r.lost);
    C.laundry[r.id] = { cumSent: c.sent, cumBack: c.back, pending: c.sent - c.back, mk: mkey(r.date), check: c.back > c.sent ? 'Returned more than sent' : 'OK' };
  });

  // PPM and AMC
  const iv = { Weekly: 7, Monthly: 30, Quarterly: 91, 'Half-yearly': 182, Yearly: 365 };
  const today = reportDate();
  S.ppm.forEach(p => {
    const interval = iv[p.freq] || 30;
    const next = p.last ? addDays(p.last, interval) : '';
    const dd = next ? daysBetween(today, next) : null;
    const ppm = !p.last ? 'Not started' : dd < 0 ? 'OVERDUE' : dd <= num(st.ppmWindow) ? 'Due soon' : 'OK';
    const ad = p.amcExpiry ? daysBetween(today, p.amcExpiry) : null;
    const amc = !p.amcExpiry ? '-' : ad < 0 ? 'AMC EXPIRED' : ad <= num(st.amcWarn) ? 'Renew - raise PO' : 'OK';
    C.ppm[p.id] = { interval, next, dd, ppm, ad, amc };
  });

  // Numbers issued but missing from their register
  S.numlog.forEach(n => { const reg = NUM_REG[n.type]; if (reg && !S[reg].some(r => r.no === n.no)) C.missing.push(n); });
}

/* Monthly housekeeping, linen and dashboard figures for the selected month */
function hkNorms() {
  const m = S.settings.month, mk = curMK(), zd = zdUsed(m), tol = num(S.settings.hkTol);
  return S.items.filter(i => num(i.norm) > 0).map(i => {
    const atNorm = num(i.norm) * zd / 100;
    const issued = C.iss.filter(r => r.code === i.code && r.mk === mk && /^HK/.test(r.s.issuedTo)).reduce((a, r) => a + num(r.l.qty), 0);
    const v = issued - atNorm, vp = atNorm ? v / atNorm : null;
    const rate = lowRate(i.code);
    const flag = atNorm === 0 ? '-' : vp > tol ? 'OVER NORM - Masool to explain' : vp < -tol ? 'UNDER NORM - check room standards' : 'OK';
    return { i, zd, atNorm, issued, v, vp, flag, rate, costNorm: atNorm * rate, cost: issued * rate };
  });
}
function linenPar() {
  const mk = curMK(), beds = num(S.settings.capacity);
  return S.items.filter(i => num(i.par) > 0).map(i => {
    const par = num(i.par) * beds;
    const store = C.stock[i.code] ? C.stock[i.code].close : num(i.opening);
    const lc = S.linenCounts[mk] || {};
    const circ = lc[i.code] !== undefined && lc[i.code] !== '' ? num(lc[i.code]) : null;
    const logs = S.laundry.filter(r => r.item === i.code);
    const upto = logs.filter(r => mkey(r.date) <= mk);
    const pending = upto.reduce((a, r) => a + num(r.sent) - num(r.clean) - num(r.rewash) - num(r.lost), 0);
    const inM = logs.filter(r => mkey(r.date) === mk);
    const s = k => inM.reduce((a, r) => a + num(r[k]), 0);
    const held = store + (circ || 0) + pending;
    const short = par - held;
    const status = circ === null ? 'Count missing' : short > 0 ? 'Short of par - replacement PO' : 'OK';
    return { i, par, beds, store, circ, pending, held, short, status, sent: s('sent'), clean: s('clean'), rewash: s('rewash'), lost: s('lost') };
  });
}

function budgetTable() {
  const m = S.settings.month, mk = curMK(), y = String(S.settings.year);
  return S.budgetLines.map(b => {
    const pos = S.pos.filter(p => p.line === b.code && (p.date || '').startsWith(y));
    const noPo = S.bills.filter(x => !x.po && x.line === b.code && (x.date || '').startsWith(y));
    const mb = monthBudget(b.code, m), yb = ytdBudget(b.code, m);
    const mCommit = pos.filter(p => mkey(p.date) === mk).reduce((a, p) => a + C.po[p.no].effective, 0) + noPo.filter(x => mkey(x.date) === mk).reduce((a, x) => a + num(x.amount), 0);
    const mRec = C.grn.filter(r => r.line === b.code && r.mk === mk && r.check.indexOf('No PO') < 0).reduce((a, r) => a + r.val, 0) + C.srn.filter(r => r.line === b.code && r.mk === mk).reduce((a, r) => a + r.val, 0);
    const billsOf = S.bills.filter(x => C.bill[x.no].line === b.code && (x.date || '').startsWith(y));
    const mBills = billsOf.filter(x => mkey(x.date) === mk).reduce((a, x) => a + num(x.amount), 0);
    const yCommit = pos.filter(p => mkey(p.date) <= mk).reduce((a, p) => a + C.po[p.no].effective, 0) + noPo.filter(x => mkey(x.date) <= mk).reduce((a, x) => a + num(x.amount), 0);
    const yBills = billsOf.filter(x => mkey(x.date) <= mk).reduce((a, x) => a + num(x.amount), 0);
    const allCommit = pos.reduce((a, p) => a + C.po[p.no].effective, 0) + noPo.reduce((a, x) => a + num(x.amount), 0);
    return { b, mb, mCommit, mRec, mBills, mVs: mb ? mBills / mb : null, yb, yCommit, yBills, annual: num(b.annual), bal: num(b.annual) - allCommit, yPct: yb ? yCommit / yb : null };
  });
}

function exceptions() {
  const mk = curMK();
  const openPO = S.pos.filter(p => !p.cancel && !p.closedOn);
  const hk = hkNorms(), ln = linenPar();
  const mplExpired = S.mpl.rows.filter(r => r.to && r.to < reportDate()).length;
  const L = [
    ['MPL not approved / locked, or rates expired', (S.mpl.status !== 'Approved' ? 1 : 0) + mplExpired, 'MPL - Head of Accounts to approve', 'mpl'],
    ['POs over budget (need budget revision before issue)', openPO.filter(p => C.po[p.no].budget === 'OVER BUDGET').length, 'PO Register - Internal Auditor / Sigat', 'po'],
    ['PO lines above MPL rate tolerance', openPO.reduce((a, p) => a + C.po[p.no].above, 0), 'PO lines - HoA / Sigat approval', 'po'],
    ['PO lines for items not on MPL', openPO.reduce((a, p) => a + C.po[p.no].notMpl, 0), 'PO lines - add rate to MPL', 'po'],
    ['PO-cum-Quotation without enough quotes / not L1 without reason', openPO.filter(p => C.po[p.no].qcheck !== 'OK').length, 'PO Register - Masool', 'po'],
    ['Payment terms not 100% or advance above limit', openPO.filter(p => C.po[p.no].terms !== 'OK').length, 'PO Register - Masool', 'po'],
    ['POs without approval or budget check recorded', openPO.filter(p => !p.approvedBy || !p.budgetBy).length, 'PO Register - Internal Auditor / Masool', 'po'],
    ['PO numbers issued but missing from the register', C.missing.filter(n => n.type === 'PO').length, 'Number Log - Head of Accounts to investigate', 'numlog'],
    ['Advance / bill / GRN / SRN / issue / job numbers issued but missing', C.missing.filter(n => n.type !== 'PO').length, 'Number Log vs registers', 'numlog'],
    ['POs ready to close (fully received and billed)', openPO.filter(p => C.po[p.no].status === 'Ready to close').length, 'PO Register - Masool clicks Close PO', 'po'],
    ['Advances exceeding PO terms, without PO or approval', S.advances.filter(a => C.adv[a.no].check !== 'OK').length, 'Advances - Accounts', 'adv'],
    ['Advances not adjusted within time limit', S.advances.filter(a => C.adv[a.no].status === 'Not adjusted - follow up').length, 'Advances - Accounts / Masool', 'adv'],
    ['GRN lines not OK (no PO, excess, not on PO, rejected)', C.grn.filter(r => r.check !== 'OK').length, 'GRN - GRN Officer', 'grn'],
    ['SRN lines not OK (no PO, excess, PO closed, signatures missing)', C.srn.filter(r => r.check !== 'OK').length, 'SRN - Masool', 'srn'],
    ['Bills failing 3-way match', S.bills.filter(b => C.bill[b.no].match !== 'OK').length, 'Bills - Internal Auditor', 'bills'],
    ['Bills on hold / query', S.bills.filter(b => !b.payDate && (b.audit === 'Hold' || b.audit === 'Query')).length, 'Bills - Masool to resolve', 'bills'],
    ['Issue slips not OK (exceeds stock, no job card)', C.iss.filter(r => r.check !== 'OK').length, 'Issues', 'issues'],
    ['Stock items at or below re-order level', Object.values(C.stock).filter(s => /Re-order/.test(s.status)).length, 'Stores - raise PO', 'stores'],
    ['Negative stock / count differences', Object.values(C.stock).filter(s => /Negative|Count difference/.test(s.status)).length, 'Stores - post adjustment with approval', 'stores'],
    ['Housekeeping items over norm', hk.filter(r => /^OVER/.test(r.flag)).length, 'HK Norms - Masool to explain', 'hknorms'],
    ['Linen items short of par / count missing', ln.filter(r => r.status !== 'OK').length, 'Linen Par', 'linen'],
    ['Pieces lost by laundry (month)', ln.reduce((a, r) => a + r.lost, 0), 'Deduct from laundry bill', 'laundry'],
    ['Job cards overdue / completed but not verified', S.jobs.filter(j => /OVERDUE|verify/.test(C.jobs[j.no].status)).length, 'Job Cards / Service desk', 'desk'],
    ['PPM overdue', S.ppm.filter(p => C.ppm[p.id].ppm === 'OVERDUE').length, 'PPM AMC', 'ppm'],
    ['AMC expired or expiring', S.ppm.filter(p => /EXPIRED|Renew/.test(C.ppm[p.id].amc)).length, 'PPM AMC - raise renewal PO', 'ppm'],
    ['Rooms out of order', S.rooms.filter(r => r.status === 'Out of order').length, 'Service desk - rooms', 'desk'],
  ];
  return L.map(([t, n, w, v], i) => ({ i: i + 1, t, n, w, v }));
}

<script>
/* ---- ui.js ---- */
/* UI framework: shell, navigation, tables, forms, modals, printing, log-in */

const $ = s => document.querySelector(s);
const ACT = {};          // click actions: data-act="name" data-id="..."
const App = {};          // handlers used from inline onchange / oninput
let VIEW = null;
// Where the app runs: 'claude' (claude.ai artifact), 'firebase' (GitHub Pages + Firebase), 'unconfigured' (Pages without config) or 'local'
const HOST = window.KUN_HOST || (window.claude && typeof window.claude.use === 'function' ? 'claude' : 'local');
const SHARED = HOST === 'claude' || HOST === 'firebase';
let loginFails = 0, loginLockUntil = 0;

function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + (kind || '');
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = ''; }, 3200);
}
const flag = t => t ? `<span class="flag ${sev(t)}">${esc(t)}</span>` : '';
const flags = t => (!t || t === 'OK') ? flag(t) : t.split('; ').map(flag).join(' ');
function opts(list, val, blank = true) {
  return (blank ? '<option value=""></option>' : '') + list.map(o => {
    const [v, l] = Array.isArray(o) ? o : [o, o];
    return `<option value="${esc(v)}"${String(v) === String(val ?? '') ? ' selected' : ''}>${esc(l)}</option>`;
  }).join('');
}
const itemOpts = filter => S.items.filter(filter || (() => true)).map(i => [i.code, i.code + ' - ' + i.name]);
const vendorOpts = () => S.vendors.filter(v => v.avl === 'Y').map(v => v.name);
const lineOpts = () => S.budgetLines.map(b => [b.code, b.code + ' - ' + b.name]);
const monthOpts = () => MON.map((m, i) => [i + 1, m + ' ' + S.settings.year]);

/* ---------- views registry and navigation ---------- */
const VIEWS = {};
const GROUPS = ['Overview', 'Purchasing', 'Receiving', 'Bills & payment', 'Stores', 'Housekeeping', 'Maintenance', 'Masters', 'Admin'];
function view(id, title, module, group, fmtNo, render) { VIEWS[id] = { id, title, module, group, fmtNo, render }; }

// Navigation is kept in page state (the artifact viewer passes only a plain #token from the link, used for the first view).
function go(id) { closeModal(); route(id); }
function route(want) {
  if (!U) return SHARED ? renderGate() : renderLogin();
  let id = want || VIEW || (location.hash.match(/^#\/?(\w+)$/) || [])[1];
  if (!id || !VIEWS[id] || !canSee(VIEWS[id].module)) id = homeView();
  VIEW = id; render();
}
function homeView() { return ['dashboard', 'desk', 'po', 'grn', 'bills', 'issues', 'laundry', 'guide'].find(v => VIEWS[v] && canSee(VIEWS[v].module)) || 'guide'; }

function render() {
  const v = VIEWS[VIEW];
  $('#app').innerHTML = shell();
  const main = $('#main');
  try { main.innerHTML = `<div class="vhead"><div><span class="fmt">${esc(v.fmtNo)}</span><h1>${esc(v.title)}</h1></div><div class="vtools" id="vtools"></div></div>` + v.render(); }
  catch (e) { console.error(e); main.innerHTML = `<div class="card bad">Something went wrong showing this page: ${esc(e.message)}</div>`; }
  document.querySelectorAll('[data-autofocus]').forEach(x => x.focus());
  window.scrollTo(0, 0);
}
function shell() {
  const nav = GROUPS.map(g => {
    const items = Object.values(VIEWS).filter(v => v.group === g && canSee(v.module));
    if (!items.length) return '';
    return `<div class="ng">${esc(g)}</div>` + items.map(v => `<a href="#${v.id}" data-act="goto" data-id="${v.id}" class="${v.id === VIEW ? 'on' : ''}"><span>${esc(v.title)}</span><small>${esc(v.fmtNo)}</small></a>`).join('');
  }).join('');
  const ex = S.meta.examples ? `<span class="exb" title="Example data (October 2026) is loaded. Clear it at go-live from Admin > Data.">Example data</span>` : '';
  return `<header class="top">
    <button class="menu" data-act="toggleNav" aria-label="Menu">&#9776;</button>
    <div class="brand"><b>KUN Karbala</b><span>Maintenance &amp; Housekeeping</span></div>${ex}
    <div class="sp"></div>
    ${SHARED ? `<span class="sync" id="syncState" title="Changes are saved to the shared database for all users">${esc(syncLabel())}</span>` : ''}
    <span class="who"><b>${esc(U.name)}</b><small>${esc(U.role)}</small></span>
    ${HOST === 'claude' ? '' : `<button class="btn ghost sm" data-act="changePw">Password</button>
    <button class="btn ghost sm" data-act="logout">Log out</button>`}
  </header>
  <div class="body"><nav id="nav">${nav}</nav><main id="main"></main></div>`;
}
ACT.toggleNav = () => $('#nav').classList.toggle('open');

/* ---------- tables ---------- */
// cols: [{h, v:(row)=>html, x:(row)=>export value, n:true numeric, w}]
const TABLES = {};
function table(id, cols, rows, o = {}) {
  TABLES[id] = { cols, rows, name: o.name || id };
  const head = cols.map(c => `<th class="${c.n ? 'n' : ''}" ${c.w ? `style="min-width:${c.w}px"` : ''}>${esc(c.h)}</th>`).join('');
  const body = rows.length ? rows.map((r, i) => `<tr ${o.click ? `data-act="${o.click}" data-id="${esc(o.key ? o.key(r) : i)}" class="click ${o.rowCls ? o.rowCls(r) : ''}"` : (o.rowCls ? `class="${o.rowCls(r)}"` : '')}>${cols.map(c => `<td class="${c.n ? 'n' : ''}${c.w ? ' wrap' : ''}">${c.v(r) ?? ''}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${cols.length}" class="empty">${esc(o.empty || 'Nothing here yet.')}</td></tr>`;
  const foot = o.foot ? `<tfoot><tr>${o.foot.map((f, i) => `<td class="${cols[i] && cols[i].n ? 'n' : ''}">${f ?? ''}</td>`).join('')}</tr></tfoot>` : '';
  const tools = o.noTools ? '' : `<div class="ttools"><input type="search" placeholder="Filter..." oninput="App.filter('${id}', this.value)"><span class="cnt">${rows.length} row${rows.length === 1 ? '' : 's'}</span><button class="btn ghost sm" data-act="csv" data-id="${id}">Export to Excel (CSV)</button></div>`;
  return `${tools}<div class="tw"><table id="t_${id}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table></div>`;
}
App.filter = (id, q) => {
  q = q.toLowerCase().trim();
  document.querySelectorAll(`#t_${id} tbody tr`).forEach(tr => { tr.style.display = !q || tr.textContent.toLowerCase().includes(q) ? '' : 'none'; });
};
const strip = h => { const d = document.createElement('div'); d.innerHTML = String(h ?? ''); return d.textContent.replace(/\s+/g, ' ').trim(); };
ACT.csv = id => {
  const t = TABLES[id]; if (!t) return;
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const lines = [t.cols.map(c => q(c.h)).join(',')].concat(t.rows.map(r => t.cols.map(c => q(c.x ? c.x(r) : strip(c.v(r)))).join(',')));
  download(`KUN_MH_${t.name.replace(/\W+/g, '_')}_${isoDate(new Date())}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
};
async function download(name, content, type) {
  if (HOST === 'claude') {
    const dl = await window.claude.use('downloads');
    if (!dl) return toast('Saving files is not available in this view.', 'bad');
    try { await dl.save({ filename: name, data: content }); toast('Saved ' + name + '.', 'ok'); }
    catch (e) { if (e.code !== 'declined') toast('Could not save the file: ' + (e.message || e.code), 'bad'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- forms ---------- */
// field: {k, l, t: text|num|pct|date|dt|sel|area|chk|ro, o: options, full, ed: editable?, hint, list}
function field(f, obj) {
  const v = f.val !== undefined ? f.val : obj[f.k];
  const dis = f.ed === false ? ' disabled' : '';
  const id = 'f_' + f.k;
  let inp;
  switch (f.t) {
    case 'sel': inp = `<select id="${id}" data-k="${f.k}"${dis}>${opts(typeof f.o === 'function' ? f.o() : f.o, v, f.blank !== false)}</select>`; break;
    case 'area': inp = `<textarea id="${id}" data-k="${f.k}" rows="${f.rows || 2}"${dis}>${esc(v)}</textarea>`; break;
    case 'chk': inp = `<label class="chk"><input type="checkbox" id="${id}" data-k="${f.k}" data-t="chk"${v ? ' checked' : ''}${dis}> ${esc(f.cl || '')}</label>`; break;
    case 'pct': inp = `<input id="${id}" data-k="${f.k}" data-t="pct" inputmode="decimal" value="${v === null || v === undefined || v === '' ? '' : +(num(v) * 100).toFixed(4)}"${dis}><span class="unit">%</span>`; break;
    case 'num': inp = `<input id="${id}" data-k="${f.k}" data-t="num" inputmode="decimal" value="${v === null || v === undefined ? '' : esc(v)}"${dis}>`; break;
    case 'date': inp = `<input type="date" id="${id}" data-k="${f.k}" value="${esc((v || '').slice(0, 10))}"${dis}>`; break;
    case 'dt': inp = `<input type="datetime-local" id="${id}" data-k="${f.k}" value="${esc((v || '').slice(0, 16))}"${dis}>`; break;
    case 'ro': inp = `<div class="ro">${f.html !== undefined ? f.html : esc(v)}</div>`; break;
    default: inp = `<input id="${id}" data-k="${f.k}" value="${esc(v)}"${f.list ? ` list="dl_${f.k}"` : ''}${dis}>` + (f.list ? `<datalist id="dl_${f.k}">${f.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : '');
  }
  return `<div class="fld ${f.full ? 'full' : ''} ${f.t === 'pct' ? 'haspct' : ''}"><label for="${id}">${esc(f.l)}${f.req ? ' <i>*</i>' : ''}</label>${inp}${f.hint ? `<small>${f.hint}</small>` : ''}</div>`;
}
const fields = (list, obj) => `<div class="grid">${list.map(f => field(f, obj)).join('')}</div>`;
function readInto(root, obj) {
  root.querySelectorAll('[data-k]').forEach(el => {
    if (el.disabled) return;
    const k = el.dataset.k, t = el.dataset.t;
    if (t === 'chk') obj[k] = el.checked;
    else if (t === 'num') obj[k] = numOrNull(el.value);
    else if (t === 'pct') obj[k] = el.value === '' ? 0 : num(el.value) / 100;
    else obj[k] = el.value.trim();
  });
  return obj;
}
// line editor: cols [{k, h, t: sel|num|text|ro, o, w, ro:(line)=>html}]
function linesEditor(id, cols, lines, ed, max) {
  const row = (l, i) => `<tr data-row="${i}">${cols.map(c => {
    if (c.t === 'ro') return `<td class="${c.n ? 'n' : ''}">${c.ro(l, i) ?? ''}</td>`;
    const v = l[c.k] ?? '';
    if (c.t === 'sel') return `<td><select data-lk="${c.k}"${ed ? '' : ' disabled'} ${c.onch ? `onchange="${c.onch}"` : ''}>${opts(typeof c.o === 'function' ? c.o(l) : c.o, v)}</select></td>`;
    return `<td><input data-lk="${c.k}" ${c.t === 'num' ? 'inputmode="decimal" class="n"' : ''} value="${esc(v)}"${ed ? '' : ' disabled'} ${c.onin ? `oninput="${c.onin}"` : ''}></td>`;
  }).join('')}${ed ? `<td><button class="x" title="Remove line" onclick="this.closest('tr').remove()">&times;</button></td>` : ''}</tr>`;
  const blank = {};
  return `<div class="tw lines"><table id="le_${id}" data-max="${max || 99}"><thead><tr>${cols.map(c => `<th class="${c.n ? 'n' : ''}" ${c.w ? `style="min-width:${c.w}px"` : ''}>${esc(c.h)}</th>`).join('')}${ed ? '<th></th>' : ''}</tr></thead>
    <tbody>${lines.map(row).join('')}</tbody></table></div>
    ${ed ? `<button class="btn ghost sm" onclick="App.addLine('${id}')">+ Add line</button>` : ''}

}
App.addLine = id => {
  const t = $('#le_' + id), tpl = $('#tpl_' + id);
  if (t.tBodies[0].rows.length >= +t.dataset.max) return toast('Maximum ' + t.dataset.max + ' lines on one document - split into a second one.', 'warn');

function readLines(id, numKeys) {
  const out = [];
  document.querySelectorAll(`#le_${id} tbody tr`).forEach(tr => {
    const l = {}; let any = false;
    tr.querySelectorAll('[data-lk]').forEach(el => { const k = el.dataset.lk; l[k] = numKeys.includes(k) ? numOrNull(el.value) : el.value.trim(); if (el.value.trim()) any = true; });

}

/* ---------- modal ---------- */
function modal(title, body, actions, o = {}) {
  const m = $('#modal');
  m.innerHTML = `<div class="mbox ${o.wide ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="mhead"><h2>${esc(title)}</h2>${o.sub ? `<span class="msub">${o.sub}</span>` : ''}<button class="x" data-act="closeModal" aria-label="Close">&times;</button></div><div class="mbody">${body}</div><div class="mfoot"></div></div>`;

function closeModal() {

function confirmBox(title, text, okLabel, fn, o = {}) {

/* ---------- printing: print, PDF (browser), Word ---------- */
function printDoc(title, html) {
  const doc = `<div class="doc">${docHead(title)}${html}<div class="dfoot">Printed ${fdt(nowDT())} by ${esc(U.name)} &middot; KUN Karbala Maintenance &amp; Housekeeping app</div></div>`;
