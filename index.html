}
function docHead(title) {
  return `<div class="dh"><div><b>Faiz E Husaini - Karbala (KUN)</b><br>Maintenance &amp; Housekeeping Department</div><div class="dt">${esc(title)}</div></div>`;
}
const kv = pairs => `<table class="kv">${pairs.map(r => `<tr>${r.map((c, i) => i % 2 === 0 ? `<th>${esc(c)}</th>` : `<td>${c ?? ''}</td>`).join('')}</tr>`).join('')}</table>`;
const sigs = list => `<table class="sig"><tr>${list.map(s => `<td><div class="line"></div><b>${esc(s)}</b><br>Name / date</td>`).join('')}</tr></table>`;

/* ---------- log-in ---------- */
function renderLogin() {
  $('#app').innerHTML = `<div class="login"><form class="lcard" onsubmit="event.preventDefault();ACT.login()">
    <div class="lbrand">Faiz E Husaini - Karbala (KUN)</div>
    <h1>Maintenance &amp; Housekeeping</h1>
    <p class="muted">Service desk, purchasing, stores and housekeeping control for the zaereen hotel (about 450 pax). Log in to see the pages of your role.</p>
    <label for="lgId">User ID</label><input id="lgId" autocomplete="username" autocapitalize="characters" data-autofocus>
    <label for="lgPw">Password</label><input id="lgPw" type="password" autocomplete="current-password">
    <div id="lgErr" class="err"></div>
    <button class="btn pri full" type="submit">Log in</button>
    <ul class="notes"><li>Passwords are case-sensitive, at least ${S.settings.minPwd} characters. At your first log-in you set your own password.</li>
    <li>Three wrong attempts lock the log-in for a minute. Ask the Head of Accounts (Admin) to reset a forgotten password.</li>
    <li>Data is kept in this browser on this computer. Use Admin &gt; Data to back it up.</li></ul>
  </form></div>`;
  const f = $('#lgId'); if (f) f.focus();
}
ACT.login = () => {
  const err = m => { $('#lgErr').textContent = m; };
  if (Date.now() < loginLockUntil) return err('Too many attempts. Wait a minute and try again.');
  const id = $('#lgId').value.trim().toUpperCase(), pw = $('#lgPw').value;
  const u = S.users.find(x => x.id.toUpperCase() === id);
  const fail = m => { loginFails++; if (loginFails >= 3) { loginLockUntil = Date.now() + 60000; loginFails = 0; } err(m); };
  if (!u || u.active !== 'Y') return fail('Unknown or blocked user ID.');
  if (!u.hash) {
    if (!S.users.some(x => x.hash) && u.role === 'Admin') return setPwModal(u, true);
    return err('No password has been set for this user yet. Ask the Head of Accounts (Admin) to set a temporary password.');
  }
  if (pwdCode(pw, u.salt) !== u.hash) return fail('Wrong password.');
  loginFails = 0;
  if (u.mustChange) return setPwModal(u, false, true);
  enter(u);
};
function enter(u) {
  U = u; u.lastLogin = nowDT();
  try { sessionStorage.setItem('kunmh.user', u.id); } catch (e) { }
  logAudit('Log in', u.name + ' (' + u.role + ')'); saveData(); recalc(); route();
}
function setPwModal(u, first, forced) {
  const min = S.settings.minPwd;
  modal(first ? 'First log-in: set your password' : forced ? 'Set your own password' : 'Change my password',
    `<p>${first ? 'No passwords exist yet. As the Admin, set your password now; then give every other user a temporary password from Admin &gt; Users.' : forced ? 'You are logging in with a temporary password. Choose your own password to continue.' : 'Choose a new password.'}</p>
     <div class="grid"><div class="fld"><label>New password (min. ${min})</label><input type="password" id="np1" autocomplete="new-password"></div>
     <div class="fld"><label>Repeat new password</label><input type="password" id="np2" autocomplete="new-password"></div></div>`,
    [{ l: 'Save password', cls: 'pri', fn: () => {
      const a = $('#np1').value, b = $('#np2').value;
      if (a.length < min) return toast('Password must be at least ' + min + ' characters.', 'bad');
      if (a !== b) return toast('The two passwords do not match.', 'bad');
      u.salt = uid() + uid(); u.hash = pwdCode(a, u.salt); u.mustChange = false;
      closeModal();
      if (U) { logAudit('Password changed', u.id); saveData(); toast('Password changed.', 'ok'); } else { U = u; logAudit('Password set at log-in', u.id); enter(u); }
    } }]);
}
ACT.changePw = () => HOST === 'firebase' ? fbChangePassword() : setPwModal(U, false, false);
ACT.logout = () => {
  if (HOST === 'firebase') return fbSignOut(); logAudit('Log out', U.name); saveData(); U = null; VIEW = null; try { sessionStorage.removeItem('kunmh.user'); } catch (e) { } closeModal(); renderLogin(); };

function needPassword(title, text, extra, fn) {
  if (!S.settings.approvalHash) return toast('The approval password is not set yet. Admin sets it in Settings (MH-01).', 'bad');
  modal(title, `<p>${text}</p><div class="grid"><div class="fld"><label>Approval password</label><input type="password" id="apw" autocomplete="off"></div>${extra || ''}</div>`,
    [{ l: 'Confirm', cls: 'pri', fn: body => { if (!checkApproval($('#apw').value)) return toast('Wrong approval password.', 'bad'); fn(body); } }]);
}

/* ---------- start-up ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = ACT[el.dataset.act]; if (!a) return;
  if (el.tagName === 'A') e.preventDefault();
  a(el.dataset.id, el, e);
  if (el.closest('#nav')) $('#nav').classList.remove('open');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').classList.contains('open')) closeModal(); });
function startApp() {
  if (HOST === 'unconfigured') return renderUnconfigured();
  if (SHARED) return sharedStart();
  loadData(); recalc();
  try { const id = sessionStorage.getItem('kunmh.user'); const u = id && S.users.find(x => x.id === id && x.active === 'Y' && x.hash); if (u) U = u; } catch (e) { }
  route();
}
setInterval(() => { if (U && (VIEW === 'desk' || VIEW === 'dashboard') && !$('#modal').classList.contains('open') && !inputFocused()) refresh(); }, 60000);
const inputFocused = () => { const a = document.activeElement; return !!(a && a.closest && a.closest('#main') && /INPUT|SELECT|TEXTAREA/.test(a.tagName)); };
if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', startApp); else startApp();

</script>
<script>
/* ---- views_ops.js ---- */
/* Views: dashboard, service desk & rooms, job cards, PPM & AMC, guide */

const tile = (label, value, sub, cls, act) => `<div class="tile ${cls || ''}" ${act ? `data-act="goto" data-id="${act}"` : ''}><span>${esc(label)}</span><b>${value}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
ACT.goto = id => go(id);
App.setMonth = v => { S.settings.month = +v; commit(); render(); };
const monthPicker = () => `<label class="mp">Month <select onchange="App.setMonth(this.value)">${opts(monthOpts(), S.settings.month, false)}</select></label>`;

/* ===== MH-24 Dashboard ===== */
view('dashboard', 'Dashboard & exceptions', 'Dashboard', 'Overview', 'MH-24', () => {
  const ex = exceptions(), bt = budgetTable();
  const openJobs = S.jobs.filter(j => !S.jobs.length || C.jobs[j.no].status !== 'Closed');
  const overdue = S.jobs.filter(j => C.jobs[j.no].status === 'OVERDUE').length;
  const awaitB = S.bills.filter(b => C.bill[b.no].pay === 'Awaiting audit');
  const cleared = S.bills.filter(b => C.bill[b.no].pay === 'Cleared - awaiting payment');
  const openPOval = S.pos.filter(p => !p.cancel && !p.closedOn).reduce((a, p) => a + Math.max(0, C.po[p.no].balance), 0);
  const nEx = ex.filter(e => e.n > 0).length;
  const m = S.settings.month, zd = zdUsed(m), hk = hkNorms();
  const cNorm = hk.reduce((a, r) => a + r.costNorm, 0), cAct = hk.reduce((a, r) => a + r.cost, 0);
  const mBills = bt.reduce((a, r) => a + r.mBills, 0);
  const tot = k => bt.reduce((a, r) => a + (r[k] || 0), 0);
  setTimeout(() => { const t = $('#vtools'); if (t) t.innerHTML = monthPicker(); });
  return `<div class="tiles">
    ${tile('Exception lines to act on', nEx, 'of ' + ex.length + ' checks', nEx ? 'bad' : 'ok')}
    ${tile('Open job cards', openJobs.length, overdue + ' overdue', overdue ? 'bad' : '', 'desk')}
    ${tile('Bills awaiting audit', awaitB.length, fmt(awaitB.reduce((a, b) => a + num(b.amount), 0)) + ' IQD', awaitB.length ? 'warn' : '', 'audit')}
    ${tile('Cleared, awaiting payment', fmt(cleared.reduce((a, b) => a + C.bill[b.no].net, 0)), cleared.length + ' bill(s), IQD', '', 'audit')}
    ${tile('Open PO value not received', fmt(openPOval), 'IQD', '', 'po')}
    ${tile('Rooms out of order', S.rooms.filter(r => r.status === 'Out of order').length, 'of ' + S.rooms.length + ' rooms', '', 'desk')}
  </div>
  <section class="card"><h3>A. Budget lines (IQD) - ${MON[m - 1]} ${S.settings.year}</h3>
  ${table('dash_budget', [
    { h: 'Code', v: r => esc(r.b.code) }, { h: 'Budget line', v: r => esc(r.b.name), w: 200 },
    { h: 'Month budget', n: 1, v: r => fmt(r.mb) }, { h: 'Month POs committed', n: 1, v: r => fmt(r.mCommit) },
    { h: 'Month received (GRN+SRN)', n: 1, v: r => fmt(r.mRec) }, { h: 'Month bills booked', n: 1, v: r => fmt(r.mBills) },
    { h: 'Month bills vs budget', n: 1, v: r => pct(r.mVs) }, { h: 'YTD budget', n: 1, v: r => fmt(r.yb) },
    { h: 'YTD committed', n: 1, v: r => fmt(r.yCommit) }, { h: 'YTD bills booked', n: 1, v: r => fmt(r.yBills) },
    { h: 'Annual budget', n: 1, v: r => fmt(r.annual) }, { h: 'Annual balance after all POs', n: 1, v: r => fmt(r.bal) },
    { h: 'YTD committed %', w: 130, v: r => `<div class="bar"><i style="width:${Math.min(100, (r.yPct || 0) * 100)}%" class="${r.yPct > 1 ? 'bad' : r.yPct > num(S.settings.budgetWarn) ? 'warn' : ''}"></i><span>${pct(r.yPct)}</span></div>`, x: r => pct(r.yPct) },
  ], bt, { name: 'Dashboard budget', noTools: true, foot: ['', '<b>Total</b>', fmt(tot('mb')), fmt(tot('mCommit')), fmt(tot('mRec')), fmt(tot('mBills')), '', fmt(tot('yb')), fmt(tot('yCommit')), fmt(tot('yBills')), fmt(tot('annual')), fmt(tot('bal')), ''] })}</section>
  <div class="two">
  <section class="card"><h3>B. Key figures</h3>${kv([
    ['Zaereen-days in month (used)', fmt(zd)],
    ['HK consumables cost per zaereen-day - at norm (IQD)', fmt(zd ? cNorm / zd : 0, 1)],
    ['HK consumables cost per zaereen-day - actual issues (IQD)', fmt(zd ? cAct / zd : 0, 1)],
    ['Bills booked per zaereen-day - department, month (IQD)', fmt(zd ? mBills / zd : 0, 1)],
    ['Open PO value not yet received (IQD)', fmt(openPOval)],
    ['Bills cleared by audit, awaiting payment (IQD)', fmt(cleared.reduce((a, b) => a + C.bill[b.no].net, 0))],
    ['Bills on hold / query (IQD)', fmt(S.bills.filter(b => /hold|Query/i.test(C.bill[b.no].pay)).reduce((a, b) => a + num(b.amount), 0))],
    ['Advances outstanding (paid - adjusted) (IQD)', fmt(Object.values(C.po).reduce((a, c) => a + Math.max(0, c.advPaid - c.advAdj), 0))],
    ['Retention held (IQD)', fmt(S.bills.reduce((a, b) => a + C.bill[b.no].retention, 0))],
    ['Closing store stock value (IQD)', fmt(Object.values(C.stock).reduce((a, s) => a + s.value, 0))],
    ['Laundry pieces pending with laundry', fmt(linenPar().reduce((a, r) => a + r.pending, 0))],
    ['Job cards closed within target (month)', (() => { const d = S.jobs.filter(j => j.completed && mkey(j.completed) === curMK()); return d.length ? pct(d.filter(j => C.jobs[j.no].inTarget).length / d.length) : '-'; })()],
    ['MPL status', flag(S.mpl.status === 'Approved' ? 'Approved v' + S.mpl.version : S.mpl.status)],
  ])}</section>
  <section class="card"><h3>C. Exceptions - each line should be zero</h3>
  <table class="ex">${ex.map(e => `<tr data-act="goto" data-id="${e.v}" class="click"><td class="n">${e.i}</td><td>${esc(e.t)}<small>${esc(e.w)}</small></td><td class="n"><span class="flag ${e.n ? 'bad' : 'ok'}">${e.n}</span></td></tr>`).join('')}</table></section>
  </div>`;
});

/* ===== Service desk & rooms (job cards for rapid repairs and room configuration) ===== */
function slaText(j) {
  const c = C.jobs[j.no];
  if (j.completed) return c.inTarget ? 'Done in ' + hrs(c.hours) : 'Done late (' + hrs(c.hours) + ')';
  return c.left >= 0 ? hrs(c.left) + ' left' : 'Overdue by ' + hrs(-c.left);
}
const hrs = h => h < 1 ? Math.max(1, Math.round(h * 60)) + ' min' : h < 48 ? Math.floor(h) + ' h ' + String(Math.round((h % 1) * 60)).padStart(2, '0') + ' m' : Math.round(h / 24) + ' days';
const PRI = { Urgent: 0, High: 1, Normal: 2 };

view('desk', 'Service desk & rooms', 'Rooms', 'Overview', 'MH-22', () => {
  const ed = canEdit('Job Cards');
  const open = S.jobs.filter(j => C.jobs[j.no].status !== 'Closed');
  const col = (title, list, cls) => `<div class="kcol ${cls}"><h4>${title} <span>${list.length}</span></h4>${list.sort((a, b) => (PRI[a.priority] - PRI[b.priority]) || a.reported.localeCompare(b.reported)).map(jobCard).join('') || '<p class="muted sm">None</p>'}</div>`;
  const notStarted = open.filter(j => !j.started && !j.completed), inProg = open.filter(j => j.started && !j.completed), toVerify = open.filter(j => j.completed);
  const today = isoDate(new Date(nowMs()));
  const doneToday = S.jobs.filter(j => j.completed && j.completed.startsWith(today));
  const mDone = S.jobs.filter(j => j.completed && mkey(j.completed) === curMK());
  setTimeout(() => { const t = $('#vtools'); if (t) t.innerHTML = (ed ? `<button class="btn pri" data-act="newJob">+ New request</button>` : '') + `<button class="btn ghost" data-act="goto" data-id="jobs">Job card register</button>`; });
  const floors = [...new Set(S.rooms.map(r => r.floor))];
  return `<div class="tiles">
    ${tile('Open requests', open.length, open.filter(j => j.type === 'Room configuration').length + ' room configuration')}
    ${tile('Overdue', open.filter(j => C.jobs[j.no].status === 'OVERDUE').length, 'past target time', open.some(j => C.jobs[j.no].status === 'OVERDUE') ? 'bad' : 'ok')}
    ${tile('Urgent open', open.filter(j => j.priority === 'Urgent' && !j.completed).length, 'target ' + S.settings.slaUrgentH + ' h', '')}
    ${tile('Completed today', doneToday.length, toVerify.length + ' waiting for verification')}
    ${tile('Within target (month)', mDone.length ? pct(mDone.filter(j => C.jobs[j.no].inTarget).length / mDone.length) : '-', 'KPI above 90%')}
    ${tile('Rooms out of order', S.rooms.filter(r => r.status === 'Out of order').length, S.rooms.filter(r => r.status === 'Being configured').length + ' being configured')}
  </div>
  <div class="kanban">${col('New', notStarted, 'k1')}${col('In progress', inProg, 'k2')}${col('Done - to verify', toVerify, 'k3')}</div>
  <section class="card"><h3>Rooms <small class="muted">${S.rooms.length} rooms, ${S.rooms.reduce((a, r) => a + num(r.beds), 0)} beds. Click a room for its details, configuration and requests.</small></h3>
  <div class="legend"><span class="rs Ready">Ready</span><span class="rs Occupied">Occupied</span><span class="rs Being">Being configured</span><span class="rs Out">Out of order</span><span><i class="dot"></i> open request</span><span><i class="cfg">C</i> non-standard configuration</span></div>
  ${floors.map(f => `<div class="floor"><b>Floor ${f}</b><div class="rooms">${S.rooms.filter(r => r.floor === f).map(r => {
    const oj = open.filter(j => j.room === r.no);
    return `<button class="room rs ${r.status.split(' ')[0]}" data-act="room" data-id="${esc(r.no)}" title="${esc(r.no + ' - ' + r.status + ' - ' + r.config)}">${esc(r.no)}${oj.length ? '<i class="dot"></i>' : ''}${r.config !== 'Standard' ? '<i class="cfg">C</i>' : ''}</button>`;
  }).join('')}</div></div>`).join('')}</section>`;
});

function jobCard(j) {
  const c = C.jobs[j.no], ed = canEdit('Job Cards'), ver = canEdit('Job Cards') || canEdit('Rooms');
  return `<div class="jc p-${j.priority} ${c.status === 'OVERDUE' ? 'late' : ''}">
    <div class="jt"><span class="pr ${j.priority}">${esc(j.priority)}</span><span class="ty">${esc(j.type)}</span><a data-act="editJob" data-id="${esc(j.no)}" href="#">${esc(j.no.split('/').slice(-1)[0])}</a></div>
    <div class="jl">${esc(j.location || ('Room ' + j.room))}${j.outOfOrder ? ' <span class="flag bad">Out of order</span>' : ''}${j.guestImpact ? ' <span class="flag warn">Guest in room</span>' : ''}</div>
    <div class="jp">${esc(j.type === 'Room configuration' ? j.config : j.trade)}: ${esc(j.problem)}</div>
    <div class="jm">${esc(j.assigned || 'Not assigned')} &middot; ${fdt(j.reported)}</div>
    <div class="js ${c.status === 'OVERDUE' || (j.completed && !c.inTarget) ? 'bad' : c.left < c.target * 0.25 && !j.completed ? 'warn' : ''}">${slaText(j)}</div>
    <div class="ja">${!j.started && !j.completed && ed ? `<button class="btn sm" data-act="jobStart" data-id="${esc(j.no)}">Start</button>` : ''}
    ${!j.completed && ed ? `<button class="btn sm pri" data-act="jobDone" data-id="${esc(j.no)}">Complete</button>` : ''}
    ${j.completed && !j.verifiedBy && ver ? `<button class="btn sm pri" data-act="jobVerify" data-id="${esc(j.no)}">Verify</button>` : ''}</div></div>`;
}

const jobFields = (j, ed) => [
  { k: 'type', l: 'Request type', t: 'sel', o: S.lists.jobTypes, ed, blank: false },
  { k: 'priority', l: 'Priority', t: 'sel', o: S.lists.priorities.map(p => [p, p + ' (target ' + ({ Urgent: S.settings.slaUrgentH, High: S.settings.slaHighH, Normal: S.settings.slaNormalH })[p] + ' h)']), ed, blank: false },
  { k: 'room', l: 'Room', t: 'sel', o: S.rooms.map(r => [r.no, r.no + ' (' + r.beds + ' beds)']), ed, hint: 'Leave blank for a public area or plant' },
  { k: 'location', l: 'Location (room / area)', t: 'text', ed, list: ['Lift 1', 'Lift 2', 'Generator yard', 'RO plant', 'Lobby', 'Kitchen', 'Laundry room', 'Roof', 'Basement'] },
  { k: 'trade', l: 'Trade', t: 'sel', o: S.lists.trades, ed },
  { k: 'config', l: 'Configuration needed (room configuration)', t: 'sel', o: S.lists.configs, ed },
  { k: 'problem', l: 'Problem / request details', t: 'area', full: true, ed, req: true },
  { k: 'reportedBy', l: 'Reported by', t: 'text', ed, list: ['Front office', 'Room attendant', 'HK supervisor', 'Guest (via front office)', 'Floor supervisor', 'Generator operator'] },
  { k: 'reported', l: 'Date & time reported', t: 'dt', ed },
  { k: 'assigned', l: 'Assigned to', t: 'text', ed, list: ['In-house electrician', 'In-house plumber', 'In-house AC technician', 'In-house carpenter', 'HK team', 'Generator operator'].concat(S.vendors.map(v => v.name)) },
  { k: 'outOfOrder', l: 'Room status', t: 'chk', cl: 'Room out of order until done', ed },
  { k: 'guestImpact', l: 'Guest', t: 'chk', cl: 'Guest in the room / waiting', ed },
];

ACT.newJob = (room) => {
  const j = { type: 'Repair', priority: 'High', room: room || '', location: room ? 'Room ' + room : '', trade: '', config: '', problem: '', reportedBy: 'Front office', reported: nowDT(), assigned: '', outOfOrder: false, guestImpact: false };
  modal('New request (job card MH-22)', `<p class="muted">A job card number is issued when you save. Repairs follow the target time of their priority; room configuration requests change the room's configuration when completed.</p>` + fields(jobFields(j, true), j),
    [{ l: 'Save and issue job card number', cls: 'pri', fn: async b => {
      readInto(b, j);
      if (!j.problem) return toast('Describe the problem or request.', 'bad');
      if (j.type === 'Room configuration' && !j.config) return toast('Choose the configuration needed.', 'bad');
      if (j.type !== 'Room configuration' && !j.trade) j.trade = j.type === 'Guest request' ? 'Housekeeping' : 'Other';
      if (j.room && !j.location) j.location = 'Room ' + j.room;
      if (!j.room && !j.location) return toast('Give the room or the location.', 'bad');
      const no = await allocNumber('JOB'); if (!no) return;
      const rec = Object.assign({ no, started: '', completed: '', issueRefs: '', doneBy: '', srn: '', verifiedBy: '', remarks: '' }, j);
      S.jobs.push(rec);
      const r = S.rooms.find(x => x.no === rec.room);
      if (r) { if (rec.outOfOrder) { r.prevStatus = r.prevStatus || r.status; r.status = 'Out of order'; } else if (rec.type === 'Room configuration') { r.prevStatus = r.prevStatus || r.status; r.status = 'Being configured'; } }
      closeModal(); commit('Job card opened', rec.no + ' ' + rec.location); render(); toast('Job card ' + rec.no + ' issued.', 'ok');
    } }], { wide: true });
};
ACT.jobStart = no => { const j = S.jobs.find(x => x.no === no); j.started = nowDT(); commit(); render(); };
ACT.jobDone = no => {
  const j = S.jobs.find(x => x.no === no);
  const o = { completed: nowDT(), doneBy: j.doneBy || 'In-house', issueRefs: j.issueRefs, srn: j.srn, remarks: j.remarks };
  modal('Complete ' + no, `<p><b>${esc(j.location)}</b> - ${esc(j.problem)}</p>` + fields([
    { k: 'completed', l: 'Date & time completed', t: 'dt' }, { k: 'doneBy', l: 'Done by', t: 'sel', o: S.lists.doneBy },
    { k: 'issueRefs', l: 'Material issue slip no(s).', t: 'text', hint: 'Material is issued against this job card (Issues MH-17)' },
    { k: 'srn', l: 'SRN no. (if contractor)', t: 'sel', o: S.srns.map(s => s.no) },
    { k: 'remarks', l: 'Remarks', t: 'area', full: true },
  ], o), [{ l: 'Mark completed', cls: 'pri', fn: b => {
    readInto(b, o); if (!o.completed) return toast('Enter the completion time.', 'bad');
    Object.assign(j, o); if (!j.started) j.started = j.reported;
    const r = S.rooms.find(x => x.no === j.room);
    if (r) {
      if (j.type === 'Room configuration' && j.config) r.config = j.config;
      const stillOpen = S.jobs.some(x => x !== j && x.room === r.no && !x.completed && (x.outOfOrder || x.type === 'Room configuration'));
      if (!stillOpen && /Out of order|Being configured/.test(r.status)) { r.status = r.prevStatus && !/Out of order|Being/.test(r.prevStatus) ? r.prevStatus : 'Ready'; r.prevStatus = ''; }
    }
    closeModal(); commit('Job card completed', j.no); render(); toast('Completed. The user (HK supervisor / front office) now verifies.', 'ok');
  } }]);
};
ACT.jobVerify = no => {
  const j = S.jobs.find(x => x.no === no), o = { verifiedBy: U.name };
  modal('Verify completion - ' + no, `<p><b>${esc(j.location)}</b> - ${esc(j.problem)}<br>Completed ${fdt(j.completed)} by ${esc(j.doneBy)}.</p>` + fields([{ k: 'verifiedBy', l: 'Completion verified by (HK supervisor / front office)', t: 'text', full: true }], o),
    [{ l: 'Verify', cls: 'pri', fn: b => { readInto(b, o); if (!o.verifiedBy) return toast('Enter who verified.', 'bad'); j.verifiedBy = o.verifiedBy; closeModal(); commit('Job card verified', no); render(); } }]);
};

ACT.room = no => {
  const r = S.rooms.find(x => x.no === no), ed = canEdit('Rooms');
  const jobs = S.jobs.filter(j => j.room === no).sort((a, b) => b.reported.localeCompare(a.reported));
  modal('Room ' + no, fields([

/* ===== Guide ===== */
view('guide', 'How the process works', 'Guide', 'Overview', 'Guide', () => `
  <section class="card"><h3>The flow</h3><ol class="flow">
  <li><b>Budget</b> by line, phased by month (MH-02). HK-01 follows zaereen-days; other lines follow calendar days.</li>
  <li><b>Items, vendors and the MPL</b> (MH-03/04/05) are kept by the Head of Accounts. The MPL is approved with the password and locked.</li>
  <li><b>Which document?</b> Below ${fmt(S.settings.poFrom)} IQD: bill + payment voucher, no PO. From ${fmt(S.settings.poFrom)} IQD: Purchase Order. The app turns it into a PO-cum-Quotation (minimum ${S.settings.minQuotes} quotations) when the value calls for it, and prints the signatures needed.</li>
  <li><b>Budget check</b> by the Internal Auditor before the PO is issued. Over budget: Sigat approves a revision first.</li>
  <li><b>Advance</b> only if the PO terms provide for it (MH-09/10).</li>
  <li><b>Goods: GRN</b> by the GRN Officer, only against an approved PO (MH-11/12). <b>Services: SRN</b> prepared by the Masool, confirmed by the user in charge (MH-13/14).</li>
  <li><b>Bill</b> entered within 3 working days with the payment voucher (MH-15/16A). The app runs the 3-way match.</li>
  <li><b>Pre-payment audit</b> (MH-16): Clear / Hold / Query. Accounts pays only Clear bills.</li>
  <li><b>Close PO</b> when fully received and billed. A closed PO is locked for ever.</li>
  <li>Alongside: issue slips and stores (MH-17/18), housekeeping norms (MH-19), linen and laundry (MH-20/21), service desk and job cards (MH-22), PPM and AMC (MH-23), dashboard (MH-24).</li></ol></section>
  <div class="two"><section class="card"><h3>Golden rules</h3><ul>
  <li>No PO, no purchase of ${fmt(S.settings.poFrom)} IQD or more. No PO, no GRN. No SRN, no payment for labour or services.</li>
  <li>A document number is used once only. A cancelled PO stays in the register with the reason. A closed PO can never be re-opened.</li>
  <li>The person who raises the PO does not receive the goods; the person who receives the goods does not approve the payment.</li>
  <li>Rates come from the approved MPL; a rate above it beyond the tolerance needs the higher approval printed on the PO.</li>
  <li>Never split a requirement into smaller bills or POs to stay below a limit.</li></ul></section>
  <section class="card"><h3>Service desk (rapid repairs and room configuration)</h3><ul>
  <li>Front office or the floor reports to the Masool, who logs the request at once on the Service desk: room, type, priority. A job card number is issued.</li>
  <li><b>Urgent</b> (guest in room, safety, water, power): target ${S.settings.slaUrgentH} hours. <b>High</b>: ${S.settings.slaHighH} hours. <b>Normal</b>: ${S.settings.slaNormalH} hours. The card shows the time left and turns red when overdue.</li>
  <li>Room configuration requests (extra bed, beds joined for a family, accessible setup for elderly zaereen, floor mattresses for groups) put the room in "Being configured" and update its configuration when completed.</li>
  <li>Material for the job is issued against the job card; contractor work needs an SRN. The HK supervisor or front office verifies completion.</li></ul></section></div>
  <section class="card"><h3>Colour legend</h3><p>${flag('OK')} OK / closed &nbsp; ${flag('Check: near limit, pending')} check &nbsp; ${flag('OVER BUDGET')} act now: not allowed, over budget, duplicate, excess, expired</p></section>`);

</script>
<script>

/* Views: procure-to-pay - PO register & lines, advances, GRN, SRN, bills, pre-payment audit, payment voucher */

const poShort = no => no ? no.split('/').slice(-1)[0] : '';
const openPOs = () => S.pos.filter(p => !p.cancel && !p.closedOn);
const tools = html => setTimeout(() => { const t = $('#vtools'); if (t) t.innerHTML = html; });

/* ===== MH-06 / MH-07 PO register ===== */
view('po', 'Purchase orders', 'PO Register', 'Purchasing', 'MH-06 / 07', () => {
  const ed = canEdit('PO Register') && may('Maintenance Masool');

ACT.newPO = async em => {

  const p = { no, date: isoDate(new Date()), vendor: '', line: '', subject: '', delivery: '', place: '', mode: 'Bank transfer', adv: 0, del: 1, ret: 0, retDays: null, credit: 15, other: '', quotes: [], l1reason: '', budgetBy: '', approvedBy: '', approvalDate: '', cancel: false, remarks: '', emergency: em === 'em', closedOn: '', closedBy: '', shortClosed: false, shortReason: '', lines: [] };
  S.pos.push(p); commit('PO number issued', p.no + (p.emergency ? ' (emergency)' : ''));
  if (p.emergency) toast('Emergency PO number issued. Complete, budget-check and approve it on the next working day.', 'warn');

};
App.poLineItem = sel => {
  const tr = sel.closest('tr'), rate = tr.querySelector('[data-lk=rate]');
  const v = $('#f_vendor') ? $('#f_vendor').value : '';
  const m = mplRate(sel.value, v);
  if (m && rate && !rate.value) rate.value = m.rate;
  App.poLineCalc(sel);
};
App.poLineCalc = el => {
  const tr = el.closest('tr'), q = num(tr.querySelector('[data-lk=qty]').value), r = num(tr.querySelector('[data-lk=rate]').value);
  const it = tr.querySelector('[data-lk=item]').value, v = $('#f_vendor') ? $('#f_vendor').value : '';
  const m = mplRate(it, v), cell = tr.querySelector('.lamt'), mc = tr.querySelector('.lmpl');
  if (cell) cell.textContent = fmt(q * r);
  if (mc) mc.innerHTML = m ? fmt(m.rate) + (r && r / m.rate - 1 > num(S.settings.priceTol) ? ' ' + flag('Above MPL +' + ((r / m.rate - 1) * 100).toFixed(0) + '%') : '') : flag('Not on MPL');
  let t = 0; document.querySelectorAll('#le_pol tbody tr').forEach(x => { t += num(x.querySelector('[data-lk=qty]').value) * num(x.querySelector('[data-lk=rate]').value); });

};

  const p = findPO(no), c = C.po[no];

  const edL = !locked && canEdit('PO Lines') && may('Maintenance Masool');
  const edB = !locked && canEdit('PO Register') && may('Internal Auditor');

  const lineCols = [
    { k: 'item', h: 'Item / service', t: 'sel', o: itemOpts(), w: 220, onch: 'App.poLineItem(this)' },
    { k: 'qty', h: 'Qty', t: 'num', w: 70, onin: 'App.poLineCalc(this)' }, { k: 'rate', h: 'Rate (IQD)', t: 'num', w: 90, onin: 'App.poLineCalc(this)' },

    { h: 'Amount', t: 'ro', n: 1, ro: l => `<span class="lamt">${l.item ? fmt(num(l.qty) * num(l.rate)) : ''}</span>` },
    { h: 'MPL rate / check', t: 'ro', ro: (l, i) => { const cl = c.lines[i]; return `<span class="lmpl">${cl && l.item ? (cl.mpl ? fmt(cl.mpl) : '') + ' ' + (cl.price !== 'OK' ? flag(cl.price) : '') + (cl.check !== 'OK' ? ' ' + flag(cl.check) : '') : ''}</span>`; } },
  ];
  const body = `<div class="sum">${flag(c.status)} <b>${esc(c.docType)}</b> <span>Value <b id="poTotal">${fmt(c.value)}</b> IQD</span> <span>Budget ${flag(c.budget)}</span> ${c.ex.map(flag).join(' ')}</div>
  ${p.emergency ? `<p class="note warn">Emergency PO: the number was issued before the order. Complete, budget-check and approve it on the next working day; receive the goods on a GRN against it.${c.signatures.length > 1 || c.approval !== 'Maintenance Masool' ? ' The Head of Accounts must be informed by phone before ordering.' : ''}</p>` : ''}
  ${locked ? `<p class="note">${p.cancel ? 'Cancelled - the number is kept and the PO no longer counts against the budget.' : `Closed on ${fdt(p.closedOn)} by ${esc(p.closedBy)}${p.shortClosed ? ' (short-closed: ' + esc(p.shortReason) + ')' : ''}. A closed PO is locked and can never be re-opened.`}</p>` : ''}
  <h4>PO header</h4>${fields([
    { k: 'date', l: 'PO date', t: 'date', ed: edH, req: 1 }, { k: 'vendor', l: 'Vendor (approved vendor list)', t: 'sel', o: vendorOpts(), ed: edH, req: 1 },

    { k: 'subject', l: 'Subject / description of work', t: 'area', full: true, ed: edH, req: 1 }, { k: 'place', l: 'Place of delivery / work', t: 'text', ed: edH },

  <h4>Item lines (MH-07) - at most 20 lines</h4>${linesEditor('pol', lineCols, p.lines, edL, 20)}

    { k: 'mode', l: 'Payment mode', t: 'sel', o: S.lists.payModes, ed: edH }, { k: 'adv', l: 'Advance', t: 'pct', ed: edH },
    { k: 'del', l: 'On delivery / completion', t: 'pct', ed: edH }, { k: 'ret', l: 'Retention', t: 'pct', ed: edH },
    { k: 'retDays', l: 'Retention released after (days)', t: 'num', ed: edH }, { k: 'credit', l: 'Credit days after bill', t: 'num', ed: edH },
    { k: 'other', l: 'Other payment terms', t: 'area', full: true, ed: edH },

ACT.newBILL = async () => {

ACT.editBILL = no => {

  const refs = (b.refs || '').split(/;\s*/).filter(Boolean);
  modal('Bill ' + no, `<div class="sum">${flag(r.pay)} Net payable <b>${fmt(r.net)}</b> IQD &middot; 3-way match ${flags(r.match)}</div>
    ${b.audit === 'Clear' && !paid ? '<p class="note">Cleared by the Internal Auditor - the bill entry is locked. Accounts records the payment.</p>' : ''}${paid ? '<p class="note">Paid - locked.</p>' : ''}
    <div class="grid"><div class="fld"><label>PO no. (blank for a purchase below ${fmt(S.settings.poFrom)} IQD)</label><select data-doc="${esc(no)}" onchange="App.billPO(this)" ${edM ? '' : 'disabled'}>${opts(S.pos.filter(x => !x.cancel && (!x.closedOn || x.no === b.po)).map(x => [x.no, x.no + ' - ' + x.vendor]), b.po)}</select></div></div>`
    + fields([
      { k: 'date', l: 'Date submitted to Accounts', t: 'date', ed: edM }, { k: 'invNo', l: 'Vendor invoice no.', t: 'text', ed: edM, req: 1 }, { k: 'invDate', l: 'Invoice date', t: 'date', ed: edM },
      { k: 'amount', l: 'Invoice amount (IQD)', t: 'num', ed: edM, req: 1 },

      { k: 'otherDed', l: 'Other deductions (IQD)', t: 'num', ed: edM, hint: 'e.g. pieces lost by the laundry at the MPL linen rate' },
    ].concat(p ? [] : [{ k: 'vendor', l: 'Vendor (no-PO bills only)', t: 'sel', o: vendorOpts(), ed: edM }, { k: 'line', l: 'Budget line (no-PO bills only)', t: 'sel', o: lineOpts(), ed: edM }, { k: 'mode', l: 'Payment mode (no-PO bills)', t: 'sel', o: S.lists.payModes, ed: edM }])
      .concat([{ k: 'desc', l: 'Description of purchase / purpose', t: 'area', full: true, ed: edM }]), b)
    + (p ? `<h4>GRN / SRN attached</h4><div class="chips">${refsAvail.length ? refsAvail.map(x => `<label class="chk"><input type="checkbox" class="refck" value="${esc(x)}" ${refs.includes(x) ? 'checked' : ''} ${edM ? '' : 'disabled'}> ${esc(x)}</label>`).join('') : '<span class="flag bad">No GRN / SRN on this PO yet</span>'}</div>` : '')
    + `<h4>Computed</h4>` + kv([['Vendor', esc(r.vendor), 'Budget line', esc(r.line)], ['PO value', fmt(r.poValue), 'Received (GRN + SRN)', fmt(r.received)], ['Billed to date on PO', fmt(r.billedToDate), 'Retention ' + pct(r.retPct), fmt(r.retention)], ['Advance balance before this bill', fmt(r.advBalBefore), 'Net payable', '<b>' + fmt(r.net) + '</b>']])
    + `<h4>Pre-payment audit and payment</h4>` + kv([['Audit status', b.audit ? flag(b.audit) : 'Awaiting audit', 'Auditor remarks', esc(b.auditRemarks)], ['PV no.', esc(b.pv), 'Paid on / reference', fdate(b.payDate) + ' ' + esc(b.payRef)]]),
    [edM && { l: 'Save', cls: 'pri', fn: body => {

      canSee('Payment Voucher') && { l: 'Print payment voucher (MH-16A)', fn: () => printPV(no) },
      canSee('Payment Pack') && { l: 'Audit / payment pack (MH-16)', fn: () => ACT.auditBill(no) }], { wide: true });
};
function printPV(no) {

      ['Less: other deductions', fmt(b.otherDed), 'System check', esc(r.match)], ['NET PAYABLE', `<b>${fmt(r.net)}</b><br><small>${esc(amountWords(r.net))}</small>`, 'Status', esc(r.pay)]])
    + `<h4>Documents attached (tick)</h4><table class="lt"><thead><tr><th>#</th><th>Document</th><th>Needed?</th><th>Tick</th></tr></thead><tbody>${['Original bill / invoice, signed by the Masool as goods or service received', 'PO / PO-cum-Quotation, with the quotations', 'GRN (goods) or SRN (labour / services)', 'Advance voucher, where an advance is adjusted', 'Quotation or market rate note, for purchases without a PO'].map((d, i) => `<tr><td>${i + 1}</td><td>${d}</td><td>${need[i] ? 'Yes' : '-'}</td><td>&#9744;</td></tr>`).join('')}</tbody></table>`

}

/* ===== MH-16 Pre-payment audit & payment pack ===== */
view('audit', 'Pre-payment audit & payments', 'Payment Pack', 'Bills & payment', 'MH-16', () => {
  const groups = [['Awaiting audit', 'Awaiting audit'], ['On hold / query', /hold|Query/i], ['Cleared - awaiting payment', 'Cleared - awaiting payment'], ['Paid', 'Paid']];
  return `<p class="muted">The Internal Auditor completes the checklist on every bill and marks it Clear, Hold or Query. Accounts pays only Clear bills (weekly payment run) and records the PV number, date and reference.</p>` + groups.map(([t, m]) => {
    const list = S.bills.filter(b => m instanceof RegExp ? m.test(C.bill[b.no].pay) : C.bill[b.no].pay === m).reverse();
    return `<section class="card"><h3>${t} <span class="muted">${list.length} &middot; ${fmt(list.reduce((a, b) => a + C.bill[b.no].net, 0))} IQD net</span></h3>` + table('aud' + t.replace(/\W/g, ''), [
      { h: 'Bill entry no.', v: b => `<b>${esc(b.no)}</b>` }, { h: 'Submitted', v: b => fdate(b.date) }, { h: 'Vendor', v: b => esc(C.bill[b.no].vendor) }, { h: 'PO', v: b => esc(poShort(b.po) || 'No PO') },
      { h: 'Invoice', n: 1, v: b => fmt(b.amount) }, { h: 'Net payable', n: 1, v: b => fmt(C.bill[b.no].net) }, { h: '3-way match', v: b => flags(C.bill[b.no].match) },
      { h: 'Auditor remarks', v: b => esc(b.auditRemarks) }, { h: 'Paid', v: b => fdate(b.payDate) + ' ' + esc(b.payRef) },
    ], list, { click: 'auditBill', key: b => b.no, name: 'Audit ' + t, noTools: list.length < 8 }) + '</section>';
  }).join('');
});
function auditChecks(b) {
  const r = C.bill[b.no], p = b.po ? findPO(b.po) : null, c = p ? C.po[p.no] : null, m = r.match;
  const has = s => m.includes(s);
  return [
    ['Original invoice attached; vendor name, invoice no., date and amount agree with this voucher', has('Duplicate') || has('Invoice no. missing') ? 'Check invoice no.' : 'Manual'],
    ['PO / PO-cum-Quotation attached and approved as per authority matrix', !p ? (num(b.amount) >= num(S.settings.poFrom) ? 'No PO for bill above PO limit' : 'Below PO limit - no PO needed') : p.approvedBy ? 'OK - ' + p.approvedBy : 'Approval not recorded'],
    ['Quotations attached (PO-cum-Quotation) and L1 selected or reason recorded', c ? c.qcheck : '-'],
    ['Rates as per approved MPL, or deviation approved', c ? (c.above ? c.above + ' line(s) above MPL - approval: ' + c.priceAppr : 'OK') : '-'],
    ['GRN / SRN attached, signed; billed does not exceed received', !p ? '-' : has('GRN / SRN not attached') ? 'GRN / SRN not attached' : has('more than received') ? 'Billed more than received' : 'OK'],
    ['Billed to date does not exceed PO value', !p ? '-' : has('more than PO value') ? 'Billed more than PO value' : 'OK'],
    ['Advance adjusted correctly; retention deducted as per PO', !p ? '-' : has('Advance') ? m.split('; ').filter(x => /Advance/.test(x)).join('; ') : 'OK'],
    ['Not a duplicate invoice; invoice not dated before the PO', has('Duplicate') ? 'Duplicate invoice no.' : has('before PO') ? 'Invoice dated before PO' : 'OK'],
    ['Budget available on the budget line (PO budget check)', c ? c.budget : '-'],
    ['Arithmetic, taxes and vendor bank details checked against AVL', 'Manual' + ((vendor(r.vendor) || {}).bank ? '' : ' - bank details not on AVL')],
  ];
}
ACT.auditBill = no => {
  const b = S.bills.find(x => x.no === no), r = C.bill[no];
  const edI = canEdit('Payment Pack') && may('Internal Auditor') && !b.payDate;
  const edA = (canEdit('Bills') || canEdit('Payment Pack')) && may('Accounts') && b.audit === 'Clear';
  const ch = auditChecks(b);
  b.checks = b.checks || {};
  modal('Pre-payment audit - ' + no, kv([['Vendor', esc(r.vendor), 'Budget line', esc(r.line)], ['Invoice no. / date', esc(b.invNo) + ' ' + fdate(b.invDate), 'PO no.', esc(b.po || 'No PO')], ['GRN / SRN attached', esc(b.refs), 'PV no.', esc(b.pv)]])
    + '<h4>Payment computation (IQD)</h4>' + kv([['Invoice amount', fmt(b.amount), 'PO value', fmt(r.poValue)], ['Less: advance adjusted', fmt(b.advAdj), 'Received (GRN + SRN)', fmt(r.received)], ['Less: retention', fmt(r.retention), 'Billed to date on PO', fmt(r.billedToDate)], ['Less: other deductions', fmt(b.otherDed), 'Advance balance before bill', fmt(r.advBalBefore)], ['NET PAYABLE', '<b>' + fmt(r.net) + '</b>', 'Payment status', flag(r.pay)]])
    + `<h4>Checklist</h4><table class="lt"><thead><tr><th>#</th><th>Check</th><th>System result</th><th>Auditor tick</th></tr></thead><tbody>${ch.map(([t, s], i) => `<tr><td>${i + 1}</td><td>${esc(t)}</td><td>${s === 'Manual' || s === '-' ? esc(s) : flags(s)}</td><td><input type="checkbox" class="atk" data-i="${i}" ${b.checks[i] ? 'checked' : ''} ${edI ? '' : 'disabled'}></td></tr>`).join('')}</tbody></table>`
    + fields([{ k: 'audit', l: 'Audit status (Internal Auditor)', t: 'sel', o: ['Clear', 'Hold', 'Query'], ed: edI }, { k: 'auditDate', l: 'Audit date', t: 'date', ed: edI }, { k: 'auditRemarks', l: 'Auditor remarks', t: 'area', full: true, ed: edI },
      { k: 'pv', l: 'PV no. (Accounts)', t: 'text', ed: edA }, { k: 'payDate', l: 'Payment date (Accounts)', t: 'date', ed: edA }, { k: 'payRef', l: 'Payment reference (Accounts)', t: 'text', ed: edA, hint: 'Bank transfer to the account on the AVL' }], b),
    [(edI || edA) && { l: 'Save', cls: 'pri', fn: body => {
      const o = Object.assign({}, b); readInto(body, o);
      if (edI) { o.checks = {}; body.querySelectorAll('.atk').forEach(x => { o.checks[x.dataset.i] = x.checked; }); }
      if (edI && o.audit === 'Clear' && r.match !== 'OK') return toast('3-way match is not OK (' + r.match + '). Mark Hold or Query with remarks.', 'bad');
      if (edI && o.audit === 'Clear' && Object.values(o.checks).filter(Boolean).length < ch.length) return toast('Tick every checklist line before marking Clear.', 'bad');
      if (edI && o.audit && o.audit !== 'Clear' && !o.auditRemarks) return toast('Give remarks for Hold / Query - the bill goes back to the Masool.', 'bad');
      if (edI && o.audit && !o.auditDate) o.auditDate = isoDate(new Date());
      if (edA && o.payDate && !o.payRef) return toast('Record the payment reference.', 'bad');
      const act = o.audit !== b.audit ? 'Bill audit: ' + o.audit : o.payDate && !b.payDate ? 'Bill paid' : 'Bill audit / payment updated';
      Object.assign(b, o); commit(act, no); render(); ACT.auditBill(no);
    } }, { l: 'Print / export (MH-16)', fn: () => printPack(no) }], { wide: true });
};
function printPack(no) {
  const b = S.bills.find(x => x.no === no), r = C.bill[no], ch = auditChecks(b);
  printDoc('PRE-PAYMENT AUDIT CHECKLIST & PAYMENT PACK (MH-16) ' + no, kv([['Bill entry no.', `<b>${esc(no)}</b>`, 'Submitted on', fdate(b.date)], ['Vendor', esc(r.vendor), 'Budget line', esc(r.line)], ['Invoice no. / date', esc(b.invNo) + ' ' + fdate(b.invDate), 'PO no.', esc(b.po || 'No PO')], ['GRN / SRN attached', esc(b.refs), 'PV no.', esc(b.pv)]])
    + '<h4>Payment computation (IQD)</h4>' + kv([['Invoice amount', fmt(b.amount), 'PO value', fmt(r.poValue)], ['Less: advance adjusted', fmt(b.advAdj), 'Received (GRN + SRN)', fmt(r.received)], ['Less: retention', fmt(r.retention), 'Billed to date on PO', fmt(r.billedToDate)], ['Less: other deductions', fmt(b.otherDed), 'Advance balance before bill', fmt(r.advBalBefore)], ['NET PAYABLE', '<b>' + fmt(r.net) + '</b>', 'Payment status', esc(r.pay)]])
    + `<h4>Pre-payment audit checklist</h4><table class="lt"><thead><tr><th>#</th><th>Check</th><th>System result</th><th>Auditor tick</th></tr></thead><tbody>${ch.map(([t, s], i) => `<tr><td>${i + 1}</td><td>${esc(t)}</td><td>${esc(s)}</td><td>${(b.checks || {})[i] ? '&#9745;' : '&#9744;'}</td></tr>`).join('')}</tbody></table>`
    + kv([['Overall result', esc(r.match), 'Audit status', esc(b.audit || 'Awaiting audit')], ['Auditor remarks', esc(b.auditRemarks), 'Paid on / reference', fdate(b.payDate) + ' ' + esc(b.payRef)]])
    + sigs(['Submitted - Masool', 'Internal Auditor', 'Released - Head of Accounts', 'Paid by - Accounts']));
}

</script>
<script>
/* ---- views_admin.js ---- */
/* Views: stores, housekeeping, masters (items, vendors, MPL, budget, settings) and admin */

/* ===== MH-17 Issues ===== */

ACT.saveCounts = () => {

ACT.postAdj = () => {

  if (!(canEdit('Issues') && may('GRN Officer'))) return toast('You cannot raise issue slips.', 'bad');
  confirmBox('Post count adjustments', `${diffs.length} item(s) differ from the book. An issue slip "Count adjustment" will be raised (shortage = positive qty, gain = negative qty). It must be approved by the Masool.`, 'Raise issue slip', async () => {
    const last = `${MON[S.settings.month - 1]} ${S.settings.year}`;
    const d = isoDate(new Date(S.settings.year, S.settings.month, 0));
    const no = await allocNumber('ISS'); if (!no) return;
    const s = { no, date: d, issuedTo: 'Count adjustment', job: '', recvBy: U.name, remarks: 'Month-end count ' + last + ' - approved by Masool: ____', lines: diffs.map(([code, st]) => ({ item: code, qty: -st.diff })) };

/* ===== MH-05 MPL ===== */
function mplCheck(r) {
  if (!item(r.item)) return 'Item not in master';
  if (!vendor(r.vendor)) return 'Vendor not on AVL';
  if (num(r.rate) <= 0) return 'Rate missing';
  if (!r.from || !r.to) return 'Validity missing';
  if (r.to < reportDate()) return 'EXPIRED';
  return 'OK';
}

App.restore = inp => {
  const f = inp.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { const d = JSON.parse(rd.result); if (d.meta?.app !== 'KUN-MH' || !Array.isArray(d.pos)) throw new Error('Not a KUN M&H backup file'); confirmBox('Restore backup?', (SHARED ? 'The shared data for every user' : 'Everything in this browser') + ' is replaced with the backup of ' + esc(f.name) + '.', 'Restore', () => {
      const me = U.id;
      if (SHARED) { d.users = S.users; }   // keep the current people links
      S = d; S.hkExplain = S.hkExplain || {}; S.counts = S.counts || {}; S.linenCounts = S.linenCounts || {};
      U = S.users.find(u => u.id === me) || null; closeModal();
      if (!U) { saveData(); return renderLogin(); }
      commit('Backup restored', f.name); render(); toast('Backup restored.', 'ok');
    }, { danger: true }); }
    catch (e) { toast('Could not read the backup: ' + e.message, 'bad'); }
  };
  rd.readAsText(f);
};

  if (which === 'tx') {

    can: () => canEdit('Users'), why: () => 'Admin only.', list: () => S.users,
    cols: [
      { k: 'id', h: 'User ID', req: 1, t: 'up', al: ['id', 'user', 'userid'], note: 'No spaces; stored in capitals.' },
      { k: 'name', h: 'Full name', req: 1, al: ['name'] },
      { k: 'desig', h: 'Designation', al: ['desig', 'title'] },
      { k: 'role', h: 'Role', req: 1, t: 'pick', o: () => ROLES, note: 'Decides the pages the user sees (Access rights).' },
      { k: 'active', h: 'Active (Y/N)', t: 'yn', al: ['active'], note: 'N blocks the user. Default Y.' },
      { k: 'contact', h: 'Phone / e-mail', al: ['contact', 'phone', 'email', 'e-mail'] },
    ],
    need: u => u.has('id') ? '' : 'The "User ID" column is missing.',
    find: r => r.id ? S.users.find(x => x.id === r.id) || null : null,
    key: r => r.id,
    check: (r, ex, ctx, E) => { if (ex && ex === U && ((r.role && r.role !== 'Admin') || r.active === 'N')) E.push('You cannot remove your own Admin role or block yourself'); },
    blank: () => ({ id: '', name: '', desig: '', role: 'Maintenance Masool', active: 'Y', mustChange: true, lastLogin: '', contact: '', hash: null, salt: null, cid: '' }),
    show: ['id', 'name', 'role', 'active'],
  },
};

/* ---------- converting and checking rows ---------- */
function impDate(v) {
  if (typeof v === 'number') { if (v < 1 || v > 100000) return { err: '"' + v + '" is not a date' }; return { v: new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10) }; }
  const s = String(v).trim(); let y, m, d, x;
  const mon = t => MON.findIndex(n => n.toLowerCase() === t.slice(0, 3).toLowerCase()) + 1;
  if ((x = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(s))) [y, m, d] = [+x[1], +x[2], +x[3]];
  else if ((x = /^(\d{1,2})[-/. ](\d{1,2})[-/. ](\d{2,4})$/.exec(s))) [d, m, y] = [+x[1], +x[2], +x[3]];
  else if ((x = /^(\d{1,2})[-/ ]([A-Za-z]{3,9})[-/ ,]+(\d{2,4})$/.exec(s))) [d, m, y] = [+x[1], mon(x[2]), +x[3]];
  else return { err: '"' + s + '" is not a date (use dd-mm-yyyy)' };
  if (y < 100) y += 2000;
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (!m || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return { err: '"' + s + '" is not a valid date (use dd-mm-yyyy)' };
  return { v: dt.toISOString().slice(0, 10) };
}
function impConv(c, v) {
  switch (c.t) {
    case 'num': {
      if (typeof v === 'number') return { v };
      const s = String(v).replace(/[,\s]/g, '');
      return /^-?(\d+\.?\d*|\.\d+)$/.test(s) ? { v: parseFloat(s) } : { err: '"' + v + '" is not a number' };
    }
    case 'date': return impDate(v);
    case 'yn': { const s = lc(String(v).trim()); return ['y', 'yes', 'true', '1'].includes(s) ? { v: 'Y' } : ['n', 'no', 'false', '0'].includes(s) ? { v: 'N' } : { err: 'use Y or N' }; }
    case 'up': return { v: String(v).toUpperCase().replace(/\s+/g, '') };
    case 'pick': {
      const o = c.o().map(x => Array.isArray(x) ? x : [x]), n = impNorm(v);
      const f = o.find(x => x.some(a => impNorm(a) === n));
      if (f) return { v: f[0] };
      if (c.addNew) return { v: String(v).trim(), warn: c.h + ' "' + String(v).trim() + '" is new - it will be added to the list' };
      return { err: '"' + v + '" is not on the list' + (o.length <= 10 ? ' (' + o.map(x => x[0]).join(', ') + ')' : '') };
    }
    default: return { v: String(v).trim() };
  }
}
function impPrepare(kind, table) {
  const sp = IMPORTS[kind], cols = sp.cols;
  const match = h => { const n = impNorm(h); return n ? cols.find(c => [c.h, c.k].concat(c.al || []).some(a => impNorm(a) === n)) || null : null; };
  let hr = -1, map = [];
  for (let r = 0; r < Math.min(table.length, 15); r++) {
    const m = (table[r] || []).map(match);
    if (m.filter(Boolean).length >= Math.min(2, cols.length)) { hr = r; map = m; break; }
  }
  if (hr < 0) return { err: 'No header row found. The first row must hold the column names of the template, e.g. ' + cols.slice(0, 3).map(c => '"' + c.h + '"').join(', ') + '.' };
  const used = new Set();
  map = map.map(c => { if (!c || used.has(c.k)) return null; used.add(c.k); return c; });
  const ignored = (table[hr] || []).filter((h, i) => String(h ?? '').trim() && !map[i]).map(h => String(h).trim());
  const needErr = sp.need(used); if (needErr) return { err: needErr };
  let vn = Math.max(0, ...S.vendors.map(v => +(/^V-(\d+)$/i.exec(v.code) || [])[1] || 0));
  const ctx = { names: new Set(), keys: new Map(), nextVendor: () => 'V-' + pad4(++vn) };
  const rows = [];
  for (let r = hr + 1; r < table.length; r++) {
    const cells = table[r] || [];
    if (!cells.some(v => String(v ?? '').trim() !== '')) continue;
    const raw = {}, E = [], W = [];
    map.forEach((c, i) => {
      if (!c) return; const v = cells[i];
      if (v === undefined || v === null || String(v).trim() === '') return;
      const x = impConv(c, v);
      if (x.err) E.push(c.h + ': ' + x.err); else { raw[c.k] = x.v; if (x.warn) W.push(x.warn); }
    });
    const ex = sp.find(raw);
    if (!ex) cols.filter(c => c.req && raw[c.k] === undefined && !E.some(e => e.startsWith(c.h + ':'))).forEach(c => E.push(c.h + ' is needed for a new row'));
    if (sp.check) sp.check(raw, ex, ctx, E, W);
    const key = sp.key(raw) || '';
    const kk = lc(key);
    if (kk && ctx.keys.has(kk)) E.push('Same ' + sp.match.split(' (')[0].toLowerCase() + ' as row ' + ctx.keys.get(kk));
    else if (kk) ctx.keys.set(kk, r + 1);
    const changes = ex ? Object.keys(raw).filter(k => String(ex[k] ?? '') !== String(raw[k] ?? '')) : [];
    const action = E.length ? 'Error' : !ex ? 'New' : changes.length ? 'Update' : 'No change';
    rows.push({ n: r + 1, raw, ex, key, action, E, W, changes });
  }
  return { rows, ignored, used, hr };
}

/* ---------- screens ---------- */
let IMP = null;   // { kind, wb, idx, name, prep, replace }
const impColByK = (kind, k) => IMPORTS[kind].cols.find(c => c.k === k) || { h: k };
const impShowVal = v => v === null || v === undefined || v === '' ? '<span class="muted">(blank)</span>' : esc(typeof v === 'number' ? fmtQ(v) : v);
function impCard(kind, inModal) {
  const sp = IMPORTS[kind], ok = sp.can();
  return `<h3>${esc(sp.label)} <small class="muted">${esc(sp.fmt)} &middot; ${sp.list().length} rows now</small></h3>
    <p class="small muted">${esc(sp.desc)} Matched on: ${esc(sp.match)}.</p>
    ${ok ? `<div class="vtools"><button class="btn" data-act="impTpl" data-id="${kind}">Download Excel template</button>
      <label class="btn pri">Import Excel file<input type="file" accept=".xlsx,.xlsm,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv" hidden onchange="App.importFile('${kind}', this)"></label>
      ${inModal ? '' : `<a href="#" data-act="goto" data-id="${sp.view}" class="small">Open the list</a>`}</div>`
    : `<p class="small">${flag(sp.why())}</p>`}`;
}
view('import', 'Import master data from Excel', 'Items', 'Masters', 'Import', () => `
  <section class="card"><h3>How it works</h3><ol class="flow">
  <li><b>Download the Excel template</b> of the list. It already holds the rows in the app, so you can correct them and add new rows below. A second sheet explains every column.</li>
  <li><b>Fill it in Excel</b> - one row per record, keep the header row. Your own master sheet also works if its column headings match the template (extra columns are ignored).</li>
  <li><b>Import the file</b> (.xlsx or .csv). The app first shows every row as New, Update, No change or Error, and saves only when you confirm. Rows with errors are skipped - correct them in Excel and import again.</li>
  <li>Rows already in the app are matched and updated; <b>blank cells keep the value already in the app</b>. Nothing is deleted (except rooms, when you tick "replace the room list").</li>
  <li>Order: Items and Vendors first, then MPL rates (they refer to items and vendors), then PPM equipment.</li></ol></section>
  <div class="two">${Object.keys(IMPORTS).map(k => `<section class="card">${impCard(k)}</section>`).join('')}</div>`);
ACT.impOpen = kind => modal('Import ' + IMPORTS[kind].label.toLowerCase() + ' from Excel', impCard(kind, true)
  + '<p class="small muted">Blank cells keep the value already in the app; rows with errors are skipped. You see every row before anything is saved. More lists: Masters &gt; Import from Excel.</p>', [], { noFocus: true });
const impBtn = kind => IMPORTS[kind].can() ? `<button class="btn ghost" data-act="impOpen" data-id="${kind}">Import from Excel</button>` : '';

ACT.impTpl = kind => {
  const sp = IMPORTS[kind];
  const val = (c, v) => v === null || v === undefined ? '' : c.t === 'num' ? (v === '' ? '' : num(v)) : c.t === 'date' && v ? fdate(v) : v;
  const data = [sp.cols.map(c => c.h)].concat(sp.list().map(o => sp.cols.map(c => val(c, o[c.k]))));
  const what = c => c.note || (c.t === 'num' ? 'Number' : c.t === 'date' ? 'Date' : c.t === 'yn' ? 'Y or N' : c.t === 'pick' ? '' : 'Text');
  const allowed = c => { if (c.t !== 'pick') return c.t === 'date' ? 'dd-mm-yyyy, dd-Mon-yyyy or an Excel date' : ''; const o = c.o().map(x => Array.isArray(x) ? x[0] : x); return o.length <= 40 ? o.join(' | ') : 'See the list in the app'; };
  const info = [['Column', 'Needed for a new row', 'What to enter', 'Allowed values / format']].concat(sp.cols.map(c => [c.h, c.req ? 'Yes' : '', what(c), allowed(c)]))
    .concat([[], ['How the import works'], ['Rows are matched on: ' + sp.match + '. A match updates that row; anything else is added as a new row.'],
      ['Blank cells keep the value already in the app. Nothing is deleted by an import.'], ['Keep the header row of the first sheet as it is. Extra columns are ignored.'],
      ['Import the file from Masters > Import from Excel (or the Import from Excel button on the list). The app shows every row before it saves.']]);
  const bytes = xlsxBuild([
    { name: sp.sheet, rows: data, widths: sp.cols.map(c => Math.min(45, Math.max(12, c.h.length + 4))) },
    { name: 'Instructions', rows: info, widths: [34, 20, 60, 60] },
  ]);
  download(`KUN_MH_${sp.sheet.replace(/\W+/g, '_')}_template_${isoDate(new Date())}.xlsx`, bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
};

App.importFile = async (kind, inp) => {
  const f = inp.files && inp.files[0]; if (!f) return;
  try {
    const buf = new Uint8Array(await f.arrayBuffer()); inp.value = '';
    let wb;
    if (buf[0] === 0xD0 && buf[1] === 0xCF) throw new Error('this is the old .xls format. In Excel use File > Save As > Excel Workbook (.xlsx), then import that file');
    if (buf[0] === 0x50 && buf[1] === 0x4B) wb = await readXlsx(buf);
    else wb = { sheets: [{ name: f.name, rows: parseCSV(new TextDecoder().decode(buf)) }] };
    const sp = IMPORTS[kind];
    let idx = wb.sheets.findIndex(s => impNorm(s.name) === impNorm(sp.sheet));
    if (idx < 0) idx = wb.sheets.findIndex(s => !/instruction/i.test(s.name) && s.rows.length);
    IMP = { kind, wb, idx: Math.max(0, idx), name: f.name, replace: false };
    impShow();
  } catch (e) { console.error(e); toast('Could not read ' + f.name + ': ' + e.message, 'bad'); }
};
App.impSheet = i => { IMP.idx = +i; impShow(); };
App.impReplace = v => { IMP.replace = v; };
function impShow() {
  const { kind, wb, idx, name } = IMP, sp = IMPORTS[kind];
  const prep = IMP.prep = impPrepare(kind, wb.sheets[idx].rows);
  const sheetSel = wb.sheets.length > 1 ? `<label class="mp">Sheet <select onchange="App.impSheet(this.value)">${opts(wb.sheets.map((s, i) => [i, s.name]), idx, false)}</select></label>` : '';
  if (prep.err) return modal('Import ' + sp.label.toLowerCase(), `<div class="sum"><b>${esc(name)}</b> ${sheetSel}</div><p class="note warn">${esc(prep.err)}</p><p class="small muted">Download the Excel template to see the expected column names.</p>`, [{ l: 'Download Excel template', fn: () => ACT.impTpl(kind) }], { wide: true, noFocus: true });
  const c = a => prep.rows.filter(r => r.action === a).length;
  const nN = c('New'), nU = c('Update'), nS = c('No change'), nE = c('Error'), go = nN + nU;
  const AF = { New: 'ok', Update: '', 'No change': 'ok', Error: 'bad' };
  const keepRooms = kind === 'rooms' ? S.rooms.filter(r => !prep.rows.some(x => x.action !== 'Error' && lc(x.key) === lc(r.no))) : [];
  const cols = [
    { h: 'Row', n: 1, v: r => r.n }, { h: 'Key', v: r => `<b>${esc(r.key)}</b>` },
    { h: 'Result', v: r => `<span class="flag ${AF[r.action]}">${esc(r.action)}</span>`, x: r => r.action },
    { h: 'Details', w: 260, v: r => r.E.map(e => `<span class="flag bad">${esc(e)}</span>`).concat(r.W.map(w => `<span class="flag">${esc(w)}</span>`)).join(' ')
        + (r.action === 'Update' ? '<div class="small">' + r.changes.map(k => `${esc(impColByK(kind, k).h)}: ${impShowVal(r.ex[k])} &rarr; ${impShowVal(r.raw[k])}`).join('<br>') + '</div>' : ''),
      x: r => r.E.concat(r.W).concat(r.action === 'Update' ? r.changes.map(k => impColByK(kind, k).h + ': ' + (r.ex[k] ?? '') + ' -> ' + (r.raw[k] ?? '')) : []).join('; ') },
  ].concat(sp.show.map(k => ({ h: impColByK(kind, k).h, v: r => impShowVal(r.raw[k] !== undefined ? r.raw[k] : r.ex ? r.ex[k] : ''), x: r => r.raw[k] ?? (r.ex ? r.ex[k] : '') ?? '' })));
  const body = `<div class="sum"><b>${esc(name)}</b> ${sheetSel} <span class="muted">${prep.rows.length} data row(s), header on row ${prep.hr + 1}</span>
      <span class="flag ok">New ${nN}</span> <span class="flag">Update ${nU}</span> <span class="flag ok">No change ${nS}</span> <span class="flag ${nE ? 'bad' : 'ok'}">Errors ${nE}</span></div>
    ${prep.ignored.length ? `<p class="note warn">Columns not recognised - ignored: ${esc(prep.ignored.join(', '))}</p>` : ''}
    ${nE ? `<p class="note warn">${nE} row(s) with errors will be skipped. Correct them in Excel and import the file again - rows already imported then show "No change".</p>` : ''}
    ${kind === 'rooms' && keepRooms.length ? `<label class="chk"><input type="checkbox" onchange="App.impReplace(this.checked)"> Replace the room list: remove the ${keepRooms.length} room(s) in the app that are not in this file (rooms with an open request are kept)</label>` : ''}
    ${table('imp', cols, prep.rows, { name: 'Import check ' + sp.label, noTools: prep.rows.length < 12, rowCls: r => '' })}`;
  modal('Import ' + sp.label.toLowerCase() + ' - check', body, [
    go && { l: `Import ${go} row(s)`, cls: 'pri', fn: () => impApply() },
    { l: 'Download Excel template', fn: () => ACT.impTpl(kind) },
  ], { wide: true, noFocus: true });
}
function impApply() {
  const { kind, prep, name } = IMP, sp = IMPORTS[kind];
  if (!sp.can()) return toast(sp.why(), 'bad');
  let nN = 0, nU = 0, nR = 0;
  prep.rows.forEach(r => {
    if (r.action === 'New') { const o = Object.assign(sp.blank(), r.raw); if (sp.fix) sp.fix(o); sp.list().push(o); nN++; }
    else if (r.action === 'Update') { Object.assign(r.ex, r.raw); if (sp.fix) sp.fix(r.ex); nU++; }
  });
  if (kind === 'rooms' && IMP.replace) {
    const inFile = new Set(prep.rows.filter(r => r.action !== 'Error').map(r => lc(r.key)));
    const busy = no => S.jobs.some(j => j.room === no && !j.completed);
    const keep = S.rooms.filter(r => inFile.has(lc(r.no)) || busy(r.no));
    nR = S.rooms.length - keep.length; S.rooms = keep;
  }
  if (sp.after) sp.after();
  if (kind === 'users' && SHARED) S.users.forEach(u => { if (u.cid === undefined) u.cid = ''; });
  IMP = null; closeModal();
  commit('Imported from Excel', `${sp.label}: ${nN} new, ${nU} updated${nR ? ', ' + nR + ' removed' : ''} (${name})`);
  render(); toast(`${sp.label}: ${nN} added, ${nU} updated${nR ? ', ' + nR + ' removed' : ''}.`, 'ok');
}
</script>
<script>const PRINT_CSS = document.getElementById('printcss').textContent.replace(/@media print\{[\s\S]*?\}\s*\}/, '');</script>
</body>
