<div id="app"></div>
<div id="staleBar" hidden style="position:fixed;top:0;left:0;right:0;z-index:300;padding:8px 12px;text-align:center;background:var(--warn);color:#000">Colleagues changed data · <button class="btn sm" data-act="refreshNow">Refresh</button></div>

<script>
/* ---- seed.js ---- */
/* KUN Karbala - Maintenance & Housekeeping app
   Seed data: taken from KUN_Karbala_Maintenance_Housekeeping_Control.xlsm (Version 1.1, 31 Oct 2026)
   and KUN_MH_User_Access_Input.xlsx. Example rows (October 2026) are marked ex:true. */

const DEFAULT_ROLES = ['Admin', 'Sigat', 'Internal Auditor', 'Maintenance Masool', 'GRN Officer', 'HK Supervisor', 'Accounts', 'Store Keeper'];
// v2.2: a role that is checked by name in the code acts as its base role (Store Keeper acts as GRN Officer).
const ROLE_BASE = { 'Store Keeper': 'GRN Officer' };
// Editable role list (version 2.2): up to 20 roles, stored with the settings (cfg/roles).
const MAX_ROLES = 20;
const defaultRoles = () => ({ list: DEFAULT_ROLES.slice(), base: { ...ROLE_BASE } });
const roleList = () => (S && S.roles && Array.isArray(S.roles.list) && S.roles.list.length) ? S.roles.list : DEFAULT_ROLES;
const roleBaseOf = r => (S && S.roles && S.roles.base && S.roles.base[r]) || ROLE_BASE[r] || null;
const isBaseRole = r => DEFAULT_ROLES.includes(r);

// Module -> format and default rights per role (order as roleList()). From the Access sheet; "Rooms" and "Number Log" added.
const MODULES = [
  ['Guide', 'Guide', 'EVEHVVVV'],
  ['My desk', 'Home', 'EEEEEEEE'],
  ['Dashboard', 'MH-24', 'EVEHHHVH'],
  ['Rooms', 'Desk', 'EVVEVEHH'],
  ['Settings', 'MH-01', 'EVEHHHHH'],
  ['Budget', 'MH-02', 'EVEHHHVH'],
  ['Items', 'MH-03', 'EVEEVHVH'],
  ['Vendors', 'MH-04', 'EVEEHHVH'],
  ['MPL', 'MH-05', 'EVEEVHVH'],
  ['PO Register', 'MH-06', 'EVEEVHVV'],
  ['PO Lines', 'MH-07', 'EVEEVHVV'],
  ['PO Print', 'MH-08', 'EEEEEHEE'],
  ['Advances', 'MH-09', 'EVEEHHEH'],
  ['Advance Print', 'MH-10', 'EEEEHHEH'],
  ['GRN', 'MH-11', 'EVEEEHVE'],
  ['GRN Print', 'MH-12', 'EEEEEHEE'],
  ['SRN', 'MH-13', 'EVEEHHVH'],
  ['SRN Print', 'MH-14', 'EEEEHHEH'],
  ['Bills', 'MH-15', 'EVEEHHEH'],
  ['Bill Lines', 'MH-15 lines', 'EVEEHHEH'],
  ['Payment Voucher', 'MH-16A', 'EEEEHHEH'],
  ['Payment Pack', 'MH-16', 'EEEHHHEH'],
  ['Consolidated PV', 'MH-16B', 'EEEHHHEH'],
  ['Issues', 'MH-17', 'EVEEEVVE'],
  ['Stores', 'MH-18', 'EVEEEHVE'],
  ['HK Norms', 'MH-19', 'EVEEHVVH'],
  ['Linen Par', 'MH-20', 'EVEEHEVH'],
  ['Laundry Log', 'MH-21', 'EVEEHEVH'],
  ['Job Cards', 'MH-22', 'EVEEVVHV'],
  ['PPM AMC', 'MH-23', 'EVEEHHHH'],
  ['Audit Log', 'Log', 'VVVHHHHH'],
  ['Notifications', 'Log', 'VVVHHHHH'],
  ['Number Log', 'Log', 'VHHHHHHH'],
  ['Users', 'Admin', 'EHEHHHHH'],
  ['Access', 'Admin', 'EHEHHHHH'],
];

function defaultAccess() {
  const a = {};
  MODULES.forEach(([m, , r]) => { a[m] = {}; DEFAULT_ROLES.forEach((role, i) => { a[m][role] = r[i]; }); });
  return a;
}

function seedRooms() {
  // 5 floors x 24 rooms: 18 four-bed + 6 three-bed rooms per floor = 450 beds. EXAMPLE layout - replace with the real room list.
  const rooms = [];
  for (let f = 1; f <= 5; f++) {
    for (let r = 1; r <= 24; r++) {
      const beds = r <= 18 ? 4 : 3;
      rooms.push({ no: String(f * 100 + r), floor: f, beds, std: beds + ' single beds', config: 'Standard', status: 'Ready', notes: '' });
    }
  }
  const set = (no, k, v) => { const x = rooms.find(r => r.no === no); if (x) x[k] = v; };
  set('104', 'status', 'Occupied'); set('212', 'status', 'Occupied');
  set('305', 'config', 'Accessible setup (elderly / wheelchair)'); set('305', 'status', 'Occupied');
  set('118', 'config', 'Extra bed added'); set('118', 'status', 'Occupied');
  return rooms;
}

function seedExamples() {
  const occ = Array.from({ length: 12 }, () => ({ plan: 0.8, actual: null }));
  occ[9].actual = 10450;
  return {
    meta: { app: 'KUN-MH', version: '1.0', created: new Date().toISOString(), examples: true },
    settings: {
      year: 2026, month: 10, capacity: 450, prefix: 'KBL/MH', stockOpenDate: '2026-10-01', fx: 1320,
      poFrom: 500000, qcpoAbove: 7500000, minQuotes: 3, masoolLimit: 5000000, masoolHoaLimit: 25000000,
      priceTol: 0.10, maxAdv: 0.30, budgetWarn: 0.90, hkTol: 0.10,
      jobHighDays: 1, jobNormalDays: 2, ppmWindow: 7, amcWarn: 30, advDays: 30,
      minPwd: 6, reportDate: '', locked: true, approvalHash: null, occupancy: occ,
    },

/* ---- core.js ---- */
/* Core: storage, utilities, numbering, audit log and the calculation engine
   (the same checks the control workbook performs). */

const LS_KEY = 'kunmh.data.v1';
let S = null;      // all data
let U = null;      // logged-in user
let C = null;      // calculated results (rebuilt on every change)

function loadData() {
  try { const t = localStorage.getItem(LS_KEY); S = t ? JSON.parse(t) : seedData(); }
  catch (e) { S = seedData(); }
  S.hkExplain = S.hkExplain || {};
  S.counts = S.counts || {}; S.linenCounts = S.linenCounts || {};
}
function saveData() {
  if (typeof SHARED !== 'undefined' && SHARED) return syncOut();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save in this browser: ' + e.message, 'bad'); }
}
function commit(action, details) {
  if (action) logAudit(action, details);
  saveData(); recalc();
  if (action) { notifyFor(action, details); saveData(); }
}

/* ---------- utilities ---------- */
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return isNaN(n) ? 0 : n; };
const numOrNull = v => (v === '' || v === null || v === undefined || isNaN(parseFloat(String(v).replace(/,/g, '')))) ? null : parseFloat(String(v).replace(/,/g, ''));
const fmt = (v, d = 0) => (v === null || v === undefined || v === '' || isNaN(v)) ? '' : Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtQ = v => (v === null || v === undefined || v === '') ? '' : Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 });
const pct = (v, d = 0) => (v === null || v === undefined || isNaN(v)) ? '' : (v * 100).toFixed(d) + '%';
const pad4 = n => String(n).padStart(4, '0');
const futureDate = d => !!d && d > isoDate(new Date());
const isoDate = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const isoDT = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 16); };
const nowDT = () => isoDT(new Date());

function fdt(s) { if (!s) return ''; return fdate(s) + (s.length > 10 ? ' ' + s.slice(11, 16) : ''); }

const toDate = s => s ? new Date(s.length > 10 ? s : s + 'T00:00') : null;

    c.qcheck = (c.docType === 'PO-cum-Quotation' && c.quotes < num(st.minQuotes)) ? `Only ${c.quotes} of ${st.minQuotes} quotations` : (l1 && l1.v !== p.vendor && !p.l1reason) ? 'Not L1 - reason needed' : 'OK';
    const tsum = num(p.adv) + num(p.del) + num(p.ret);
    c.terms = Math.abs(tsum - 1) > 0.0001 ? `Terms total ${pct(tsum)} (must be 100%)` : num(p.adv) > num(st.maxAdv) ? 'Advance above limit - Sigat' : 'OK';
    const sig = [c.approval];
    if (c.priceAppr && !c.approval.includes(c.priceAppr)) sig.push(c.priceAppr + ' (rate above MPL)');
    if (c.budget === 'OVER BUDGET') sig.push('Sigat (budget revision before issue)');
    if (num(p.adv) > num(st.maxAdv)) sig.push('Sigat (advance above limit)');
    c.signatures = sig;
    c.full = c.lines.length > 0 && c.lines.every(l => (c.recQty[l.item] || 0) >= l.qty - 1e-9);
    c.balance = v - c.received;
    c.status = p.cancel ? 'Cancelled' : p.closedOn ? (p.shortClosed ? 'Short-closed' : 'Closed') : !p.approvedBy ? 'Awaiting approval' :
      (c.full && c.received > 0 && c.billed >= c.received - 1) ? 'Ready to close' : c.full ? 'Received - awaiting bill' : c.received > 0 ? 'Part received' : 'Approved - open';
    const ex = [];
    if (!p.cancel && !p.closedOn) {
      if (c.budget === 'OVER BUDGET') ex.push('Over budget');
      if (c.above) ex.push(c.above + ' line(s) above MPL');
      if (c.notMpl) ex.push(c.notMpl + ' line(s) not on MPL');
      if (c.qcheck !== 'OK') ex.push(c.qcheck);
      if (c.terms !== 'OK') ex.push(c.terms);
      if (!p.budgetBy) ex.push('Budget check not recorded');
      if (!p.approvedBy) ex.push('Approval not recorded');
      if (c.lines.some(l => l.check !== 'OK')) ex.push('Line check');
      if (!c.lines.length) ex.push('No lines');
      if (!p.vendor || !p.line) ex.push('Vendor / budget line missing');
    }
    c.ex = ex;
  });

  // Advance balances per PO
  S.advances.forEach(a => {
    const pc = C.po[a.po], r = C.adv[a.no];
    r.balance = pc ? pc.advPaid - pc.advAdj : 0;
    r.days = a.paidDate ? daysBetween(a.paidDate, reportDate()) : null;
    r.status = KUNRules.advanceStatus(a.paidDate, r.balance, r.days, num(st.advDays));
  });

  // Job cards
  const tgt = { High: num(st.jobHighDays) * 24, Normal: num(st.jobNormalDays) * 24 };
  const now = nowMs();
  S.jobs.forEach(j => {
    const target = tgt[j.priority] || num(st.jobNormalDays) * 24;
    const start = toDate(j.reported).getTime();
    const end = j.completed ? toDate(j.completed).getTime() : now;
    const hours = (end - start) / 3600000;
    const status = j.completed && j.verifiedBy ? 'Closed' : j.completed ? 'Completed - verify' : hours > target ? 'OVERDUE' : j.started ? 'In progress' : 'Open';
    const f = [];
    if (j.completed && hours > target) f.push('Closed late');
    if (j.completed && j.doneBy === 'Contractor' && !j.srn) f.push('SRN missing (contractor)');
    if (!j.assigned) f.push('Not assigned');
    C.jobs[j.no] = { target, hours, status, left: target - hours, inTarget: j.completed ? hours <= target : null, check: f.length ? f.join('; ') : 'OK', mk: mkey(j.reported) };
  });

  // Issues and stock
  const recByItem = {}; // date-ordered GRN accepted
  C.grn.forEach(r => { if (!/No PO|not found|cancelled/.test(r.check)) (recByItem[r.l.item] = recByItem[r.l.item] || []).push({ d: r.g.date, q: num(r.l.acc) }); });
  const issued = {};
  S.issues.slice().sort((a, b) => (a.date + a.no).localeCompare(b.date + b.no)).forEach(s => {
    s.lines.forEach((l, i) => {
      const it = item(l.item), q = num(l.qty);
      const rec = (recByItem[l.item] || []).filter(x => x.d <= s.date).reduce((a, x) => a + x.q, 0);
      const before = (it ? num(it.opening) : 0) + rec - (issued[l.item] || 0);
      issued[l.item] = (issued[l.item] || 0) + q;
      const f = [];
      if (!it) f.push('Item not found');
      else if (!isStock(l.item)) f.push('Not a stock item');
      if (q > before + 1e-9) f.push('Exceeds stock');
      if (s.issuedTo === 'Maintenance - job card' && !s.job) f.push('Job card no. missing');
      if (s.job && !S.jobs.find(j => j.no === s.job)) f.push('Job card not found');
      if (!s.recvBy) f.push('Received by missing');
      const rate = lowRate(l.item);
      C.iss.push({ s, l, i, code: l.item, unit: it ? it.unit : '', type: itemType(l.item), line: itemLine(l.item), rate, val: q * rate, mk: mkey(s.date), before, check: f.length ? f.join('; ') : 'OK' });
    });
  });

  const mk = curMK();
  S.items.filter(i => isStock(i.code)).forEach(i => {
    const recs = recByItem[i.code] || [];
    const iss = C.iss.filter(r => r.code === i.code);
    const recBefore = recs.filter(x => mkey(x.d) < mk).reduce((a, x) => a + x.q, 0);
    const recIn = recs.filter(x => mkey(x.d) === mk).reduce((a, x) => a + x.q, 0);
    const issBefore = iss.filter(r => r.mk < mk).reduce((a, r) => a + num(r.l.qty), 0);
    const issIn = iss.filter(r => r.mk === mk).reduce((a, r) => a + num(r.l.qty), 0);
    const open = num(i.opening) + recBefore - issBefore, close = open + recIn - issIn;
    const cnt = S.counts[mk] && S.counts[mk][i.code] !== undefined && S.counts[mk][i.code] !== '' ? num(S.counts[mk][i.code]) : null;
    const diff = cnt === null ? null : cnt - close;
    const rate = lowRate(i.code);
    const status = close < 0 ? 'Negative stock' : (diff !== null && Math.abs(diff) > 1e-9) ? 'Count difference - post adjustment' : (i.reorder !== null && close <= num(i.reorder)) ? 'Re-order - raise PO' : 'OK';
    C.stock[i.code] = { opening: num(i.opening), recBefore, issBefore, open, recIn, issIn, close, cnt, diff, rate, value: close * rate, status };
  });

  // Laundry log cumulative
  const cum = {};
  S.laundry.slice().sort((a, b) => (a.date + a.slip).localeCompare(b.date + b.slip)).forEach(r => {
    const c = cum[r.item] = cum[r.item] || { sent: 0, back: 0 };
    c.sent += num(r.sent); c.back += num(r.clean) + num(r.rewash) + num(r.lost);
    C.laundry[r.id] = { cumSent: c.sent, cumBack: c.back, pending: c.sent - c.back, mk: mkey(r.date), check: c.back > c.sent ? 'Returned more than sent' : 'OK' };
  });

  // PPM and AMC
  const iv = { Weekly: 7, Monthly: 30, Quarterly: 91, 'Half-yearly': 182, Yearly: 365 };
  const today = reportDate();
  S.ppm.forEach(p => {
    const interval = iv[p.freq] || 30;
    const next = p.last ? addDays(p.last, interval) : '';
    const dd = next ? daysBetween(today, next) : null;
    const ppm = !p.last ? 'Not started' : dd < 0 ? 'OVERDUE' : dd <= num(st.ppmWindow) ? 'Due soon' : 'OK';
    const ad = p.amcExpiry ? daysBetween(today, p.amcExpiry) : null;
    const amc = !p.amcExpiry ? '-' : ad < 0 ? 'AMC EXPIRED' : ad <= num(st.amcWarn) ? 'Renew - raise PO' : 'OK';
    C.ppm[p.id] = { interval, next, dd, ppm, ad, amc };
  });

  // Numbers issued but missing from their register
  S.numlog.forEach(n => { const reg = NUM_REG[n.type]; if (reg && !S[reg].some(r => r.no === n.no)) C.missing.push(n); });
}

/* Monthly housekeeping, linen and dashboard figures for the selected month */
function hkNorms() {
  const m = S.settings.month, mk = curMK(), zd = zdUsed(m), tol = num(S.settings.hkTol);
  return S.items.filter(i => num(i.norm) > 0).map(i => {
    const atNorm = num(i.norm) * zd / 100;
    const issued = C.iss.filter(r => r.code === i.code && r.mk === mk && /^HK/.test(r.s.issuedTo)).reduce((a, r) => a + num(r.l.qty), 0);
    const v = issued - atNorm, vp = atNorm ? v / atNorm : null;
    const rate = lowRate(i.code);
    const flag = atNorm === 0 ? '-' : vp > tol ? 'OVER NORM - Masool to explain' : vp < -tol ? 'UNDER NORM - check room standards' : 'OK';
    return { i, zd, atNorm, issued, v, vp, flag, rate, costNorm: atNorm * rate, cost: issued * rate };
  });
}
function linenPar() {
  const mk = curMK(), beds = num(S.settings.capacity);
  return S.items.filter(i => num(i.par) > 0).map(i => {
    const par = num(i.par) * beds;
    const store = C.stock[i.code] ? C.stock[i.code].close : num(i.opening);
    const lc = S.linenCounts[mk] || {};
    const circ = lc[i.code] !== undefined && lc[i.code] !== '' ? num(lc[i.code]) : null;
    const logs = S.laundry.filter(r => r.item === i.code);
    const upto = logs.filter(r => mkey(r.date) <= mk);
    const pending = upto.reduce((a, r) => a + num(r.sent) - num(r.clean) - num(r.rewash) - num(r.lost), 0);
    const inM = logs.filter(r => mkey(r.date) === mk);
    const s = k => inM.reduce((a, r) => a + num(r[k]), 0);
    const held = store + (circ || 0) + pending;
    const short = par - held;
    const status = circ === null ? 'Count missing' : short > 0 ? 'Short of par - replacement PO' : 'OK';
    return { i, par, beds, store, circ, pending, held, short, status, sent: s('sent'), clean: s('clean'), rewash: s('rewash'), lost: s('lost') };
  });
}

function budgetTable() {
  const m = S.settings.month, mk = curMK(), y = String(S.settings.year);
  return S.budgetLines.map(b => {
    const pos = S.pos.filter(p => p.line === b.code && (p.date || '').startsWith(y));
    const noPo = S.bills.filter(x => !x.po && x.line === b.code && (x.date || '').startsWith(y));
    const mb = monthBudget(b.code, m), yb = ytdBudget(b.code, m);
    const mCommit = pos.filter(p => mkey(p.date) === mk).reduce((a, p) => a + C.po[p.no].effective, 0) + noPo.filter(x => mkey(x.date) === mk).reduce((a, x) => a + num(x.amount), 0);
    const mRec = C.grn.filter(r => r.line === b.code && r.mk === mk && r.check.indexOf('No PO') < 0).reduce((a, r) => a + r.val, 0) + C.srn.filter(r => r.line === b.code && r.mk === mk).reduce((a, r) => a + r.val, 0);
    const billsOf = S.bills.filter(x => C.bill[x.no].line === b.code && (x.date || '').startsWith(y));
    const mBills = billsOf.filter(x => mkey(x.date) === mk).reduce((a, x) => a + num(x.amount), 0);
    const yCommit = pos.filter(p => mkey(p.date) <= mk).reduce((a, p) => a + C.po[p.no].effective, 0) + noPo.filter(x => mkey(x.date) <= mk).reduce((a, x) => a + num(x.amount), 0);
    const yBills = billsOf.filter(x => mkey(x.date) <= mk).reduce((a, x) => a + num(x.amount), 0);
    const allCommit = pos.reduce((a, p) => a + C.po[p.no].effective, 0) + noPo.reduce((a, x) => a + num(x.amount), 0);
    return { b, mb, mCommit, mRec, mBills, mVs: mb ? mBills / mb : null, yb, yCommit, yBills, annual: num(b.annual), bal: num(b.annual) - allCommit, yPct: yb ? yCommit / yb : null };
  });
}

function exceptions() {
  const mk = curMK();
  const openPO = S.pos.filter(p => !p.cancel && !p.closedOn);
  const hk = hkNorms(), ln = linenPar();
  const mplExpired = mplRows().filter(r => r.to && r.to < reportDate()).length;
  const L = [
    ['Item rates waiting for approval, or rates expired', pendingRates().length + mplExpired, 'Items & MPL - Head of Accounts to approve the rates', 'mpl'],
    ['POs over budget (need budget revision before issue)', openPO.filter(p => C.po[p.no].budget === 'OVER BUDGET').length, 'PO Register - Internal Auditor / Sigat', 'po'],
    ['PO lines above MPL rate tolerance', openPO.reduce((a, p) => a + C.po[p.no].above, 0), 'PO lines - HoA / Sigat approval', 'po'],
    ['PO lines for items not on MPL', openPO.reduce((a, p) => a + C.po[p.no].notMpl, 0), 'PO lines - add rate to MPL', 'po'],
    ['PO-cum-Quotation without enough quotes / not L1 without reason', openPO.filter(p => C.po[p.no].qcheck !== 'OK').length, 'PO Register - Masool', 'po'],
    ['Payment terms not 100% or advance above limit', openPO.filter(p => C.po[p.no].terms !== 'OK').length, 'PO Register - Masool', 'po'],
    ['POs without approval or budget check recorded', openPO.filter(p => !p.approvedBy || !p.budgetBy).length, 'PO Register - Internal Auditor / Masool', 'po'],
    ['PO numbers issued but missing from the register', C.missing.filter(n => n.type === 'PO').length, 'Number Log - Head of Accounts to investigate', 'numlog'],
    ['Advance / bill / GRN / SRN / issue / job numbers issued but missing', C.missing.filter(n => n.type !== 'PO').length, 'Number Log vs registers', 'numlog'],
    ['POs ready to close (fully received and billed)', openPO.filter(p => C.po[p.no].status === 'Ready to close').length, 'PO Register - Masool clicks Close PO', 'po'],
    ['Advances exceeding PO terms, without PO or approval', S.advances.filter(a => C.adv[a.no].check !== 'OK').length, 'Advances - Accounts', 'adv'],
    ['Advances not adjusted within time limit', S.advances.filter(a => C.adv[a.no].status === 'Not adjusted - follow up').length, 'Advances - Accounts / Masool', 'adv'],
    ['GRN lines not OK (no PO, excess, not on PO, rejected)', C.grn.filter(r => r.check !== 'OK').length, 'GRN - GRN Officer', 'grn'],
    ['SRN lines not OK (no PO, excess, PO closed, signatures missing)', C.srn.filter(r => r.check !== 'OK').length, 'SRN - Masool', 'srn'],
    ['Bills failing 3-way match', S.bills.filter(b => C.bill[b.no].match !== 'OK').length, 'Bills - Internal Auditor', 'bills'],
    // Phase 4 (F4/U2): same status rule as the Bills register (C.bill[].pay), so the two cannot disagree
    ['Bills on hold / query', S.bills.filter(b => /On hold|Query/.test(C.bill[b.no].pay)).length, 'Bills - Masool to resolve', 'bills'],
    ['Issue slips not OK (exceeds stock, no job card)', C.iss.filter(r => r.check !== 'OK').length, 'Issues', 'issues'],
    ['Stock items at or below re-order level', Object.values(C.stock).filter(s => /Re-order/.test(s.status)).length, 'Stores - raise PO', 'stores'],
    ['Negative stock / count differences', Object.values(C.stock).filter(s => /Negative|Count difference/.test(s.status)).length, 'Stores - post adjustment with approval', 'stores'],
    ['Housekeeping items over norm', hk.filter(r => /^OVER/.test(r.flag)).length, 'HK Norms - Masool to explain', 'hknorms'],
    ['Linen items short of par / count missing', ln.filter(r => r.status !== 'OK').length, 'Linen Par', 'linen'],
    ['Pieces lost by laundry (month)', ln.reduce((a, r) => a + r.lost, 0), 'Deduct from laundry bill', 'laundry'],
    ['Job cards overdue / completed but not verified', S.jobs.filter(j => /OVERDUE|verify/.test(C.jobs[j.no].status)).length, 'Job Cards / Service desk', 'desk'],
    ['PPM overdue', S.ppm.filter(p => C.ppm[p.id].ppm === 'OVERDUE').length, 'PPM AMC', 'ppm'],
    ['AMC expired or expiring', S.ppm.filter(p => /EXPIRED|Renew/.test(C.ppm[p.id].amc)).length, 'PPM AMC - raise renewal PO', 'ppm'],
    ['Rooms out of order', S.rooms.filter(r => r.status === 'Out of order').length, 'Service desk - rooms', 'desk'],
  ];
  return L.map(([t, n, w, v], i) => ({ i: i + 1, t, n, w, v }));
}

</script>
<script>
/* ---- ui.js ---- */
/* UI framework: shell, navigation, tables, forms, modals, printing, log-in */

const $ = s => document.querySelector(s);
const ACT = {};          // click actions: data-act="name" data-id="..."
const App = {};          // handlers used from inline onchange / oninput
let VIEW = null;
// Where the app runs: 'server' (the local server with PostgreSQL, see server/README.md) - the only supported mode.
// 'none' means the page was opened without the server, so the app does not start.
const HOST = window.KUN_HOST || 'none';
const SHARED = HOST === 'server';
let loginFails = 0, loginLockUntil = 0;

function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + (kind || '');
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = ''; }, 3200);
}
const flag = t => t ? `<span class="flag ${sev(t)}">${esc(t)}</span>` : '';
const flags = t => (!t || t === 'OK') ? flag(t) : t.split('; ').map(flag).join(' ');
function opts(list, val, blank = true) {
  return (blank ? '<option value=""></option>' : '') + list.map(o => {
    const [v, l] = Array.isArray(o) ? o : [o, o];
    return `<option value="${esc(v)}"${String(v) === String(val ?? '') ? ' selected' : ''}>${esc(l)}</option>`;
  }).join('');
}
const itemOpts = filter => S.items.filter(filter || (() => true)).map(i => [i.code, i.code + ' - ' + i.name]);
const vendorOpts = () => S.vendors.map(v => v.name);
const vendorPairs = () => S.vendors.map(v => [v.name, v.name + (v.avl === 'Y' ? '' : ' (not AVL - approve on Vendors first)')]);
const lineOpts = () => S.budgetLines.map(b => [b.code, b.code + ' - ' + b.name]);
const monthOpts = () => MON.map((m, i) => [i + 1, m + ' ' + S.settings.year]);

/* ---------- views registry and navigation ---------- */
const VIEWS = {};
const GROUPS = ['Overview', 'Purchasing', 'Receiving', 'Bills & payment', 'Stores', 'Housekeeping', 'Maintenance', 'Masters', 'Admin'];
function view(id, title, module, group, fmtNo, render) { VIEWS[id] = { id, title, module, group, fmtNo, render }; }

// Navigation is kept in page state (the artifact viewer passes only a plain #token from the link, used for the first view).
function go(id) { closeModal(); route(id); }
// Page history for the Back button and the Escape key.
let HIST = [], NAV_BACK = false;
function route(want) {
  if (!U) return SHARED ? renderGate() : renderLogin();
  let id = want || VIEW || (location.hash.match(/^#\/?(\w+)$/) || [])[1];
  if (!id || !VIEWS[id] || !canSee(VIEWS[id].module)) id = homeView();
  if (VIEW && id !== VIEW && !NAV_BACK) { HIST.push(VIEW); if (HIST.length > 50) HIST.shift(); }
  NAV_BACK = false;
  VIEW = id; render();
}
ACT.back = () => {
  closeModal();
  const prev = HIST.pop();
  if (!prev) return;
  NAV_BACK = true; route(prev);
};
// The exception lines that need action, with the page each one opens.
ACT.exceptionList = () => {
  const lines = exceptions().filter(e => e.n > 0);
  if (!lines.length) return toast('No exception needs action.', 'ok');
  modal('Exception lines to act on (' + lines.length + ')',
    '<p class="muted">Each line should be zero. Open the page, act or record the reason.</p>' +
    '<table class="ex">' + lines.map(e => '<tr><td class="n">' + e.i + '</td><td>' + esc(e.t) + '<small>' + esc(e.w) + '</small></td><td class="n"><span class="flag bad">' + e.n + '</span></td><td><button class="btn ghost sm" data-act="goto" data-id="' + e.v + '">Open</button></td></tr>').join('') + '</table>',
    [{ l: 'Close', cls: '', fn: () => closeModal() }], { wide: true });
};
function homeView() { return ['dashboard', 'desk', 'po', 'grn', 'bills', 'issues', 'laundry', 'guide'].find(v => VIEWS[v] && canSee(VIEWS[v].module)) || 'guide'; }

// Keyboard focus survives a redraw: remember the menu item (or element with an id) that had focus and put it back.
function focusMark() {
  const el = document.activeElement; if (!el || !el.closest) return null;
  const nav = el.closest('#nav a[data-id]'); if (nav) return { nav: nav.dataset.id };
  return el.id && el.closest('#app') ? { id: el.id } : null;
}
function focusRestore(m) {
  if (!m || document.querySelector('[data-autofocus]')) return;
  const el = m.nav ? document.querySelector('#nav a[data-id="' + m.nav + '"]') : document.getElementById(m.id);
  if (el) el.focus({ preventScroll: true });
}
function render() {
  const v = VIEWS[VIEW];
  const mark = focusMark();
  $('#app').innerHTML = shell();
  const main = $('#main');
  try { main.innerHTML = `<div class="vhead"><div>${HIST.length ? '<button class="btn ghost sm" data-act="back" title="Back to the previous page (Esc)">&larr; Back</button> ' : ''}<span class="fmt">${esc(v.fmtNo)}</span><h1>${esc(v.title)}</h1></div><div class="vtools" id="vtools"></div></div>` + v.render(); }
  catch (e) { console.error(e); main.innerHTML = `<div class="card bad">Something went wrong showing this page: ${esc(e.message)}</div>`; }
  document.querySelectorAll('[data-autofocus]').forEach(x => x.focus());
  focusRestore(mark);
  window.scrollTo(0, 0);
}
function shell() {
  const nav = GROUPS.map(g => {
    const items = Object.values(VIEWS).filter(v => v.group === g && canSee(v.module));
    if (!items.length) return '';
    return `<div class="ng">${esc(g)}</div>` + items.map(v => `<a href="#${v.id}" data-act="goto" data-id="${v.id}" class="${v.id === VIEW ? 'on' : ''}"><span>${esc(v.title)}</span><small>${esc(v.fmtNo)}</small></a>`).join('');
  }).join('');
  const ex = S.meta.examples ? `<span class="exb" title="Example data (October 2026) is loaded. Clear it at go-live from Admin > Data.">Example data</span>` : '';
  return `<header class="top">
    <button class="menu" data-act="toggleNav" aria-label="Menu">&#9776;</button>
    <div class="brand"><b>KUN Karbala</b><span>Maintenance &amp; Housekeeping</span></div>${ex}
    <div class="sp"></div>
    ${SHARED ? `<span class="sync" id="syncState" title="Changes are saved to the shared database for all users">${esc(syncLabel())}</span>` : ''}
    <button class="btn ghost sm" data-act="myAccount">My account</button>
    <span class="who"><b>${esc(U.name)}</b><small>${esc(U.role)}</small></span>
    ${HOST === 'server' ? '<button class="btn ghost sm" data-act="serverLogout">Log out</button>' : `<button class="btn ghost sm" data-act="changePw">Password</button>
    <button class="btn ghost sm" data-act="logout">Log out</button>`}
  </header>
  <div class="body"><nav id="nav">${nav}</nav><main id="main"></main></div>`;
}
ACT.toggleNav = () => $('#nav').classList.toggle('open');

/* ---------- tables ---------- */
// cols: [{h, v:(row)=>html, x:(row)=>export value, n:true numeric, w}]
const TABLES = {};
// Phase 5 (gap U3): what a page with no rows yet should tell the user to do first.
const EMPTY_HINT = {
  srn: 'No service receipts yet. Prepare one after the service is done, against an approved PO.',
  adv: 'No advances yet. An advance can be requested only from a PO whose terms allow one.',
  cpv: 'No cash vouchers yet. Cleared bills of up to the cash-PV limit can be grouped here on one voucher.',
  iss: 'No issue slips yet. Stock is issued to a job card or a department, and needs a counted stock balance.',

// field: {k, l, t: text|num|pct|date|dt|sel|area|chk|ro, o: options, full, ed: editable?, hint, list}
function field(f, obj) {
  const v = f.val !== undefined ? f.val : obj[f.k];
  const dis = f.ed === false ? ' disabled' : '';
  const id = 'f_' + f.k;
  let inp;
  switch (f.t) {
    case 'sel': inp = `<select id="${id}" data-k="${f.k}"${dis}>${opts(typeof f.o === 'function' ? f.o() : f.o, v, f.blank !== false)}</select>`; break;
    case 'area': inp = `<textarea id="${id}" data-k="${f.k}" rows="${f.rows || 2}"${dis}>${esc(v)}</textarea>`; break;
    case 'chk': inp = `<label class="chk"><input type="checkbox" id="${id}" data-k="${f.k}" data-t="chk"${v ? ' checked' : ''}${dis}> ${esc(f.cl || '')}</label>`; break;
    case 'pct': inp = `<input id="${id}" data-k="${f.k}" data-t="pct" inputmode="decimal" value="${v === null || v === undefined || v === '' ? '' : +(num(v) * 100).toFixed(4)}"${dis}><span class="unit">%</span>`; break;
    case 'num': inp = `<input id="${id}" data-k="${f.k}" data-t="num" inputmode="decimal" value="${v === null || v === undefined ? '' : esc(v)}"${dis}>`; break;
    case 'date': inp = `<input type="date" id="${id}" data-k="${f.k}" value="${esc((v || '').slice(0, 10))}"${f.max === 'today' ? ` max="${isoDate(new Date())}"` : ''}${dis}>`; break;
    case 'dt': inp = `<input type="datetime-local" id="${id}" data-k="${f.k}" value="${esc((v || '').slice(0, 16))}"${dis}>`; break;
    case 'ro': inp = `<div class="ro">${f.html !== undefined ? f.html : esc(v)}</div>`; break;
    default: inp = `<input id="${id}" data-k="${f.k}" value="${esc(v)}"${f.list ? ` list="dl_${f.k}"` : ''}${dis}>` + (f.list ? `<datalist id="dl_${f.k}">${f.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : '');
  }
  return `<div class="fld ${f.full ? 'full' : ''} ${f.t === 'pct' ? 'haspct' : ''}"><label for="${id}">${esc(f.l)}${f.req ? ' <i>*</i>' : ''}</label>${inp}${f.hint ? `<small>${f.hint}</small>` : ''}</div>`;
}

function readInto(root, obj) {

function slaText(j) {
  const c = C.jobs[j.no];
  if (j.completed) return c.inTarget ? 'Done in ' + hrs(c.hours) : 'Done late (' + hrs(c.hours) + ')';
  return c.left >= 0 ? hrs(c.left) + ' left' : 'Overdue by ' + hrs(-c.left);
}
const hrs = h => h < 1 ? Math.max(1, Math.round(h * 60)) + ' min' : h < 48 ? Math.floor(h) + ' h ' + String(Math.round((h % 1) * 60)).padStart(2, '0') + ' m' : Math.round(h / 24) + ' days';
const PRI = { High: 1, Normal: 2 };

  const notStarted = open.filter(j => !j.started && !j.completed), inProg = open.filter(j => j.started && !j.completed), toVerify = open.filter(j => j.completed);
  const today = isoDate(new Date(nowMs()));
  const doneToday = S.jobs.filter(j => j.completed && j.completed.startsWith(today));
  const mDone = S.jobs.filter(j => j.completed && mkey(j.completed) === curMK());
  setTimeout(() => { const t = $('#vtools'); if (t) t.innerHTML = (ed ? `<button class="btn pri" data-act="newJob">+ New request</button>` : '') + `<button class="btn ghost" data-act="goto" data-id="jobs">Job card register</button>`; });
  const floors = [...new Set(S.rooms.map(r => r.floor))];
  return `<div class="tiles">
    ${tile('Open requests', open.length, open.filter(j => j.type === 'Room configuration').length + ' room configuration')}

    ${tile('High priority open', open.filter(j => j.priority === 'High' && !j.completed).length, 'target ' + S.settings.jobHighDays + ' day(s)', '')}
    ${tile('Completed today', doneToday.length, toVerify.length + ' waiting for verification')}
    ${tile('Within target (month)', mDone.length ? pct(mDone.filter(j => C.jobs[j.no].inTarget).length / mDone.length) : '-', 'KPI above 90%')}
    ${tile('Rooms out of order', S.rooms.filter(r => r.status === 'Out of order').length, S.rooms.filter(r => r.status === 'Being configured').length + ' being configured')}

  <section class="card"><h3>Rooms <small class="muted">${S.rooms.length} rooms, ${S.rooms.reduce((a, r) => a + num(r.beds), 0)} beds. Click a room for its details, configuration and requests.</small></h3>
  <div class="legend"><span class="rs Ready">Ready</span><span class="rs Occupied">Occupied</span><span class="rs Being">Being configured</span><span class="rs Out">Out of order</span><span><i class="dot"></i> open request</span><span><i class="cfg">C</i> non-standard configuration</span></div>
  ${floors.map(f => `<div class="floor"><b>Floor ${f}</b><div class="rooms">${S.rooms.filter(r => r.floor === f).map(r => {
    const oj = open.filter(j => j.room === r.no);
    return `<button class="room rs ${r.status.split(' ')[0]}" data-act="room" data-id="${esc(r.no)}" title="${esc(r.no + ' - ' + r.status + ' - ' + r.config)}">${esc(r.no)}${oj.length ? '<i class="dot"></i>' : ''}${r.config !== 'Standard' ? '<i class="cfg">C</i>' : ''}</button>`;

function jobCard(j) {

ACT.newJob = (room) => {
  if (!canAct('job.create')) return toast('You cannot create job cards.', 'bad');
  const j = { type: 'Repair', priority: 'High', room: room || '', location: room ? 'Room ' + room : '', trade: '', config: '', problem: '', reportedBy: 'Front office', reported: nowDT(), assigned: '', outOfOrder: false, guestImpact: false };
  modal('New request (job card MH-22)', `<p class="muted">A job card number is issued when you save. Repairs follow the target time of their priority; room configuration requests change the room's configuration when completed.</p>` + fields(jobFields(j, true), j),
    [{ l: 'Save and issue job card number', cls: 'pri', fn: async b => {
      readInto(b, j);
      if (!j.problem) return toast('Describe the problem or request.', 'bad');
      if (j.type === 'Room configuration' && !j.config) return toast('Choose the configuration needed.', 'bad');
      if (j.type !== 'Room configuration' && !j.trade) j.trade = j.type === 'Guest request' ? 'Housekeeping' : 'Other';
      if (j.room && !j.location) j.location = 'Room ' + j.room;
      if (!j.room && !j.location) return toast('Give the room or the location.', 'bad');
      const no = await allocNumber('JOB'); if (!no) return;
      const rec = Object.assign({ no, started: '', completed: '', issueRefs: '', doneBy: '', srn: '', verifiedBy: '', remarks: '' }, j);
      S.jobs.push(rec);
      const r = S.rooms.find(x => x.no === rec.room);
      if (r) { if (rec.outOfOrder) { r.prevStatus = r.prevStatus || r.status; r.status = 'Out of order'; } else if (rec.type === 'Room configuration') { r.prevStatus = r.prevStatus || r.status; r.status = 'Being configured'; } }
      closeModal(); commit('Job card opened', rec.no + ' ' + rec.location); render(); toast('Job card ' + rec.no + ' issued.', 'ok');

  <li><b><span style="cursor:pointer;text-decoration:underline" data-act="goto" data-id="po">Budget check</span></b> by the Internal Auditor before the PO is issued. Over budget: Sigat approves a revision first.</li>

function resolveItemText(text, p, create) {
  const t = String(text || '').trim().replace(/\s+/g, ' ');
  if (!t) return '';
  const byCode = t.split(' - ')[0].trim();
  const hit = S.items.find(i => lc(i.code) === lc(byCode)) || S.items.find(i => nameKey(i.name) === nameKey(t) || nameKey(i.name) === nameKey(byCode));
  if (hit) return hit.code;
  if (!create) return '';
  const c = S.categories.find(x => x.line === p.line && x.type === 'Stock item') || S.categories.find(x => x.line === p.line);
  if (!c) throw new Error('No item category for budget line ' + p.line + '. Add a category for it in Items first.');
  let code;
  do { code = 'NI-' + Math.random().toString(36).slice(2, 8).toUpperCase(); } while (S.items.some(i => i.code === code));

// Advance adjustable on a bill: PO advance % x bill amount, capped at the PAID advance vouchers on this PO not yet adjusted by other bills.

  return Math.max(0, (pc.recQty[item] || 0) - billedOther);

    ['Bill / invoice no. & date', esc(b.invNo) + ' ' + fdate(b.invDate), 'PO no.', esc(b.po || 'No PO (below ' + fmt(S.settings.poFrom) + ' IQD)')], ['Description / purpose', esc(b.desc), 'Payment mode', esc(b.po ? (findPO(b.po) || {}).mode : b.mode)],
    ['GRN / SRN attached', esc(b.refs || 'None attached - tick the GRN or SRN on the bill'), 'Accounts PV no.', esc(b.pv)]])
    + '<h4>Amount (IQD)</h4>' + kv([['Bill amount', fmt(b.amount), 'PO value', fmt(r.poValue)], ['Less: advance adjusted', fmt(b.advAdj), 'Received (GRN + SRN)', fmt(r.received)], ['Less: retention', fmt(r.retention), 'Billed to date on PO', fmt(r.billedToDate)],
      ['Less: other deductions', fmt(b.otherDed), 'System check', esc(r.match)], ['NET PAYABLE', `<b>${fmt(r.net)}</b><br><small>${esc(amountWords(r.net))}</small>`, 'Status', esc(r.pay)]])
    + `<h4>Documents attached (tick)</h4><table class="lt"><thead><tr><th>#</th><th>Document</th><th>Needed?</th><th>Tick</th></tr></thead><tbody>${['Original bill / invoice, signed by the Masool as goods or service received', 'PO / PO-cum-Quotation, with the quotations', 'GRN (goods) or SRN (labour / services)', 'Advance voucher, where an advance is adjusted', 'Quotation or market rate note, for purchases without a PO'].map((d, i) => `<tr><td>${i + 1}</td><td>${d}</td><td>${need[i] ? 'Yes' : '-'}</td><td>&#9744;</td></tr>`).join('')}</tbody></table>`
    + sigs(['Prepared - Maintenance Masool', 'Checked - Internal Auditor', 'Released - Head of Accounts', 'Received by (payee)']) + '<h4>For Accounts</h4>' + kv([['Paid on', fdate(b.payDate), 'Payment reference', esc(b.payRef)]])
    + `<p class="small">Purchases of ${fmt(S.settings.poFrom)} IQD or more need an approved PO; a voucher whose system check reads "No PO for bill above PO limit" is not paid. Never split one requirement into several bills.</p>`);
}

/* ===== MH-16 Pre-payment audit & payment pack ===== */
view('audit', 'Pre-payment audit & payments', 'Payment Pack', 'Bills & payment', 'MH-16', () => {
  const groups = [['Awaiting audit', 'Awaiting audit'], ['On hold / query', /hold|Query/i], ['Cleared - awaiting payment', 'Cleared - awaiting payment'], ['Paid', 'Paid']];
  return `<p class="muted">The Internal Auditor completes the checklist on every bill and marks it Clear, Hold or Query. Accounts pays only Clear bills (weekly payment run) and records the PV number, date and reference.</p>` + groups.map(([t, m]) => {
    const list = S.bills.filter(b => m instanceof RegExp ? m.test(C.bill[b.no].pay) : C.bill[b.no].pay === m).reverse();
    return `<section class="card"><h3>${t} <span class="muted">${list.length} &middot; ${fmt(list.reduce((a, b) => a + C.bill[b.no].net, 0))} IQD net</span></h3>` + table('aud' + t.replace(/\W/g, ''), [
      { h: 'Bill entry no.', v: b => `<b>${esc(b.no)}</b>` }, { h: 'Submitted', v: b => fdate(b.date) }, { h: 'Vendor', v: b => esc(C.bill[b.no].vendor) }, { h: 'PO', v: b => esc(poShort(b.po) || 'No PO') },
      { h: 'Invoice', n: 1, v: b => fmt(b.amount) }, { h: 'Net payable', n: 1, v: b => fmt(C.bill[b.no].net) }, { h: '3-way match', v: b => flags(C.bill[b.no].match) },
      { h: 'Auditor remarks', v: b => esc(b.auditRemarks) }, { h: 'Paid', v: b => fdate(b.payDate) + ' ' + esc(b.payRef) },
    ], list, { click: 'auditBill', key: b => b.no, name: 'Audit ' + t, noTools: list.length < 8 }) + '</section>';
  }).join('');
});
function auditChecks(b) {
  const r = C.bill[b.no], p = b.po ? findPO(b.po) : null, c = p ? C.po[p.no] : null, m = r.match;
  const has = s => m.includes(s);
  return [
    ['Original invoice attached; vendor name, invoice no., date and amount agree with this voucher', has('Duplicate') || has('Invoice no. missing') ? 'Check invoice no.' : 'Manual'],
    ['PO / PO-cum-Quotation attached and approved as per authority matrix', !p ? (num(b.amount) >= num(S.settings.poFrom) ? 'No PO for bill above PO limit' : 'Below PO limit - no PO needed') : p.approvedBy ? 'OK - ' + p.approvedBy : 'Approval not recorded'],
    ['Quotations attached (PO-cum-Quotation) and L1 selected or reason recorded', c ? c.qcheck : '-'],
    ['Rates as per approved MPL, or deviation approved', c ? (c.above ? c.above + ' line(s) above MPL - approval: ' + c.priceAppr : 'OK') : '-'],
    ['GRN / SRN attached, signed; billed does not exceed received', !p ? '-' : has('GRN / SRN not attached') ? 'GRN / SRN not attached' : has('more than received') ? 'Billed more than received' : 'OK'],
    ['Billed to date does not exceed PO value', !p ? '-' : has('more than PO value') ? 'Billed more than PO value' : 'OK'],
    ['Advance adjusted correctly; retention deducted as per PO', !p ? '-' : has('Advance') ? m.split('; ').filter(x => /Advance/.test(x)).join('; ') : 'OK'],
    ['Not a duplicate invoice; invoice not dated before the PO', has('Duplicate') ? 'Duplicate invoice no.' : has('before PO') ? 'Invoice dated before PO' : 'OK'],
    ['Budget available on the budget line (PO budget check)', c ? c.budget : '-'],
    ['Arithmetic, taxes and vendor bank details checked against AVL', 'Manual' + ((vendor(r.vendor) || {}).bank ? '' : ' - bank details not on AVL')],
  ];
}
ACT.auditBill = no => {
  const b = S.bills.find(x => x.no === no), r = C.bill[no];
  const edI = canEdit('Payment Pack') && may('Internal Auditor') && !b.payDate;
  const edA = (canEdit('Bills') || canEdit('Payment Pack')) && may('Accounts') && b.audit === 'Clear';
  const ch = auditChecks(b);
  b.checks = b.checks || {};
  modal('Pre-payment audit - ' + no, kv([['Vendor', esc(r.vendor), 'Budget line', esc(r.line)], ['Invoice no. / date', esc(b.invNo) + ' ' + fdate(b.invDate), 'PO no.', esc(b.po || 'No PO')], ['GRN / SRN attached', esc(b.refs || 'None attached - tick the GRN or SRN on the bill'), 'PV no.', esc(b.pv)]])
    + '<h4>Payment computation (IQD)</h4>' + kv([['Invoice amount', fmt(b.amount), 'PO value', fmt(r.poValue)], ['Less: advance adjusted', fmt(b.advAdj), 'Received (GRN + SRN)', fmt(r.received)], ['Less: retention', fmt(r.retention), 'Billed to date on PO', fmt(r.billedToDate)], ['Less: other deductions', fmt(b.otherDed), 'Advance balance before bill', fmt(r.advBalBefore)], ['NET PAYABLE', '<b>' + fmt(r.net) + '</b>', 'Payment status', flag(r.pay)]])
    + `<h4>Checklist</h4>` + (edI ? `<p><button class="btn" type="button" onclick="App.tickAll(true)">Tick all</button> <button class="btn" type="button" onclick="App.tickAll(false)">Untick all</button></p>` : '') + `<table class="lt"><thead><tr><th>#</th><th>Check</th><th>System result</th><th>Auditor tick</th></tr></thead><tbody>${ch.map(([t, s], i) => `<tr><td>${i + 1}</td><td>${esc(t)}</td><td>${s === 'Manual' || s === '-' ? esc(s) : flags(s)}</td><td><input type="checkbox" class="atk" data-i="${i}" ${b.checks[i] ? 'checked' : ''} ${edI ? '' : 'disabled'}></td></tr>`).join('')}</tbody></table>`
    + fields([{ k: 'audit', l: 'Audit status (Internal Auditor)', t: 'sel', o: ['Clear', 'Hold', 'Query'], ed: edI }, { k: 'auditDate', l: 'Audit date', t: 'date', ed: edI }, { k: 'auditRemarks', l: 'Auditor remarks', t: 'area', full: true, ed: edI }, { k: 'varBy', l: 'Variance approved by (Sigat / Head of Accounts)', t: 'text', ed: edI }, { k: 'varDate', l: 'Variance approval date', t: 'date', ed: edI }, { k: 'varRemarks', l: 'Variance remarks', t: 'area', full: true, ed: edI },
      { k: 'pv', l: 'PV no. (Accounts)', t: 'text', ed: edA }, { k: 'payDate', l: 'Payment date (Accounts)', t: 'date', max: 'today', ed: edA }, { k: 'payRef', l: 'Payment reference (Accounts)', t: 'text', ed: edA, hint: 'Cash payment: the voucher or receipt reference' }], b),
    [(edI || edA) && { l: 'Save', cls: 'pri', fn: body => {
      const o = Object.assign({}, b); readInto(body, o); o.mode = 'Cash';
      if (edI) { o.checks = {}; body.querySelectorAll('.atk').forEach(x => { o.checks[x.dataset.i] = x.checked; }); }
      if (edI && o.audit === 'Clear' && r.match !== 'OK') return toast('3-way match is not OK (' + r.match + '). Mark Hold or Query with remarks.', 'bad');
      if (edI && o.audit === 'Clear' && Object.values(o.checks).filter(Boolean).length < ch.length) return toast('Tick every checklist line before marking Clear.', 'bad');
      if (edI && o.audit && o.audit !== 'Clear' && !o.auditRemarks) return toast('Give remarks for Hold / Query - the bill goes back to the Masool.', 'bad');
      if (edI && o.audit && !o.auditDate) o.auditDate = isoDate(new Date());
      if (edA && o.payDate && !o.payRef) return toast('Record the payment reference.', 'bad');
      if (edA && futureDate(o.payDate)) return toast('The payment date cannot be in the future. Enter today or an earlier date.', 'bad');
      const act = o.audit !== b.audit ? 'Bill audit: ' + o.audit : o.payDate && !b.payDate ? 'Bill paid' : 'Bill audit / payment updated';
      Object.assign(b, o); commit(act, no); render(); ACT.auditBill(no);
    } }, { l: 'Print / export (MH-16)', fn: () => printPack(no) }], { wide: true });
};
function printPack(no) {
  const b = S.bills.find(x => x.no === no), r = C.bill[no], ch = auditChecks(b);
  printDoc('PRE-PAYMENT AUDIT CHECKLIST & PAYMENT PACK (MH-16) ' + no, kv([['Bill entry no.', `<b>${esc(no)}</b>`, 'Submitted on', fdate(b.date)], ['Vendor', esc(r.vendor), 'Budget line', esc(r.line)], ['Invoice no. / date', esc(b.invNo) + ' ' + fdate(b.invDate), 'PO no.', esc(b.po || 'No PO')], ['GRN / SRN attached', esc(b.refs || 'None attached - tick the GRN or SRN on the bill'), 'PV no.', esc(b.pv)]])
    + '<h4>Payment computation (IQD)</h4>' + kv([['Invoice amount', fmt(b.amount), 'PO value', fmt(r.poValue)], ['Less: advance adjusted', fmt(b.advAdj), 'Received (GRN + SRN)', fmt(r.received)], ['Less: retention', fmt(r.retention), 'Billed to date on PO', fmt(r.billedToDate)], ['Less: other deductions', fmt(b.otherDed), 'Advance balance before bill', fmt(r.advBalBefore)], ['NET PAYABLE', '<b>' + fmt(r.net) + '</b>', 'Payment status', esc(r.pay)]])
    + `<h4>Pre-payment audit checklist</h4><table class="lt"><thead><tr><th>#</th><th>Check</th><th>System result</th><th>Auditor tick</th></tr></thead><tbody>${ch.map(([t, s], i) => `<tr><td>${i + 1}</td><td>${esc(t)}</td><td>${esc(s)}</td><td>${(b.checks || {})[i] ? '&#9745;' : '&#9744;'}</td></tr>`).join('')}</tbody></table>`
    + kv([['Overall result', esc(r.match), 'Audit status', esc(b.audit || 'Awaiting audit')], ['Auditor remarks', esc(b.auditRemarks), 'Paid on / reference', fdate(b.payDate) + ' ' + esc(b.payRef)]])
    + sigs(['Submitted - Masool', 'Internal Auditor', 'Released - Head of Accounts', 'Paid by - Accounts']));
}

</script>
<script>
/* ---- views_admin.js ---- */
/* Views: stores, housekeeping, masters (items, vendors, MPL, budget, settings) and admin */

/* ===== MH-17 Issues ===== */
view('issues', 'Material issue slips', 'Issues', 'Stores', 'MH-17', () => {
  const ed = canEdit('Issues') && may('GRN Officer');
  tools(ed ? `<button class="btn pri" data-act="newISS">+ New issue slip number</button>` : '');
  return `<p class="muted">Material leaves the store only on an issue slip. Maintenance issues quote the job card; housekeeping issues name the floor / area. "Count adjustment" after a physical count (negative qty for a gain) and "Discard - damaged / worn" need the Masool's approval.</p>` + table('iss', [
    { h: 'Issue slip no.', v: r => `<b>${esc(r.s.no)}</b>` }, { h: 'Date', v: r => fdate(r.s.date) }, { h: 'Item', v: r => esc(itemName(r.code)) }, { h: 'Unit', v: r => esc(r.unit) },
    { h: 'Qty issued', n: 1, v: r => fmtQ(r.l.qty) }, { h: 'Issued to', v: r => esc(r.s.issuedTo) }, { h: 'Job card', v: r => esc(r.s.job) }, { h: 'Received by', v: r => esc(r.s.recvBy) },
    { h: 'Line', v: r => esc(r.line) }, { h: 'Rate (MPL)', n: 1, v: r => fmt(r.rate) }, { h: 'Value (IQD)', n: 1, v: r => fmt(r.val) }, { h: 'Stock before', n: 1, v: r => fmtQ(r.before) },
    { h: 'Check', v: r => flags(r.check) },
  ], C.iss.slice().reverse(), { click: 'editISS', key: r => r.s.no, name: 'Issue register' });
});
ACT.newISS = async () => {
  if (!canAct('issue.create')) return toast('You cannot issue material.', 'bad');
  const no = await allocNumber('ISS'); if (!no) return;
  const s = { no, date: isoDate(new Date()), issuedTo: '', job: '', recvBy: '', remarks: '', lines: [] };
  S.issues.push(s); commit('Issue slip number issued', s.no); render(); ACT.editISS(s.no);
};
ACT.editISS = no => {
  const s = S.issues.find(x => x.no === no), ed = canEdit('Issues') && may('GRN Officer');
  const rows = C.iss.filter(r => r.s.no === no);
  modal('Issue slip ' + no, fields([
    { k: 'date', l: 'Date', t: 'date', ed }, { k: 'issuedTo', l: 'Issued to (area / purpose)', t: 'sel', o: S.lists.issuedTo, ed, req: 1 },
    { k: 'job', l: 'Job card no. (maintenance)', t: 'sel', o: S.jobs.slice().reverse().map(j => [j.no, j.no.split('/').pop() + ' - ' + j.location + ': ' + j.problem.slice(0, 40)]), ed },
    { k: 'recvBy', l: 'Received by', t: 'text', ed, list: ['HK supervisor', 'In-house electrician', 'In-house plumber', 'Generator operator', 'GRN Officer'] },
    { k: 'remarks', l: 'Remarks (approval for discard / count adjustment)', t: 'text', full: true, ed }], s)
    + '<h4>Items</h4>' + linesEditor('isl', [
      { k: 'item', h: 'Item (stock items)', t: 'sel', o: itemOpts(i => isStock(i.code)), w: 240 }, { k: 'qty', h: 'Qty issued', t: 'num', w: 90 },
      { h: 'Book stock now', t: 'ro', n: 1, ro: l => l.item && C.stock[l.item] ? fmtQ(C.stock[l.item].close) : '' }, { h: 'Check', t: 'ro', ro: (l, i) => rows[i] ? flags(rows[i].check) : '' }], s.lines, ed, 30),
    [ed && { l: 'Save', cls: 'pri', fn: b => {
      readInto(b, s); s.lines = readLines('isl', ['qty']).map(l => ({ item: l.item, qty: num(l.qty) }));
      if (!s.issuedTo) return toast('Choose who the material is issued to.', 'bad');
      commit('Issue slip saved', no); render(); ACT.editISS(no);
    } }], { wide: true });
};

/* ===== MH-18 Stores ===== */
view('stores', 'Stores stock & month-end count', 'Stores', 'Stores', 'MH-18', () => {
  const ed = canEdit('Stores') && may('GRN Officer'), mk = curMK();
  tools(monthPicker() + (ed ? `<button class="btn pri" data-act="saveCounts">Save counts</button><button class="btn ghost" data-act="postAdj">Post count adjustments</button>` : ''));
  const rows = S.items.filter(i => isStock(i.code));
  return `<p class="muted">Automatic from opening stock, GRNs and issue slips. Enter the month-end physical count (Accounts as witness); post any difference as a "Count adjustment" issue approved by the Masool.</p>` + table('stores', [
    { h: 'Item code', v: i => esc(i.code) }, { h: 'Item', v: i => esc(i.name) }, { h: 'Unit', v: i => esc(i.unit) },
    { h: 'Opening for month', n: 1, v: i => fmtQ(C.stock[i.code].open) }, { h: 'Received in month', n: 1, v: i => fmtQ(C.stock[i.code].recIn) },
    { h: 'Issued in month', n: 1, v: i => fmtQ(C.stock[i.code].issIn) }, { h: 'Closing book stock', n: 1, v: i => `<b>${fmtQ(C.stock[i.code].close)}</b>` },
    { h: 'Physical count', v: i => ed ? `<input class="cnt n" data-code="${esc(i.code)}" inputmode="decimal" value="${C.stock[i.code].cnt ?? ''}">` : fmtQ(C.stock[i.code].cnt), x: i => C.stock[i.code].cnt ?? '' },
    { h: 'Difference', n: 1, v: i => fmtQ(C.stock[i.code].diff) }, { h: 'Rate (MPL)', n: 1, v: i => fmt(C.stock[i.code].rate) },
    { h: 'Closing value (IQD)', n: 1, v: i => fmt(C.stock[i.code].value) }, { h: 'Re-order level', n: 1, v: i => fmtQ(i.reorder) }, { h: 'Status', v: i => flag(C.stock[i.code].status) },
  ], rows, { name: 'Stores ' + mk, foot: ['', '<b>Total</b>', '', '', '', '', '', '', '', '', fmt(rows.reduce((a, i) => a + C.stock[i.code].value, 0)), '', ''] });
});
ACT.saveCounts = () => {
  const mk = curMK(); S.counts[mk] = S.counts[mk] || {};
  document.querySelectorAll('input.cnt').forEach(x => { if (x.value.trim() === '') delete S.counts[mk][x.dataset.code]; else S.counts[mk][x.dataset.code] = num(x.value); });
  commit('Month-end count saved', mk); render(); toast('Counts saved.', 'ok');
};
ACT.postAdj = () => {
  ACT.saveCounts();
  const diffs = Object.entries(C.stock).filter(([, s]) => s.diff !== null && Math.abs(s.diff) > 1e-9);
  if (!diffs.length) return toast('No count differences to post.', 'ok');
  if (!(canEdit('Issues') && may('GRN Officer'))) return toast('You cannot raise issue slips.', 'bad');
  confirmBox('Post count adjustments', `${diffs.length} item(s) differ from the book. An issue slip "Count adjustment" will be raised (shortage = positive qty, gain = negative qty). It must be approved by the Masool.`, 'Raise issue slip', async () => {
    const last = `${MON[S.settings.month - 1]} ${S.settings.year}`;
    const d = isoDate(new Date(S.settings.year, S.settings.month, 0));
    const no = await allocNumber('ISS'); if (!no) return;
    const s = { no, date: d, issuedTo: 'Count adjustment', job: '', recvBy: U.name, remarks: 'Month-end count ' + last + ' - approved by Masool: ____', lines: diffs.map(([code, st]) => ({ item: code, qty: -st.diff })) };
    S.issues.push(s); closeModal(); commit('Count adjustment posted', s.no); render(); toast('Issue slip ' + s.no + ' raised.', 'ok');
  });
};

/* ===== MH-19 HK norms ===== */
view('hknorms', 'Housekeeping consumables vs norm', 'HK Norms', 'Housekeeping', 'MH-19', () => {
  const rows = hkNorms(), m = S.settings.month, zd = zdUsed(m), mk = curMK();
  const edX = may('Maintenance Masool') && canSee('HK Norms');
  const ex = S.hkExplain[mk] || {};
  const cN = rows.reduce((a, r) => a + r.costNorm, 0), cA = rows.reduce((a, r) => a + r.cost, 0);
  const annualNorm = S.items.filter(i => num(i.norm) > 0).reduce((a, i) => a + num(i.norm) * lowRate(i.code) / 100, 0) * Array.from({ length: 12 }, (_, i) => zdUsed(i + 1)).reduce((a, b) => a + b, 0);
  tools(monthPicker() + (edX ? '<button class="btn pri" data-act="saveExplain">Save explanations</button>' : ''));
  return `<div class="tiles">${tile('Zaereen-days used', fmt(zd), (S.settings.occupancy[m - 1].actual ? 'actual (front office)' : 'planned'))}${tile('Cost per zaereen-day at norm', fmt(zd ? cN / zd : 0, 1), 'IQD')}${tile('Cost per zaereen-day actual', fmt(zd ? cA / zd : 0, 1), 'IQD', cA > cN * (1 + num(S.settings.hkTol)) ? 'bad' : '')}${tile('Annual cost at norm vs MT budget', fmt(annualNorm), 'budget ' + fmt((bline('MT') || {}).annual))}</div>
  <p class="muted">Norm per 100 zaereen-days from the Item master. Issues to housekeeping only (count adjustments and discards excluded). Above norm beyond ${pct(S.settings.hkTol)}: the Masool explains in writing; well below norm: check that room standards are kept.</p>` + table('hk', [
    { h: 'Item code', v: r => esc(r.i.code) }, { h: 'Item', v: r => esc(r.i.name) }, { h: 'Unit', v: r => esc(r.i.unit) }, { h: 'Norm / 100 zd', n: 1, v: r => fmtQ(r.i.norm) },
    { h: 'Qty at norm', n: 1, v: r => fmt(r.atNorm) }, { h: 'Issued in month', n: 1, v: r => fmt(r.issued) }, { h: 'Variance', n: 1, v: r => fmt(r.v) }, { h: 'Variance %', n: 1, v: r => pct(r.vp) },
    { h: 'Flag', v: r => flag(r.flag) }, { h: 'Cost at norm', n: 1, v: r => fmt(r.costNorm) }, { h: 'Actual cost', n: 1, v: r => fmt(r.cost) },
    { h: 'Masool explanation', w: 200, v: r => edX && r.flag !== 'OK' ? `<input class="hkx" data-code="${esc(r.i.code)}" value="${esc(ex[r.i.code] || '')}">` : esc(ex[r.i.code] || ''), x: r => ex[r.i.code] || '' },
  ], rows, { name: 'HK norms ' + mk });
});
ACT.saveExplain = () => { const mk = curMK(); S.hkExplain[mk] = S.hkExplain[mk] || {}; document.querySelectorAll('input.hkx').forEach(x => { S.hkExplain[mk][x.dataset.code] = x.value.trim(); }); commit('HK norm explanations saved', mk); render(); toast('Saved.', 'ok'); };

/* ===== MH-20 Linen par ===== */
view('linen', 'Linen par & laundry summary', 'Linen Par', 'Housekeeping', 'MH-20', () => {
  const ed = canEdit('Linen Par') && may('HK Supervisor'), rows = linenPar(), mk = curMK();
  tools(monthPicker() + (ed ? '<button class="btn pri" data-act="saveLinen">Save linen count</button>' : ''));
  return `<p class="muted">Par = ${fmt(S.settings.capacity)} beds x sets per bed. Enter the linen count in circulation (rooms + floor pantries) at month-end. Billable laundry = pieces returned clean. Pieces lost by the laundry are deducted from its bill at the MPL rate.</p>` + table('linen', [
    { h: 'Item code', v: r => esc(r.i.code) }, { h: 'Linen item', v: r => esc(r.i.name) }, { h: 'Par per bed', n: 1, v: r => fmtQ(r.i.par) }, { h: 'Par qty', n: 1, v: r => fmt(r.par) },
    { h: 'In store (book)', n: 1, v: r => fmt(r.store) }, { h: 'In circulation (count)', v: r => ed ? `<input class="lnc n" data-code="${esc(r.i.code)}" inputmode="decimal" value="${r.circ ?? ''}">` : fmt(r.circ), x: r => r.circ ?? '' },
    { h: 'With laundry', n: 1, v: r => fmt(r.pending) }, { h: 'Total held', n: 1, v: r => fmt(r.held) }, { h: 'Shortfall vs par', n: 1, v: r => r.short > 0 ? fmt(r.short) : '-' },
    { h: 'Status', v: r => flag(r.status) }, { h: 'Sent (month)', n: 1, v: r => fmt(r.sent) }, { h: 'Returned clean (billable)', n: 1, v: r => fmt(r.clean) },
    { h: 'Re-wash', n: 1, v: r => fmt(r.rewash) }, { h: 'Lost / damaged by laundry', n: 1, v: r => r.lost ? `<span class="flag bad">${fmt(r.lost)}</span>` : '0', x: r => r.lost },

const NOTIFY_EVENTS = {
  PO_SAVED: { to: ['Internal Auditor', 'GRN Officer', 'Store Keeper'], text: 'PO saved' },
  GRN_RECEIVED: { to: ['Maintenance Masool'], text: 'Goods received (GRN)' },
  SRN_PREPARED: { to: ['Internal Auditor'], text: 'Service receipt (SRN) prepared' },
  ADVANCE_REQUESTED: { to: ['Head of Accounts', 'Internal Auditor'], text: 'Advance requested' },
  BILL_ENTERED: { to: ['Internal Auditor'], text: 'Bill entered' },
  VARIANCE_APPROVAL: { to: ['Head of Accounts', 'Sigat'], text: 'Bill needs variance approval' },
  BILL_CLEARED: { to: ['Head of Accounts', 'Accounts', 'Maintenance Masool'], text: 'Bill cleared for payment' },
  BILL_HOLD: { to: ['Maintenance Masool', 'Head of Accounts'], text: 'Bill put on hold' },
  CPV_CREATED: { to: ['Head of Accounts', 'Accounts'], text: 'Consolidated cash PV created' },
  CPV_PAID: { to: ['Internal Auditor', 'Maintenance Masool'], text: 'Consolidated cash PV paid' },
};
const ACTION_EVENT = { 'PO number issued': 'PO_SAVED', 'GRN saved': 'GRN_RECEIVED', 'SRN saved': 'SRN_PREPARED', 'Advance number issued': 'ADVANCE_REQUESTED', 'Advance updated': 'ADVANCE_REQUESTED', 'Bill entry number issued': 'BILL_ENTERED', 'Consolidated PV created': 'CPV_CREATED', 'Consolidated PV paid': 'CPV_PAID' };
const notifList = () => (S.notifs = S.notifs || []);
function addNotice(event, ref, extra) {
  const ev = NOTIFY_EVENTS[event]; if (!ev) return;
  if (notifList().some(n => n.event === event && n.ref === ref && !n.done)) return;
  notifList().push({ id: uid(), t: nowDT(), event, ref: ref || '', to: ev.to, text: ev.text + (extra ? ' - ' + extra : ''), status: 'Logged (no e-mail server)', done: false, doneBy: '', doneOn: '' });
}
function notifyFor(action, details) {
  const ref = String(details || '').split(' ')[0];
  if (ACTION_EVENT[action]) addNotice(ACTION_EVENT[action], ref, details);
  if (action === 'Bill saved' || action === 'Bill entry number issued' || action.indexOf('Bill audit') === 0) {
    const b = S.bills.find(x => x.no === ref), r = b && C.bill[b.no];
    if (!b || !r) return;
    if (/variance approval/.test(r.match)) addNotice('VARIANCE_APPROVAL', b.no, 'net ' + fmt(r.net));
    if (action === 'Bill audit: Clear') addNotice('BILL_CLEARED', b.no);
    if (action === 'Bill audit: Hold') addNotice('BILL_HOLD', b.no);
  }
}

  };
  rd.readAsText(f);

<script>
/* ---- shared.js ---- */
/* Server mode: all data lives in the PostgreSQL database behind the local server, and every user works on
   the same records live. People log in with their own account; the Admin links each log-in to an app user (role). */

// Registers stored as records (key field), grouped into chunk documents of up to ~100 records.
const REC = { pos: 'no', advances: 'no', grns: 'no', srns: 'no', bills: 'no', issues: 'no', jobs: 'no', numlog: 'no', laundry: 'id', ppm: 'id', rooms: 'no', users: 'id', items: 'code', vendors: 'code', audit: 'k', cpvs: 'no', notifs: 'id' };
// Configuration kept as one document each.
// meta first: it carries the owner, which is checked on later writes
const CFG = ['meta', 'settings', 'budgetLines', 'categories', 'lists', 'mpl', 'access', 'counts', 'linenCounts', 'hkExplain', 'roles'];

let DB = null, USR = null, ME = { id: null, name: '' }, IS_OWNER = false, READONLY = false, READY = false;
let writeQ = Promise.resolve(), writing = 0, writeErr = '', PENDING = false, gateMsg = '', bootTimer = null;
const REMOTE = { cfg: {}, rec: {} };   // last confirmed state from the store
const GOT = {};                        // listeners that delivered a confirmed snapshot
const EXIST = new Set();               // chunk documents that exist
const SYNC = {};                       // canonical JSON last written / received, by path or path#key
const DIRTY = new Map();               // local changes whose echo has not arrived yet -> time written

const stable = v => {
  if (v === null || v === undefined || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
};
const clone = v => JSON.parse(JSON.stringify(v === undefined ? null : v));
const sid = s => String(s || 'x').replace(/[^A-Za-z0-9_\-.~:@+]/g, '-');
const colPath = c => 'm_' + c;
function recKey(coll, r) { if (coll === 'audit' && !r.k) r.k = String(r.t || '').replace(/\D/g, '') + '-' + uid(); return sid(r[REC[coll]]); }
function chunkOf(coll, r) {
  const m = /\/(\d{4})\/(\d{4})$/.exec(r.no || '');
  if (m && coll !== 'rooms') return (coll === 'numlog' ? sid(r.type) + '-' : '') + m[1] + '-' + Math.floor(+m[2] / 100);
  if (coll === 'laundry') return sid(String(r.date || 'x').slice(0, 7));
  if (coll === 'audit') return sid(String(r.t || 'x').slice(0, 7));
  return 'all';
}

/* ---------- writing ---------- */
function syncLabel() { return writing ? 'Saving...' : writeErr ? 'Not saved' : READONLY ? 'View only' : 'Saved'; }
function updSync() { const e = document.getElementById('syncState'); if (e) { e.textContent = syncLabel(); e.className = 'sync ' + (writeErr ? 'bad' : writing ? 'busy' : ''); } }

function syncOut() {
  if (!DB || !READY) return;
  if (READONLY) { toast('You can view this app but not change it. Ask the owner for Contributor access.', 'bad'); return; }
  CFG.forEach(k => {
    const p = 'cfg/' + k, j = stable(S[k]);
    if (SYNC[p] !== j) { SYNC[p] = j; DIRTY.set(p, Date.now()); queue({ path: p, kind: 'set', body: { v: clone(S[k]) } }); }
  });
  Object.keys(REC).forEach(coll => {
    const arr = S[coll] || [], seen = new Set(), upd = {}, rewrite = new Set(), pre = colPath(coll) + '/';
    arr.forEach((r, i) => {
      const k = recKey(coll, r), p = pre + chunkOf(coll, r), id = p + '#' + k, w = { o: i, r: clone(r) }, j = stable(w);
      seen.add(id);
      if (SYNC[id] !== j) { SYNC[id] = j; DIRTY.set(id, Date.now()); (upd[p] = upd[p] || {})[k] = w; }
    });
    Object.keys(SYNC).forEach(id => { if (id.startsWith(pre) && !seen.has(id)) { rewrite.add(id.split('#')[0]); delete SYNC[id]; DIRTY.delete(id); } });
    rewrite.forEach(p => {
      const rows = {}; arr.forEach((r, i) => { if (pre + chunkOf(coll, r) === p) rows[recKey(coll, r)] = { o: i, r: clone(r) }; });
      delete upd[p];
      queue({ path: p, kind: Object.keys(rows).length ? 'set' : 'delete', body: { rows } });
    });
    Object.entries(upd).forEach(([p, rows]) => queue({ path: p, kind: EXIST.has(p) ? 'update' : 'set', body: { rows } }));
  });
}
function queue(op) {
  writing++; updSync();
  writeQ = writeQ.then(() => doWrite(op)).catch(() => { }).then(() => { writing--; updSync(); });
}
async function doWrite(op, again) {
  const ref = DB.doc(op.path);
  try {
    if (op.kind === 'delete') { await ref.delete(); EXIST.delete(op.path); }
    else if (op.kind === 'update') await ref.update(op.body);
    else { await ref.set(op.body); EXIST.add(op.path); }
    writeErr = '';
  } catch (e) {
    const code = e && e.code;
    if (op.kind === 'update' && code === 'invalid_argument' && !again) {
      const s = await ref.get().catch(() => null);
      if (s && !s.exists) return doWrite(Object.assign({}, op, { kind: 'set' }), true);
    }
    if ((code === 'unavailable' || code === 'resource_exhausted') && !again) { await new Promise(r => setTimeout(r, 800 + Math.random() * 1200)); return doWrite(op, true); }
    writeErr = code || 'error';
    if (code === 'invalid_argument' && op.kind !== 'update') { READONLY = true; toast('Your change was not saved: you have view-only access. Ask the owner for Contributor access.', 'bad'); }
    else if (code === 'quota_exceeded') toast('Not saved: the shared database is full (' + e.message + '). Ask the Admin to archive old data.', 'bad');
    else toast('A change could not be saved (' + (code || 'error') + '). Reload the page and check it.', 'bad');
  }
}

/* ---------- reading ---------- */
function subscribe() {
  const err = e => {
    writeErr = e.code; updSync();
    if (READY) return;
    gateMsg = e.code === 'invalid_argument'
      ? 'Your log-in (' + (ME.name || 'this account') + ') is not linked to a user in this app yet. Ask the Head of Accounts to link it in Admin > Users, then reload this page.'
      : 'The shared data could not be loaded (' + e.code + '). Reload the page to try again.';
    renderGate();
  };
  DB.collection('cfg').onSnapshot(s => {
    REMOTE.cfg = {}; s.docs.forEach(d => { REMOTE.cfg[d.id] = clone((d.data() || {}).v); });
    if (!s.metadata.fromCache) GOT.cfg = true; onRemote();
  }, err);
  Object.keys(REC).forEach(c => DB.collection(colPath(c)).onSnapshot(s => {
    const m = {}, pre = colPath(c) + '/';
    [...EXIST].forEach(p => { if (p.startsWith(pre)) EXIST.delete(p); });
    s.docs.forEach(d => { m[d.id] = clone((d.data() || {}).rows || {}); EXIST.add(pre + d.id); });
    REMOTE.rec[c] = m; if (!s.metadata.fromCache) GOT[c] = true; onRemote();
  }, err));
}
function onRemote() {
  if (READY) return applyRemote();
  if (!GOT.cfg || Object.keys(REC).some(c => !GOT[c])) return;
  READY = true; clearTimeout(bootTimer); gateMsg = '';
  // The owner is whoever set the app up (recorded in meta); before set-up any signed-in account may do it
  if (HOST === 'server') { const o = (REMOTE.cfg.meta || {}).ownerUid; IS_OWNER = REMOTE.cfg.settings === undefined || (!!o && o === ME.id); }
  if (REMOTE.cfg.settings === undefined) { S = null; return renderGate(); }
  S = null; buildFromRemote(); recalc(); resolveUser();
}
function dirtyKeep(id, remoteJ) {
  if (!DIRTY.has(id)) return false;
  if (remoteJ === SYNC[id] || (Date.now() - DIRTY.get(id) > 20000 && !writing)) { DIRTY.delete(id); return false; }
  return true;
}
function buildFromRemote() {
  const N = S || {};
  CFG.forEach(k => {
    const p = 'cfg/' + k, rv = REMOTE.cfg[k], rj = stable(rv);
    if (dirtyKeep(p, rj)) return;
    if (rv !== undefined) { N[k] = clone(rv); SYNC[p] = rj; }
  });
  Object.keys(REC).forEach(c => {
    const pre = colPath(c) + '/', out = [], remoteIds = new Set(), local = new Map();
    (N[c] || []).forEach((r, i) => local.set(pre + chunkOf(c, r) + '#' + recKey(c, r), { r, i }));
    Object.entries(REMOTE.rec[c] || {}).forEach(([ch, rows]) => Object.entries(rows).forEach(([k, w]) => {
      const id = pre + ch + '#' + k, j = stable(w); remoteIds.add(id);
      if (dirtyKeep(id, j)) { const l = local.get(id); if (l) out.push({ o: l.i, k, r: l.r }); return; }
      SYNC[id] = j; out.push({ o: +w.o || 0, k, r: clone(w.r) });
    }));
    local.forEach((l, id) => { if (DIRTY.has(id) && !remoteIds.has(id)) out.push({ o: l.i, k: id, r: l.r }); });
    Object.keys(SYNC).forEach(id => { if (id.startsWith(pre) && !remoteIds.has(id) && !DIRTY.has(id)) delete SYNC[id]; });
    out.sort((a, b) => (a.o - b.o) || (a.k < b.k ? -1 : a.k > b.k ? 1 : 0));
    N[c] = out.map(x => x.r);
  });
  if (!N.roles) N.roles = defaultRoles();
  S = N; S.hkExplain = S.hkExplain || {}; S.counts = S.counts || {}; S.linenCounts = S.linenCounts || {}; S.meta = S.meta || { app: 'KUN-MH' };
}
function applyRemote(force) {
  if (!READY || !S) return;
  if (!force && ((document.getElementById('modal') || {}).classList?.contains('open') || inputFocused())) { PENDING = true; document.getElementById('staleBar').hidden = false; return; }
  PENDING = false; document.getElementById('staleBar').hidden = true;
  buildFromRemote(); recalc();
  if (U) U = S.users.find(u => u.id === U.id && u.active === 'Y' && u.cid === ME.id) || null;
  if (!U) return resolveUser();
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
document.addEventListener('focusout', () => { if (SHARED && PENDING && !((document.getElementById('modal') || {}).classList?.contains('open'))) setTimeout(applyRemote, 50); });
ACT.refreshNow = () => applyRemote(true);

/* ---------- document numbers: a short lock so two people never get the same number ---------- */
if (SHARED) allocNumber = async type => {
  if (!DB || READONLY) { toast('You have view-only access and cannot create documents.', 'bad'); return null; }
  const ref = DB.doc('locks/num-' + type + '-' + S.settings.year), holder = sid(ME.id) + '-' + uid();
  for (let i = 0; i < 16; i++) {
    let r;
    try { r = await ref.acquire({ holder, ttlMs: 5000 }); }
    catch (e) { toast('Could not get a document number (' + e.code + '). Try again.', 'bad'); return null; }
    if (r.acquired) {
      try {
        const s = await ref.get(), last = (s.exists && +(s.data() || {}).last) || 0;
        const seq = Math.max(last, lastSeq(type)) + 1;
        try { await ref.update({ last: seq }); } catch (e) { await ref.set({ last: seq }); }
        ref.acquire({ holder, ttlMs: 1000 }).catch(() => { });   // shorten the lease so the next person need not wait
        return newNumber(type, seq);
      } catch (e) { toast('Could not get a document number (' + (e.code || 'error') + '). Try again.', 'bad'); return null; }
    }
    await new Promise(res => setTimeout(res, 300 + Math.random() * 500));
  }
  toast('Another user is issuing a number right now. Try again in a moment.', 'warn'); return null;
};

/* ---------- identity: log-in -> app user ---------- */
function resolveUser() {
  U = S.users.find(u => u.cid && u.cid === ME.id && u.active === 'Y') || null;
  if (U) return route();
  renderGate();
}
function renderGate() {
  const card = inner => { document.getElementById('app').innerHTML = `<div class="login"><div class="lcard"><div class="lbrand">Faiz E Husaini - Karbala (KUN)</div><h1>Maintenance &amp; Housekeeping</h1>${inner}${HOST === 'server' && DB ? '<button class="btn ghost full" data-act="logout">Log out</button>' : ''}</div></div>`; };
  if (gateMsg) return card(`<p>${esc(gateMsg)}</p>`);
  if (!READY) return card('<p class="muted">Loading the shared data...</p>');
  const who = esc(ME.name || 'you');
  if (!S) {
    if (!IS_OWNER) return card('<p>This app has not been set up yet. The owner opens it first and sets it up.</p>');
    return card(`<p>Set up the shared data. Everyone you share the app with works on the same records.</p>
      <button class="btn pri full" data-act="setupData" data-id="ex">Start with the October 2026 example data</button>
      <button class="btn full" data-act="setupData" data-id="empty">Start empty (go-live)</button>
      <ul class="notes"><li>Both start with the settings, budget lines, item categories, access rights and users from the user-access input file.</li>
      <li>"Start empty" leaves out the example items, vendors, MPL, POs, bills and job cards.</li><li>Example data can be cleared later from Admin &gt; Data.</li></ul>`);
  }
  const blocked = S.users.find(u => u.cid === ME.id && u.active !== 'Y');
  if (blocked) return card(`<p>Signed in as <b>${who}</b>. Your user (${esc(blocked.id)}) is blocked. Ask the Head of Accounts.</p>`);
  if (IS_OWNER) {
    const free = S.users.filter(u => !u.cid && u.active === 'Y');
    return card(`<p>Signed in as <b>${who}</b> (owner). Choose which app user you are, or add yourself as an Admin user. You can then link the other people from Admin &gt; Users.</p>
      ${free.length ? `<label for="lnU">I am</label><select id="lnU">${opts(free.map(u => [u.id, u.id + ' - ' + u.name + ' (' + u.role + ')']), '', false)}</select><button class="btn pri full" data-act="linkMe">Link me to this user</button><p class="muted" style="text-align:center">or</p>` : ''}
      <label for="nwU">New Admin user ID</label><input id="nwU" placeholder="e.g. CONSULTANT" autocapitalize="characters"><button class="btn full" data-act="addMe">Add me as an Admin user</button>`);
  }
  const asked = S.users.find(u => u.reqCid === ME.id && !u.cid);
  if (asked) return card(`<p>Signed in as <b>${who}</b>. Your request to be linked as <b>${esc(asked.id)} - ${esc(asked.name)}</b> is waiting for the Head of Accounts (Admin &gt; Users). This page opens by itself once it is approved.</p><button class="btn full" data-act="cancelReq">Cancel request</button>`);
  const free = S.users.filter(u => !u.cid && u.active === 'Y');
  card(`<p>Signed in as <b>${who}</b>. Your account is not linked to a role in this app yet.</p>
    ${free.length && !READONLY ? `<label for="rqU">I am</label><select id="rqU">${opts(free.map(u => [u.id, u.id + ' - ' + u.name + ' (' + u.desig + ')']), '', false)}</select><button class="btn pri full" data-act="requestLink">Ask to be linked as this user</button><p class="muted">The Head of Accounts approves the request in Admin &gt; Users.</p>`
      : `<p class="muted">${READONLY ? 'You have view-only access. Ask the owner to share the app with you at a level that can make changes.' : 'Ask the Head of Accounts to add you in Admin &gt; Users.'}</p>`}`);
}
ACT.requestLink = () => {
  const u = S.users.find(x => x.id === $('#rqU').value && !x.cid); if (!u) return;
  S.users.forEach(x => { if (x.reqCid === ME.id) x.reqCid = ''; });
  u.reqCid = ME.id; u.reqAt = nowDT(); logAudit('Link requested', u.id + ' by ' + (ME.name || 'a person')); saveData(); renderGate();
};

async function inflateRaw(u8) {
