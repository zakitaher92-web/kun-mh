/* ---------- converting and checking rows ---------- */
function impDate(v) {
  if (typeof v === 'number') { if (v < 1 || v > 100000) return { err: '"' + v + '" is not a date' }; return { v: new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10) }; }
  const s = String(v).trim(); let y, m, d, x;
  const mon = t => MON.findIndex(n => n.toLowerCase() === t.slice(0, 3).toLowerCase()) + 1;
  if ((x = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/.exec(s))) [y, m, d] = [+x[1], +x[2], +x[3]];
  else if ((x = /^(\d{1,2})[-/. ](\d{1,2})[-/. ](\d{2,4})$/.exec(s))) [d, m, y] = [+x[1], +x[2], +x[3]];
  else if ((x = /^(\d{1,2})[-/ ]([A-Za-z]{3,9})[-/ ,]+(\d{2,4})$/.exec(s))) [d, m, y] = [+x[1], mon(x[2]), +x[3]];
  else return { err: '"' + s + '" is not a date (use dd-mm-yyyy)' };
  if (y < 100) y += 2000;
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (!m || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return { err: '"' + s + '" is not a valid date (use dd-mm-yyyy)' };
  return { v: dt.toISOString().slice(0, 10) };
}
function impConv(c, v) {
  switch (c.t) {
    case 'num': {
      if (typeof v === 'number') return { v };
      const s = String(v).replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x660).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 0x6F0).replace(/٫/g, '.')
        .replace(/[,\s٬]/g, '').replace(/^(IQD|ID|USD|\$|د\.?ع\.?)/i, '').replace(/(IQD|ID|USD|\$|د\.?ع\.?|\/-)$/i, '');
      return /^-?(\d+\.?\d*|\.\d+)$/.test(s) ? { v: parseFloat(s) } : { err: '"' + v + '" is not a number' };
    }
    case 'date': return impDate(v);
    case 'yn': { const s = lc(String(v).trim()); return ['y', 'yes', 'true', '1'].includes(s) ? { v: 'Y' } : ['n', 'no', 'false', '0'].includes(s) ? { v: 'N' } : { err: 'use Y or N' }; }
    case 'up': return { v: String(v).toUpperCase().replace(/\s+/g, '') };
    case 'pick': {
      const o = c.o().map(x => Array.isArray(x) ? x : [x]), n = impNorm(v);
      const f = o.find(x => x.some(a => impNorm(a) === n));
      if (f) return { v: f[0] };
      if (c.addNew) return { v: String(v).trim(), warn: c.h + ' "' + String(v).trim() + '" is new - it will be added to the list' };
      return { err: '"' + v + '" is not on the list' + (o.length <= 10 ? ' (' + o.map(x => x[0]).join(', ') + ')' : '') };
    }
    default: return { v: String(v).trim() };
  }
}
/* Column choices the user made for their own headings, remembered in this browser per list: { kind: { normalisedHeading: fieldKey or '-' } } */
const IMP_MAP_KEY = 'kunmh.importColumns';
const impSaved = () => { try { return JSON.parse(localStorage.getItem(IMP_MAP_KEY) || '{}') || {}; } catch (e) { return {}; } };
const impSave = (kind, heading, k) => { try { const a = impSaved(); a[kind] = a[kind] || {}; a[kind][impNorm(heading)] = k || '-'; localStorage.setItem(IMP_MAP_KEY, JSON.stringify(a)); } catch (e) { } };
const impForget = kind => { try { const a = impSaved(); delete a[kind]; localStorage.setItem(IMP_MAP_KEY, JSON.stringify(a)); } catch (e) { } };
function impPrepare(kind, table, ov) {
  const sp = IMPORTS[kind], cols = sp.cols, saved = impSaved()[kind] || {};
  const match = h => {
    const n = impNorm(h); if (!n) return null;
    if (saved[n]) return saved[n] === '-' ? null : cols.find(c => c.k === saved[n]) || null;
    return cols.find(c => [c.h, c.k].concat(c.al || []).some(a => impNorm(a) === n)) || null;
  };
  const filled = r => (table[r] || []).some(v => String(v ?? '').trim() !== '');
  let hr = -1, map = [], found = true;
  if (ov && ov.hr !== undefined) { hr = Math.max(0, Math.min(ov.hr, table.length - 1)); map = (table[hr] || []).map(match); }
  else for (let r = 0; r < Math.min(table.length, 15); r++) {
    const m = (table[r] || []).map(match);
    if (m.filter(Boolean).length >= Math.min(2, cols.length)) { hr = r; map = m; break; }
  }
  if (hr < 0) { found = false; hr = Math.max(0, table.findIndex((r, i) => filled(i))); map = (table[hr] || []).map(match); }
  const width = Math.max(0, ...table.slice(hr, hr + 200).map(r => (r || []).length));
  map = Array.from({ length: width }, (_, i) => ov && ov.map && i in ov.map ? (cols.find(c => c.k === ov.map[i]) || null) : map[i] || null);
  const used = new Set();
  map = map.map(c => { if (!c || used.has(c.k)) return null; used.add(c.k); return c; });
  const heads = map.map((c, i) => {
    const h = String((table[hr] || [])[i] ?? '').trim();
    let sample = ''; for (let r = hr + 1; r < Math.min(table.length, hr + 30) && sample === ''; r++) sample = String((table[r] || [])[i] ?? '').trim();
    return { i, h, k: c ? c.k : '', sample };
  }).filter(x => x.h || x.sample || x.k);
  const ignored = heads.filter(x => x.h && !x.k).map(x => x.h);
  const base = { heads, hr, found, ignored, used };
  if (!found && !used.size) return Object.assign(base, { err: 'The column headings of this sheet were not recognised. Choose below which of your columns holds what (the app remembers your choice for next time), or check the header row number.' });
  const needErr = sp.need(used); if (needErr) return Object.assign(base, { err: needErr + ' Choose it below in "Your columns".' });
  let vn = Math.max(0, ...S.vendors.map(v => +(/^V-(\d+)$/i.exec(v.code) || [])[1] || 0));
  const ctx = { names: new Set(), keys: new Map(), nextVendor: () => 'V-' + pad4(++vn), newItems: new Map(), newVendors: new Map() };
  ctx.nextItem = cat => {
    const all = S.items.concat([...ctx.newItems.values()]), pre = c => (/^([A-Za-z]+)-?\d+$/.exec(c) || [])[1];
    const ps = all.filter(i => i.cat === cat).map(i => pre(i.code)).filter(Boolean);
    let p = ps.sort((a, b) => ps.filter(x => x === b).length - ps.filter(x => x === a).length)[0];
    if (!p) { const w = cat.replace(/[^A-Za-z ]/g, ' ').trim().split(/\s+/); p = (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase() || 'IT'; }
    const n = Math.max(0, ...all.filter(i => pre(i.code) === p).map(i => +(/(\d+)$/.exec(i.code) || [])[1] || 0));
    return p + '-' + String(n + 1).padStart(3, '0');
  };
  const rows = [];
  for (let r = hr + 1; r < table.length; r++) {
    const cells = table[r] || [];
    if (!cells.some(v => String(v ?? '').trim() !== '')) continue;
    const raw = {}, E = [], W = [];
    map.forEach((c, i) => {
      if (!c) return; const v = cells[i];
      if (v === undefined || v === null || String(v).trim() === '') return;
      const x = impConv(c, v);
      if (x.err) E.push(c.h + ': ' + x.err); else { raw[c.k] = x.v; if (x.warn) W.push(x.warn); }
    });
    if (sp.pre) sp.pre(raw, ctx, E, W);
    const ex = sp.find(raw);
    if (!ex) cols.filter(c => c.req && raw[c.k] === undefined && !E.some(e => e.startsWith(c.h + ':'))).forEach(c => E.push(c.h + ' is needed for a new row'));
    if (sp.check) sp.check(raw, ex, ctx, E, W);
    const key = sp.key(raw) || '';
    const kk = lc(key);
    if (kk && ctx.keys.has(kk)) E.push('Same ' + sp.match.split(' (')[0].toLowerCase() + ' as row ' + ctx.keys.get(kk));
    else if (kk) ctx.keys.set(kk, r + 1);
    const changes = ex ? Object.keys(raw).filter(k => k[0] !== '_' && String(ex[k] ?? '') !== String(raw[k] ?? '')) : [];
    const action = E.length ? 'Error' : !ex ? 'New' : changes.length ? 'Update' : 'No change';
    rows.push({ n: r + 1, raw, ex, key, action, E, W, changes });
  }
  return Object.assign(base, { rows });
}

  <div class="two">${Object.keys(IMPORTS).map(k => `<section class="card">${impCard(k)}</section>`).join('')}</div>`);
ACT.impOpen = kind => modal('Import ' + IMPORTS[kind].label.toLowerCase() + ' from Excel', impCard(kind, true)
  + '<p class="small muted">Blank cells keep the value already in the app; rows with errors are skipped. You see every row before anything is saved. More lists: Masters &gt; Import from Excel.</p>', [], { noFocus: true });
const impBtn = kind => IMPORTS[kind].can() ? `<button class="btn ghost" data-act="impOpen" data-id="${kind}">Import from Excel</button>` : '';

ACT.impTpl = kind => {
  const sp = IMPORTS[kind];
  const val = (c, v) => v === null || v === undefined ? '' : c.t === 'num' ? (v === '' ? '' : num(v)) : c.t === 'date' && v ? fdate(v) : v;
  const data = [sp.cols.map(c => c.h)].concat(sp.list().map(o => sp.cols.map(c => val(c, c.get ? c.get(o) : o[c.k]))));
  const what = c => c.note || (c.t === 'num' ? 'Number' : c.t === 'date' ? 'Date' : c.t === 'yn' ? 'Y or N' : c.t === 'pick' ? '' : 'Text');
  const allowed = c => { if (c.t !== 'pick') return c.t === 'date' ? 'dd-mm-yyyy, dd-Mon-yyyy or an Excel date' : ''; const o = c.o().map(x => Array.isArray(x) ? x[0] : x); return o.length <= 40 ? o.join(' | ') : 'See the list in the app'; };
  const info = [['Column', 'Needed for a new row', 'What to enter', 'Allowed values / format']].concat(sp.cols.map(c => [c.h, c.req ? 'Yes' : '', what(c), allowed(c)]))
    .concat([[], ['How the import works'], ['Rows are matched on: ' + sp.match + '. A match updates that row; anything else is added as a new row.'],
      ['Blank cells keep the value already in the app. Nothing is deleted by an import.'], ['Keep the header row of the first sheet as it is. Extra columns are ignored.'],
      ['Import the file from Masters > Import from Excel (or the Import from Excel button on the list). The app shows every row before it saves.']]);
  const bytes = xlsxBuild([
    { name: sp.sheet, rows: data, widths: sp.cols.map(c => Math.min(45, Math.max(12, c.h.length + 4))) },
    { name: 'Instructions', rows: info, widths: [34, 20, 60, 60] },
  ]);
  download(`KUN_MH_${sp.sheet.replace(/\W+/g, '_')}_template_${isoDate(new Date())}.xlsx`, bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
};

App.importFile = async (kind, inp) => {
  const f = inp.files && inp.files[0]; if (!f) return;
  try {
    const buf = new Uint8Array(await f.arrayBuffer()); inp.value = '';
    let wb;
    if (buf[0] === 0xD0 && buf[1] === 0xCF) throw new Error('this is the old .xls format. In Excel use File > Save As > Excel Workbook (.xlsx), then import that file');
    if (buf[0] === 0x50 && buf[1] === 0x4B) wb = await readXlsx(buf);
    else wb = { sheets: [{ name: f.name, rows: parseCSV(new TextDecoder().decode(buf)) }] };
    const sp = IMPORTS[kind];
    let idx = wb.sheets.findIndex(s => impNorm(s.name) === impNorm(sp.sheet));
    if (idx < 0) idx = wb.sheets.findIndex(s => !/instruction/i.test(s.name) && s.rows.length);
    IMP = { kind, wb, idx: Math.max(0, idx), name: f.name, replace: false, ov: null };
    impShow();
  } catch (e) { console.error(e); toast('Could not read ' + f.name + ': ' + e.message, 'bad'); }
};
App.impSheet = i => { IMP.idx = +i; IMP.ov = null; impShow(); };
App.impMap = (i, k) => { const h = (IMP.prep.heads.find(x => x.i === +i) || {}).h; if (h) impSave(IMP.kind, h, k); IMP.ov = IMP.ov || { hr: IMP.prep.hr }; IMP.ov.hr = IMP.prep.hr; IMP.ov.map = Object.assign(IMP.ov.map || {}, { [+i]: k }); if (k) IMP.prep.heads.forEach(x => { if (x.k === k && x.i !== +i) IMP.ov.map[x.i] = ''; }); impShow(); };
App.impHeader = n => { n = parseInt(n, 10); if (!(n >= 1)) return; IMP.ov = { hr: n - 1 }; impShow(); };
App.impForget = () => { impForget(IMP.kind); IMP.ov = null; impShow(); toast('Your column choices for this list are forgotten.', 'ok'); };
function impColsPanel(prep, kind, open) {
  const sp = IMPORTS[kind], o = [['', '(not used)']].concat(sp.cols.map(c => [c.k, c.h + (c.req ? ' *' : '')]));
  return `<details class="card" ${open ? 'open' : ''}><summary><b>Your columns</b> <span class="muted">${prep.heads.filter(x => x.k).length} of ${prep.heads.length} used &middot; header on row ${prep.hr + 1} - click to check or change</span></summary>
    <p class="small muted">Tell the app which of your columns holds what. Your choice is remembered in this browser for the next import of this list. * = needed for a new row.</p>
    <div class="vtools"><label class="mp">Header row <input type="number" min="1" style="width:5em" value="${prep.hr + 1}" onchange="App.impHeader(this.value)"></label> <a href="#" class="small" onclick="App.impForget(); return false;">Forget my column choices</a></div>
    <div class="tw"><table><thead><tr><th>Your column</th><th>First value</th><th>Use as</th></tr></thead><tbody>${prep.heads.map(x => `<tr><td><b>${esc(x.h || '(no heading)')}</b></td><td class="muted">${esc(x.sample.slice(0, 40))}</td>
      <td><select onchange="App.impMap(${x.i}, this.value)">${opts(o, x.k, false)}</select></td></tr>`).join('')}</tbody></table></div></details>`;
}
App.impReplace = v => { IMP.replace = v; };
function impShow() {
  const { kind, wb, idx, name } = IMP, sp = IMPORTS[kind];
  const prep = IMP.prep = impPrepare(kind, wb.sheets[idx].rows, IMP.ov);
  const sheetSel = wb.sheets.length > 1 ? `<label class="mp">Sheet <select onchange="App.impSheet(this.value)">${opts(wb.sheets.map((s, i) => [i, s.name]), idx, false)}</select></label>` : '';
  if (prep.err) return modal('Import ' + sp.label.toLowerCase(), `<div class="sum"><b>${esc(name)}</b> ${sheetSel}</div><p class="note warn">${esc(prep.err)}</p>${impColsPanel(prep, kind, true)}<p class="small muted">Or download the Excel template to see the expected column names.</p>`, [{ l: 'Download Excel template', fn: () => ACT.impTpl(kind) }], { wide: true, noFocus: true });
  const c = a => prep.rows.filter(r => r.action === a).length;
  const nN = c('New'), nU = c('Update'), nS = c('No change'), nE = c('Error'), go = nN + nU;
  const AF = { New: 'ok', Update: '', 'No change': 'ok', Error: 'bad' };
  const addI = new Set(prep.rows.filter(r => r.action === 'New' || r.action === 'Update').map(r => r.raw._newItem).filter(Boolean)).size;
  const addV = new Set(prep.rows.filter(r => r.action === 'New' || r.action === 'Update').map(r => r.raw._newVendor).filter(Boolean)).size;
  const keepRooms = kind === 'rooms' ? S.rooms.filter(r => !prep.rows.some(x => x.action !== 'Error' && lc(x.key) === lc(r.no))) : [];
  const cols = [
    { h: 'Row', n: 1, v: r => r.n }, { h: 'Key', v: r => `<b>${esc(r.key)}</b>` },
    { h: 'Result', v: r => `<span class="flag ${AF[r.action]}">${esc(r.action)}</span>`, x: r => r.action },
    { h: 'Details', w: 260, v: r => r.E.map(e => `<span class="flag bad">${esc(e)}</span>`).concat(r.W.map(w => `<span class="flag">${esc(w)}</span>`)).join(' ')
        + (r.action === 'Update' ? '<div class="small">' + r.changes.map(k => `${esc(impColByK(kind, k).h)}: ${impShowVal(r.ex[k])} &rarr; ${impShowVal(r.raw[k])}`).join('<br>') + '</div>' : ''),
      x: r => r.E.concat(r.W).concat(r.action === 'Update' ? r.changes.map(k => impColByK(kind, k).h + ': ' + (r.ex[k] ?? '') + ' -> ' + (r.raw[k] ?? '')) : []).join('; ') },
  ].concat(sp.show.map(k => { const cc = impColByK(kind, k), ev = r => r.raw[k] !== undefined ? r.raw[k] : r.ex ? (cc.get ? cc.get(r.ex) : r.ex[k]) : ''; return { h: cc.h, v: r => impShowVal(ev(r)), x: r => ev(r) ?? '' }; }));
  const body = `<div class="sum"><b>${esc(name)}</b> ${sheetSel} <span class="muted">${prep.rows.length} data row(s), header on row ${prep.hr + 1}</span>
      <span class="flag ok">New ${nN}</span> <span class="flag">Update ${nU}</span> <span class="flag ok">No change ${nS}</span> <span class="flag ${nE ? 'bad' : 'ok'}">Errors ${nE}</span></div>
    ${prep.ignored.length ? `<p class="note warn">Columns not used: ${esc(prep.ignored.join(', '))} - if one of them should be imported, choose it in "Your columns" below.</p>` : ''}
    ${impColsPanel(prep, kind, !prep.found || prep.ignored.length > 0)}
    ${addI || addV ? `<p class="note">This import also adds ${addV ? addV + ' new vendor(s) to the vendor list' : ''}${addI && addV ? ' and ' : ''}${addI ? addI + ' new item(s) to the Items list' : ''}. Complete their details (phone, bank, norms) on those lists afterwards.</p>` : ''}
    ${nE ? `<p class="note warn">${nE} row(s) with errors will be skipped. Correct them in Excel and import the file again - rows already imported then show "No change".</p>` : ''}
    ${kind === 'rooms' && keepRooms.length ? `<label class="chk"><input type="checkbox" onchange="App.impReplace(this.checked)"> Replace the room list: remove the ${keepRooms.length} room(s) in the app that are not in this file (rooms with an open request are kept)</label>` : ''}
    ${table('imp', cols, prep.rows, { name: 'Import check ' + sp.label, noTools: prep.rows.length < 12, rowCls: r => '' })}`;
  modal('Import ' + sp.label.toLowerCase() + ' - check', body, [
    go && { l: `Import ${go} row(s)`, cls: 'pri', fn: () => impApply() },
    { l: 'Download Excel template', fn: () => ACT.impTpl(kind) },
  ], { wide: true, noFocus: true });
}
function impApply() {
  const { kind, prep, name } = IMP, sp = IMPORTS[kind];
  if (!sp.can()) return toast(sp.why(), 'bad');
  let nN = 0, nU = 0, nR = 0, nI = 0, nV = 0;
  const clean = o => Object.fromEntries(Object.entries(o).filter(([k]) => k[0] !== '_'));
  prep.rows.forEach(r => {
    if (r.action !== 'New' && r.action !== 'Update') return;
    const ni = r.raw._newItem, nv = r.raw._newVendor;
    if (ni && !S.items.includes(ni)) { if (S.items.some(i => lc(i.code) === lc(ni.code) || lc(i.name) === lc(ni.name))) return; S.items.push(ni); if (!S.lists.units.includes(ni.unit)) S.lists.units.push(ni.unit); nI++; }
    if (nv && !S.vendors.includes(nv)) { if (S.vendors.some(v => lc(v.code) === lc(nv.code) || lc(v.name) === lc(nv.name))) return; S.vendors.push(nv); nV++; }
    if (r.action === 'New') { const o = Object.assign(sp.blank(), clean(r.raw)); if (sp.fix) sp.fix(o); if (sp.apply) sp.apply(o); else sp.list().push(o); nN++; }
    else { if (sp.apply) sp.apply(Object.assign({}, r.ex, clean(r.raw))); else { Object.assign(r.ex, clean(r.raw)); if (sp.fix) sp.fix(r.ex); } nU++; }
  });
  const extra = (nV ? ', ' + nV + ' vendor(s) added' : '') + (nI ? ', ' + nI + ' item(s) added' : '');
  if (kind === 'rooms' && IMP.replace) {
    const inFile = new Set(prep.rows.filter(r => r.action !== 'Error').map(r => lc(r.key)));
    const busy = no => S.jobs.some(j => j.room === no && !j.completed);
    const keep = S.rooms.filter(r => inFile.has(lc(r.no)) || busy(r.no));
    nR = S.rooms.length - keep.length; S.rooms = keep;
  }
  if (sp.after) sp.after();
  if (kind === 'users' && SHARED) S.users.forEach(u => { if (u.cid === undefined) u.cid = ''; });
  IMP = null; closeModal();
  commit('Imported from Excel', `${sp.label}: ${nN} new, ${nU} updated${nR ? ', ' + nR + ' removed' : ''}${extra} (${name})`);
  render(); toast(`${sp.label}: ${nN} added, ${nU} updated${nR ? ', ' + nR + ' removed' : ''}${extra}.`, 'ok');
}
</script>
<script>const PRINT_CSS = document.getElementById('printcss').textContent.replace(/@media print\{[\s\S]*?\}\s*\}/, '');</script>
</body>
